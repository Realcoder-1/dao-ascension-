<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#080810"/>
<title>Dao Ascension</title>
<style>
:root{
  --bg:#080810;--surface:#0f0f1a;--surface2:#161625;--surface3:#1e1e32;--surface4:#26263e;
  --border:#232338;--border2:#323254;
  --text:#ede8dc;--text2:#a09888;--text3:#6a6480;--text4:#3e3a52;
  --gold:#c8a040;--gold2:#f0c060;--gold3:#fde080;
  --jade:#3a9a7a;--jade2:#50c89a;--jade3:#70e8ba;
  --scarlet:#a02840;--scarlet2:#d04060;
  --azure:#2850a0;--azure2:#4878d0;
  --indigo:#4030a0;--indigo2:#6858d8;
  --qi:#5080ff;--qi-glow:rgba(80,128,255,0.3);
  --font-serif:'Georgia','Times New Roman',serif;
  --font-ui:system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --font-mono:'Courier New',monospace;
  --r:8px;--r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
#root{height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:var(--bg);}

/* SCROLLABLE */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px;}
.scroll::-webkit-scrollbar{width:2px;}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);}

/* TOP STRIP */
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--surface4),var(--surface3));border:2px solid var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;position:relative;}
.avatar::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;animation:aura 2.4s ease-in-out infinite;}
@keyframes aura{0%,100%{border-color:transparent;}50%{border-color:var(--qi);box-shadow:0 0 10px var(--qi-glow);}}
.profile-info{flex:1;min-width:0;}
.p-name{font-weight:700;font-size:13px;font-family:var(--font-serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-sub{font-size:11px;color:var(--text2);margin-top:1px;}
.p-res{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.res-row{display:flex;align-items:center;gap:3px;font-size:11px;}
.res-val{font-weight:700;color:var(--gold);font-family:var(--font-mono);}
.res-lbl{color:var(--text3);font-size:10px;}

/* QI BAR */
.qi-bar-wrap{background:var(--surface);padding:5px 12px 7px;border-bottom:1px solid var(--border);flex-shrink:0;}
.qi-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:3px;font-family:var(--font-mono);}
.qi-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.qi-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.qi-pips{display:flex;gap:2px;margin-top:3px;}
.qi-pip{flex:1;height:2px;border-radius:1px;background:var(--surface4);transition:background .3s;}
.qi-pip.on{background:var(--qi);box-shadow:0 0 4px var(--qi-glow);}
.qi-pip.now{background:var(--gold);}

/* SECTION LABEL */
.slabel{padding:14px 14px 6px;font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);}

/* LIST ROW */
.row{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:transparent;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;color:var(--text);transition:background .12s;}
.row:active{background:var(--surface2);}
.row.sel{background:rgba(80,128,255,.07);border-left:2px solid var(--qi);padding-left:12px;}
.row.gold{background:rgba(200,160,64,.07);border-left:2px solid var(--gold);padding-left:12px;}
.row.jade{background:rgba(58,154,122,.06);border-left:2px solid var(--jade2);padding-left:12px;}
.row.red{background:rgba(160,40,64,.06);border-left:2px solid var(--scarlet);padding-left:12px;}
.row.dim{opacity:.5;}
.row-ico{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.row-txt{flex:1;min-width:0;}
.row-title{font-size:13px;font-weight:600;line-height:1.3;}
.row-sub{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.35;}
.row-val{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;margin-left:6px;font-family:var(--font-mono);}
.row-arr{color:var(--text3);font-size:14px;flex-shrink:0;}

/* BOTTOM BAR */
.bottom{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.adv-btn{width:100%;padding:13px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--surface3),var(--surface2));border:1px solid var(--border2);border-bottom:none;color:var(--text);cursor:pointer;letter-spacing:.5px;}
.adv-btn.ready{background:linear-gradient(135deg,#1a3828,#122018);border-color:var(--jade2);color:var(--jade2);animation:bpulse 1.4s ease-in-out infinite;}
@keyframes bpulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 16px rgba(80,200,154,.25);}}
.nav{display:flex;border-top:1px solid var(--border);}
.nav-btn{flex:1;padding:7px 2px 5px;background:transparent;border:none;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:color .12s;}
.nav-btn.on{color:var(--gold);}
.nav-btn .ico{font-size:18px;line-height:1;}

/* HEADER BAR */
.hbar{display:flex;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.hbar-back{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hbar-title{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);}
.hbar-r{width:34px;display:flex;justify-content:flex-end;}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;max-width:430px;left:50%;transform:translateX(-50%);}
.overlay-sheet{background:var(--surface);border-radius:var(--r2);width:90%;max-width:380px;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden;animation:pop-in .22s cubic-bezier(.2,.8,.4,1);}
@keyframes pop-in{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.overlay-scroll{overflow-y:auto;flex:1;padding-bottom:16px;}
.overlay-btn{padding:14px;text-align:center;font-size:14px;font-weight:700;background:var(--surface2);border:none;border-top:1px solid var(--border);color:var(--text);cursor:pointer;width:100%;flex-shrink:0;}
.overlay-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;}
.overlay-btn.danger{color:var(--scarlet2);background:rgba(160,40,64,.1);}

/* TOAST - CENTERED RECTANGULAR */
#toast-host{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:80vw;max-width:320px;}
.toast{background:rgba(15,15,26,.97);border:1px solid var(--border2);border-radius:var(--r);padding:10px 18px;font-size:12px;color:var(--text);text-align:center;line-height:1.5;box-shadow:0 4px 24px rgba(0,0,0,.7);animation:tin .25s ease;max-width:100%;}
.toast.good{border-color:rgba(80,200,120,.4);color:var(--jade2);}
.toast.bad{border-color:rgba(220,60,80,.4);color:var(--scarlet2);}
.toast.great{border-color:rgba(200,160,64,.5);color:var(--gold2);}
@keyframes tin{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}

/* CARDS */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin:6px 12px;padding:12px;}
.card-t{font-size:13px;font-weight:700;margin-bottom:4px;font-family:var(--font-serif);}
.card-s{font-size:11px;color:var(--text2);line-height:1.55;}
.card.good{border-color:rgba(80,200,154,.3);background:rgba(58,154,122,.06);}
.card.warn{border-color:rgba(200,160,64,.3);background:rgba(200,160,64,.05);}
.card.bad{border-color:rgba(160,40,64,.3);background:rgba(160,40,64,.06);}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 12px;}
.scell{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:9px 6px;text-align:center;}
.sval{font-size:17px;font-weight:800;font-family:var(--font-mono);}
.skey{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

/* PILLS */
.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.pill.c{background:rgba(160,152,136,.18);color:var(--text2);}
.pill.r{background:rgba(80,128,255,.18);color:#8ab0ff;}
.pill.l{background:rgba(192,160,64,.18);color:var(--gold2);}
.pill.m{background:rgba(180,80,255,.18);color:#c880ff;}

/* NOTICES */
.notice{padding:9px 12px;background:rgba(80,128,255,.07);border:1px solid rgba(80,128,255,.18);border-radius:var(--r);margin:6px 12px;font-size:11px;color:var(--text2);line-height:1.5;}
.notice.warn{background:rgba(200,160,64,.07);border-color:rgba(200,160,64,.25);color:#d4a84a;}
.notice.bad{background:rgba(160,40,64,.08);border-color:rgba(160,40,64,.25);color:var(--scarlet2);}
.notice.good{background:rgba(58,154,122,.08);border-color:rgba(58,154,122,.25);color:var(--jade2);}

/* SETUP */
.setup-wrap{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 15%,rgba(80,60,160,.25),transparent 55%),var(--bg);overflow:hidden;}
.splash{padding:28px 20px 14px;text-align:center;flex-shrink:0;}
.splash-logo{font-family:var(--font-serif);font-size:30px;font-weight:700;color:var(--gold2);letter-spacing:5px;text-shadow:0 0 30px rgba(240,192,96,.4);margin-bottom:4px;}
.splash-sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}
.setup-scroll{flex:1;overflow-y:auto;padding-bottom:100px;}
.setup-cta{position:sticky;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,var(--bg) 30%);}
.cta-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:var(--r2);color:#000;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;}
.cta-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--surface3);color:var(--text3);}
.cta-btn.sec{background:linear-gradient(135deg,var(--azure),var(--azure2));color:var(--text);}

/* BREAKTHROUGH */
.bt-overlay{text-align:center;padding:24px 20px;}
.bt-emoji{font-size:64px;margin-bottom:12px;animation:popin .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes popin{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.bt-title{font-size:22px;font-weight:800;color:var(--gold2);text-shadow:0 0 24px rgba(240,192,96,.5);letter-spacing:3px;font-family:var(--font-serif);}
.bt-realm{font-size:15px;padding:4px 0 12px;font-weight:600;}

/* TERRITORY BAR */
.terr-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 12px;}
.terr-cell{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center;}
.terr-num{font-size:22px;font-weight:800;font-family:var(--font-mono);}
.terr-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

/* NPC CARD */
.npc-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin:6px 12px;padding:12px;}
.npc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.npc-portrait{width:44px;height:44px;border-radius:50%;background:var(--surface3);border:2px solid var(--border2);font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.npc-info{flex:1;}
.npc-name{font-size:13px;font-weight:700;font-family:var(--font-serif);}
.npc-role{font-size:10px;color:var(--text3);margin-top:2px;}
.npc-desire{font-size:10px;color:var(--text3);font-style:italic;margin-top:2px;}
.npc-bond{font-size:18px;font-weight:800;font-family:var(--font-mono);}
.bond-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.bond-fill{height:100%;border-radius:2px;transition:width .4s;}
.bond-fill.pos{background:linear-gradient(90deg,var(--jade),var(--jade2));}
.bond-fill.neg{background:linear-gradient(90deg,var(--scarlet),var(--scarlet2));}
.npc-acts{display:flex;gap:6px;flex-wrap:wrap;}
.npc-act{padding:7px 10px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r);font-size:11px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;}
.npc-act.jade{border-color:var(--jade);color:var(--jade2);}
.npc-act.gold{border-color:var(--gold);color:var(--gold2);}
.npc-act.red{border-color:var(--scarlet);color:var(--scarlet2);}

/* BIZ GRID */
.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px;}
.biz-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:4px;}
.biz-card:active{border-color:var(--gold);}
.biz-card.owned{border-color:var(--jade);}
.biz-card.dim{opacity:.45;cursor:not-allowed;}
.biz-icon{font-size:24px;}
.biz-name{font-size:12px;font-weight:700;line-height:1.2;}
.biz-desc{font-size:10px;color:var(--text2);line-height:1.4;}
.biz-cost{font-size:11px;color:var(--gold);font-weight:700;font-family:var(--font-mono);}
.biz-yield{font-size:10px;color:var(--jade2);}

/* AUCTION */
.bid-row{display:flex;gap:6px;margin-top:8px;}
.bid-inc{flex:1;padding:10px 4px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;}
.bid-commit{width:100%;padding:13px;margin-top:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:var(--r);color:#000;font-size:14px;font-weight:800;cursor:pointer;}
.bid-commit:disabled{opacity:.35;cursor:not-allowed;background:var(--surface3);color:var(--text3);}

/* RANK STRIP */
.rank-strip{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;}
.rank-pip{flex-shrink:0;padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:10px;color:var(--text3);white-space:nowrap;}
.rank-pip.cur{background:rgba(200,160,64,.15);border-color:var(--gold);color:var(--gold2);font-weight:700;}
.rank-pip.done{background:rgba(58,154,122,.1);border-color:var(--jade);color:var(--jade2);}

/* WINDFALL */
.windfall{margin:8px 12px;padding:12px;background:linear-gradient(135deg,rgba(192,160,64,.12),rgba(192,160,64,.04));border:1px solid rgba(192,160,64,.35);border-radius:var(--r2);cursor:pointer;position:relative;overflow:hidden;}
.windfall::before{content:'✨';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.3;}
.windfall-t{font-size:13px;font-weight:700;color:var(--gold2);font-family:var(--font-serif);}
.windfall-s{font-size:11px;color:var(--text2);margin-top:2px;}

/* DEATH SCREEN */
.dead-wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at center,rgba(160,40,64,.18),transparent 60%),var(--bg);}

/* CHOICE OVERLAY */
.choice-opts{padding:0;}
.choice-opt{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:none;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;text-align:left;color:var(--text);}
.choice-opt:active{background:var(--surface2);}
.choice-ico{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.choice-lbl{font-size:13px;font-weight:600;}

/* TROOP TIERS */
.troop-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px;}
.troop-cell{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center;}
.troop-ico{font-size:20px;}
.troop-n{font-size:16px;font-weight:800;font-family:var(--font-mono);margin-top:2px;}
.troop-lbl{font-size:9px;color:var(--text3);margin-top:2px;}
.troop-pow{font-size:10px;color:var(--gold);margin-top:2px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-host"></div>
<script>
'use strict';
// ═══════════════════════════════════════════════════
// DAO ASCENSION — COMPLETE REBUILD
// BitLife-style Xianxia simulator
// ═══════════════════════════════════════════════════

// ─── UTILITIES ───────────────────────────────────
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const byKey=(a,k)=>a.find(x=>x.key===k);
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=10000?(n/1000).toFixed(1)+'K':''+Math.round(n);

// ─── TOAST (centered rectangular) ────────────────
let _tq=[],_ta=false;
function toast(msg,type='',dur=2600){
  _tq.push({msg,type,dur});
  if(!_ta)_drainToast();
}
function _drainToast(){
  if(!_tq.length){_ta=false;return;}
  _ta=true;
  const {msg,type,dur}=_tq.shift();
  const h=document.getElementById('toast-host');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  h.appendChild(el);
  setTimeout(()=>{el.remove();_drainToast();},dur);
}

// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
const REALMS=[
  {key:'mortal',         name:'Mortal',                  tier:'Mortal',    qiCap:100,  lifespan:80,    chance:95,color:'#a09888',emoji:'🧘',stage:0},
  {key:'qi_refine',      name:'Qi Refinement',           tier:'Mortal',    qiCap:160,  lifespan:120,   chance:82,color:'#7090d0',emoji:'💠',stage:0},
  {key:'foundation',     name:'Foundation Establishment',tier:'Mortal',    qiCap:260,  lifespan:220,   chance:70,color:'#60a0e0',emoji:'🔷',stage:0},
  {key:'golden_core',    name:'Golden Core',             tier:'Mortal',    qiCap:400,  lifespan:500,   chance:58,color:'#c8a040',emoji:'⭐',stage:0},
  {key:'nascent_soul',   name:'Nascent Soul',            tier:'Mortal',    qiCap:600,  lifespan:1000,  chance:47,color:'#50c89a',emoji:'🌟',stage:0},
  {key:'soul_form',      name:'Soul Formation',          tier:'Mortal',    qiCap:900,  lifespan:3000,  chance:38,color:'#8058e8',emoji:'🌀',stage:0},
  {key:'void_amal',      name:'Void Amalgamation',       tier:'Spirit',    qiCap:1300, lifespan:10000, chance:30,color:'#a060ff',emoji:'🌌',stage:1},
  {key:'body_integ',     name:'Body Integration',        tier:'Spirit',    qiCap:1900, lifespan:25000, chance:24,color:'#ff8040',emoji:'💥',stage:1},
  {key:'tribulation',    name:'Tribulation Transcendence',tier:'Spirit',   qiCap:2700, lifespan:50000, chance:18,color:'#ffcc00',emoji:'⚡',stage:1},
  {key:'mahayana',       name:'Mahayana',                tier:'Spirit',    qiCap:3800, lifespan:100000,chance:14,color:'#ff60a0',emoji:'🔮',stage:1},

function rollPhysique(){
  const tot=PHYSIQUES.reduce((s,p)=>s+p.w,0);let r=Math.random()*tot;
  for(const p of PHYSIQUES){r-=p.w;if(r<=0)return p.key;}
  return 'mortal_frame';
}

  return {

    selectedPhysique:rollPhysique(),

function writeLog(s,title,text,cat='World',tone='neutral'){
  const e={year:s.year,age:s.age,title,text,category:cat,tone};
  s.eventLog.unshift(e);if(s.eventLog.length>300)s.eventLog.length=300;
  s.latestEntry=e;
}

function startGame(s){
  const origin=byKey(ORIGINS,s.selectedOrigin);
  const temp=byKey(TEMPERAMENTS,s.selectedTemperament);
  const phy=byKey(PHYSIQUES,s.selectedPhysique);
  const sectDef=s.selectedSect?byKey(SECTS,s.selectedSect):null;
  // Build stats
  const base={body:48,comprehension:50,will:48,charm:42,luck:45,purity:54,karma:0,ambition:50,stability:52,social:44,business:42,reputation:10,ruthlessness:30,instability:0};
  const addSt=(st)=>{if(!st)return;Object.entries(st).forEach(([k,v])=>{if(k in base)base[k]=clamp(base[k]+v,k==='karma'?-100:0,100);});};
  addSt(origin.stats);addSt(temp.stats);if(sectDef)addSt(sectDef.stats);
  s.stats={...base};
  s.res.silver=origin.res.silver;s.res.stones=origin.res.stones;
  s.qiCap=REALMS[0].qiCap;s.qi=0;
  // Init relations
  s.relations=RELATION_POOL.map(r=>({...r,bond:r.base+rand(-8,8),trust:clamp(r.base+rand(-12,12),-100,100),giftCooldown:0}));
  // Join sect
  if(s.selectedPath==='sect'&&s.selectedSect){
    s.sect.joined=true;s.sect.key=s.selectedSect;s.sect.rankKey='layman';
    const sm=MANUALS.find(m=>m.reqR===0&&!s.inv.manuals.includes(m.key));
    if(sm)s.inv.manuals.push(sm.key);
  }
  s.screen='game';s.activeTab='chronicle';
  writeLog(s,'Journey Begins','Your path opens. The world is vast and indifferent.','Life','good');
}

// ─── GAME MECHANICS ──────────────────────────────
function getPhy(s){return byKey(PHYSIQUES,s.selectedPhysique)||PHYSIQUES[0];}
function getRealm(s){return REALMS[clamp(s.realmIndex,0,REALMS.length-1)];}
function lifespanCap(s){
  const r=getRealm(s);
  const bonus=Math.round((s.stats.body-50)*12)+Math.round((s.stats.will-50)*8)+Math.round((s.stats.purity-50)*14);
  return Math.max(r.lifespan+bonus,Math.round(r.lifespan*.8));
}
function minorQiNeeded(s){
  const r=getRealm(s);
  const base=r.qiCap/9;
  return Math.round(base*(1+(s.minorLevel-1)*.1+s.realmIndex*.15));
}
function cultivSpeed(s){
  const phy=getPhy(s);
  let base=10+Math.round((s.stats.comprehension-50)*.15)+Math.round((s.stats.purity-50)*.12)+Math.round((s.stats.will-50)*.08);
  base=Math.max(2,base-s.realmIndex*.6);
  base=Math.round(base*phy.mult);
  if(s.beast.activeKey){const b=byKey(BEASTS,s.beast.activeKey);if(b)base+=b.cultivBonus;}
  // Elder master bonus
  if(s.sect.chosenElder)base+=3;
  return Math.max(1,base);
}
function btProfile(s){
  const r=getRealm(s);const phy=getPhy(s);
  let chance=r.chance+phy.smod;
  chance+=Math.round((s.stats.comprehension-50)*.15)+Math.round((s.stats.stability-50)*.10)+Math.round((s.stats.purity-50)*.10);
  // Manual bonuses
  for(const mk of s.inv.manuals){const m=byKey(MANUALS,mk);if(m)chance+=m.success*.5;}
  chance-=Math.round(s.stats.instability*.4);
  if(s.stats.karma<-20)chance-=Math.round(Math.abs(s.stats.karma+20)*.2);
  if(s.family.daoComp)chance+=8;
  chance+=(s.inv.consumables.successBoost||0);
  chance=clamp(chance,5,97);
  const stab=clamp(60+Math.round((s.stats.stability-50)*.5)-Math.round(s.stats.instability*.3)+(s.inv.consumables.stabilityBoost||0),10,95);
  const fatal=clamp(Math.round((100-stab)*.1)+(s.realmIndex>6?5:0),0,35);
  return{chance,stability:stab,fatality:fatal};
}

// Territory privy purse calculation
function privy(s){
  return s.territories.mortal*50+s.territories.spiritual*200+s.territories.immortal*800;
}

// Military power calculation
function militaryPower(s){
  let p=0;
  for(const[k,n] of Object.entries(s.troops)){const t=byKey(TROOP_TIERS,k);if(t)p+=t.power*n;}
  for(const[k,n] of Object.entries(s.generals)){const g=byKey(GENERAL_TIERS,k);if(g)p+=g.power*n;}
  p+=powerRating(s)*.5;
  return Math.round(p);
}

function powerRating(s){
  let p=s.realmIndex*800+s.minorLevel*80;
  p+=s.stats.body+s.stats.will+s.stats.comprehension;
  p+=s.inv.artifacts.length*150;
  p+=(s.beast.activeKey?(byKey(BEASTS,s.beast.activeKey)?.cultivBonus||0)*80:0);
  p+=s.territories.mortal*200+s.territories.spiritual*600+s.territories.immortal*2000;
  return Math.round(p);
}

function totalTroops(s){
  return Object.values(s.troops).reduce((a,b)=>a+b,0);
}
function totalGenerals(s){
  return Object.values(s.generals).reduce((a,b)=>a+b,0);
}

// Casualty calculation: ~20% base, reduced by troop quality
function calcCasualties(s,tier){
  const total=totalTroops(s);if(total===0)return 0;
  let base=0.20; // 20% base
  // Better troops reduce casualties
  const elite=(s.troops.spirit_warrior||0)+(s.troops.divine_guard||0);
  const eliteRatio=elite/Math.max(1,total);
  base=base*(1-eliteRatio*.5); // elite troops halve casualty rate
  // Generals reduce casualties
  const genBonus=totalGenerals(s)*.02;
  base=Math.max(.05,base-genBonus);
  // Scale with held territories
  const terr=tier==='mortal'?s.territories.mortal:tier==='spiritual'?s.territories.spiritual:s.territories.immortal;
  const terrScale=1+terr*.1; // more territory = more casualties proportionally
  return Math.min(.6,base*terrScale);
}

// Actions
function resolveCultivate(s){
  const gain=cultivSpeed(s);
  s.minorQi=(s.minorQi||0)+gain;
  const needed=minorQiNeeded(s);
  let leveled=false;
  while(s.minorQi>=needed&&s.minorLevel<9){s.minorQi-=needed;s.minorLevel++;leveled=true;}
  if(s.minorLevel>=9)s.minorQi=Math.min(s.minorQi,needed);
  const pct=(s.minorLevel-1)/8+Math.min(s.minorQi/needed,1)/9;
  s.qi=clamp(Math.round(pct*s.qiCap),0,s.qiCap);
  s.stats.purity=clamp(s.stats.purity+1,0,100);s.stats.instability=clamp(s.stats.instability-1,0,100);
  writeLog(s,leveled?`Minor Level ${s.minorLevel} Achieved`:'Closed-Door Cultivation',leveled?`Reached Lv${s.minorLevel}/9 in ${getRealm(s).name}.`:`Gained ${gain} qi this year.`,'Cultivation',leveled?'good':'neutral');
}

function resolveStudy(s){
  const gain=rand(8,18)+Math.round((s.stats.comprehension-50)*.16);
  s.res.insight+=gain;s.stats.comprehension=clamp(s.stats.comprehension+1,0,100);
  const avail=MANUALS.filter(m=>s.realmIndex>=m.reqR&&!s.inv.manuals.includes(m.key)&&m.rarity!=='Mythic');
  if(avail.length&&Math.random()<.15){const m=pick(avail);s.inv.manuals.push(m.key);writeLog(s,'Manual Discovered',`Study resolved into ${m.name}.`,'Study','good');}
  else writeLog(s,'Doctrine Study',`Gained ${gain} insight.`,'Study','neutral');
}

function resolveSectDuty(s){
  if(!s.sect.joined){writeLog(s,'No Sect Affiliation','You are a wandering cultivator.','Sect','bad');return;}
  const merit=20+rand(6,20);const favor=4+rand(1,7);
  s.res.merit+=merit;s.sect.favor=clamp(s.sect.favor+favor,0,100);s.sect.merit=(s.sect.merit||0)+merit;
  autoPromote(s);
  if(Math.random()<.22){s.stats.karma=clamp(s.stats.karma-4,-100,100);writeLog(s,'Sect Duty — Dirty Work',`Earned ${merit} merit, but soiled karma.`,'Sect','bad');}
  else writeLog(s,'Sect Duty Completed',`Earned ${merit} merit and ${favor} favor.`,'Sect','good');
}

function resolveExplore(s){
  const loc=byKey(LOCATIONS,s.locationKey);
  if(loc.stage>0&&s.realmIndex<loc.stage*6){writeLog(s,'Realm Locked','Need higher cultivation for this location.','World','bad');return;}
  const haul=rand(22,70)+loc.wealth*8;
  const danger=loc.danger+Math.round(s.stats.instability*.45)-Math.round(s.stats.body*.28)-(s.inv.consumables.dangerReduce||0);
  s.res.stones+=haul;s.res.herbs+=rand(1,3);s.res.insight+=rand(5,15);
  if(Math.random()<.04&&!s.beast.pendingEgg&&!s.beast.activeKey){s.beast.pendingEgg=true;writeLog(s,'Beast Egg Found','A pulsing egg chose you.','Beast','good');}
  if(Math.random()*100<clamp(danger,5,70)){
    s.stats.body=clamp(s.stats.body-rand(1,5),0,100);s.stats.instability=clamp(s.stats.instability+rand(5,12),0,100);
    writeLog(s,'Expedition Injury',`Returned with ${haul} stones but torn meridians.`,'World','bad');
  } else {
    if(Math.random()<.2)s.res.relics++;
    writeLog(s,'Expedition Success',`Explored ${loc.name}. Returned richer and wiser.`,'World','good');
  }
  if(s.inv.consumables.dangerReduce)s.inv.consumables.dangerReduce=0;
}

function resolveMarket(s){
  const gain=rand(10,28)+Math.round((s.stats.business-50)*.35);
  s.res.silver+=gain*8;s.res.stones+=Math.max(0,Math.round(gain/3));
  writeLog(s,'Market Arbitrage','Traded resources. Liquidity improved.','Market','good');
}

function resolveRomance(s){
  const cands=s.relations.filter(r=>RELATION_POOL.find(p=>p.key===r.key)?.romanceable);
  const best=cands.sort((a,b)=>(b.bond+b.trust)-(a.bond+a.trust))[0];
  if(best){best.bond=clamp(best.bond+rand(8,16),-100,100);best.trust=clamp(best.trust+rand(7,14),-100,100);}
  s.stats.charm=clamp(s.stats.charm+1,0,100);
  // Check marriage
  const propCount=[s.family.spouse,s.family.spouse2,s.family.spouse3].filter(Boolean).length;
  const maxWives=_maxWives(s);
  if(propCount<maxWives&&best&&best.bond>=60&&Math.random()<.28){
    if(!s.family.spouse){s.family.spouse=best.name;}
    else if(!s.family.spouse2&&s.realmIndex>=2){s.family.spouse2=best.name;}
    else if(!s.family.spouse3&&s.realmIndex>=4){s.family.spouse3=best.name;}
    s.metrics.marriages++;writeLog(s,'Marriage Secured',`You and ${best.name} formalized the bond.`,'Bonds','good');
    return;
  }
  if(!s.family.daoComp&&best&&best.trust>=70&&Math.random()<.24){
    s.family.daoComp=best.name;writeLog(s,'Dao Companion Bound',`${best.name} accepted cultivation bond.`,'Bonds','good');return;
  }
  if(s.family.spouse&&Math.random()<.3){s.family.heirs++;writeLog(s,'Heir Born','A child enters your house.','Bonds','good');return;}
  writeLog(s,'Bond Cultivation','You invested in courtship and alliances.','Bonds','neutral');
}

function _maxWives(s){
  let cap=1;
  for(const pk of s.inv.properties){const p=byKey(PROPERTIES,pk);if(p&&p.wifeCap>cap)cap=p.wifeCap;}
  return cap;
}

function resolveBusiness(s){
  if(!s.businesses.length){writeLog(s,'No Enterprise','Open the Business tab.','Business','neutral');return;}
  let ts=0,tsi=0;
  for(const biz of s.businesses){
    const def=byKey(BUSINESSES_DEF,biz.key);if(!def)continue;
    const profit=def.yieldSt+Math.round((s.stats.business-50)*.5)+biz.level*8;
    const silv=def.yieldSi+Math.round((s.stats.business-50)*2)+biz.level*20;
    if(Math.random()*100<def.risk){s.res.stones=Math.max(0,s.res.stones-Math.round(profit*.4));writeLog(s,'Business Setback',`${def.name} suffered a setback.`,'Business','bad');}
    else{ts+=profit;tsi+=silv;biz.years++;biz.level=Math.min(10,1+Math.floor(biz.years/3));}
  }
  if(ts||tsi){s.res.stones+=ts;s.res.silver+=tsi;writeLog(s,'Enterprise Profits',`Returned ${ts} stones and ${tsi} silver.`,'Business','good');}
}

function resolveBeast(s){
  if(!s.beast.activeKey){writeLog(s,'No Beast Companion','Find an egg at market or auction.','Beast','neutral');return;}
  s.beast.loyalty=clamp(s.beast.loyalty+rand(6,14),0,100);s.beast.score++;s.stats.reputation=clamp(s.stats.reputation+2,0,100);
  const b=byKey(BEASTS,s.beast.activeKey);
  writeLog(s,'Beast Companion Grows',`Your ${b.name} matured and improved your aura.`,'Beast','good');
}

function resolveJob(s){
  const job=byKey(MORTAL_JOBS,s.currentJob)||MORTAL_JOBS[0];
  if(job.itype==='silver')s.res.silver+=job.income+rand(-10,20);
  else s.res.stones+=job.income+rand(-2,5);
  s.stats.social=clamp(s.stats.social+1,0,100);
  writeLog(s,'Job Income',`Earned income as ${job.name}.`,'Work','neutral');
}

function passiveEffects(s){
  // Sect stipend
  if(s.sect.joined){const rank=byKey(SECT_RANKS,s.sect.rankKey)||SECT_RANKS[0];s.res.stones+=rank.stipS;s.res.silver+=rank.stipSi;}
  // Business passive (25% when not actively running)
  if(s.selectedAction!=='business'){
    for(const biz of s.businesses){const def=byKey(BUSINESSES_DEF,biz.key);if(def){s.res.stones+=Math.round(def.yieldSt*.25);s.res.silver+=Math.round(def.yieldSi*.25);}}
  }
  // Territory privy purse
  s.res.silver+=privy(s);
  // Upkeep
  const upkeep=8+s.territories.mortal*2+s.territories.spiritual*5+s.territories.immortal*15;
  s.res.silver=Math.max(0,s.res.silver-upkeep);
  // Debt
  if(s.res.debt>0){const pay=Math.min(s.res.silver,Math.ceil(s.res.debt*.1));s.res.silver-=pay;s.res.debt=Math.max(0,s.res.debt-pay);}
  // Beast loyalty drift
  if(s.beast.activeKey)s.beast.loyalty=clamp(s.beast.loyalty+1,0,100);
  // Instability decay
  s.stats.instability=clamp(s.stats.instability-1,0,100);
  // Reputation from realm
  s.stats.reputation=clamp(s.stats.reputation+Math.round(s.realmIndex*.4),0,100);
  // Elder master bonus: comprehension
  if(s.sect.chosenElder)s.stats.comprehension=clamp(s.stats.comprehension+1,0,100);
}

function autoPromote(s){
  if(!s.sect.joined)return;
  const eligible=SECT_RANKS.filter(r=>s.realmIndex>=r.minR&&(s.res.merit||0)>=r.minM);
  if(eligible.length){const best=eligible[eligible.length-1];if(best.key!==s.sect.rankKey){s.sect.rankKey=best.key;writeLog(s,'Sect Promotion',`Elevated to ${best.name}.`,'Sect','good');}}
}

function maybeQueueEvent(s){
  if(s.overlay==='choice')return;
  const pool=YEAR_EVENTS.filter(e=>e.realm===-1||s.realmIndex>=e.realm);
  if(pool.length&&Math.random()<.28){s.overlay='choice';s.overlayData={...pick(pool)};}
}

function updateRelations(s){
  s.relations=s.relations.map(r=>{
    const drift=(s.selectedAction==='romance'&&['comp_lian','comp_mei','comp_su'].includes(r.key))?rand(3,8):rand(-1,3);
    if(r.giftCooldown>0)r.giftCooldown--;
    return{...r,bond:clamp(r.bond+drift,-100,100),trust:clamp(r.trust+rand(-1,2),-100,100)};
  });
}

function attemptBreakthrough(s){
  if(s.minorLevel<9){writeLog(s,'Breakthrough Blocked','Reach Minor Level 9 first.','Cultivation','bad');toast('Need Minor Level 9 first','bad');return;}
  const profile=btProfile(s);
  s.inv.consumables.successBoost=0;s.inv.consumables.stabilityBoost=0;
  const prevLifespan=lifespanCap(s);
  if(Math.random()*100<=profile.chance){
    const nextIdx=s.realmIndex+1;
    if(nextIdx>=REALMS.length){writeLog(s,'Supreme Peak','You have reached the apex of existence.','Cultivation','good');return;}
    s.realmIndex=nextIdx;s.minorLevel=1;s.minorQi=0;
    s.qiCap=getRealm(s).qiCap;s.qi=Math.round(s.qiCap*.1);
    s.stats.instability=clamp(s.stats.instability-Math.round(profile.stability*.2),0,100);
    s.stats.will=clamp(s.stats.will+2,0,100);s.res.insight+=25;s.res.merit+=50;
    s.sect.favor=clamp(s.sect.favor+12,0,100);s.metrics.breakthroughs++;
    autoPromote(s);
    const lifespanGain=Math.max(0,lifespanCap(s)-prevLifespan);
    s.overlay='breakthrough';s.overlayData={realm:getRealm(s).name,tier:getRealm(s).tier,lifespanGain,realmIdx:s.realmIndex};
    writeLog(s,'Major Breakthrough!',`Entered ${getRealm(s).name}. The heavens tremble.`,'Cultivation','good');
  } else {
    s.stats.instability=clamp(s.stats.instability+rand(8,22),0,100);
    s.stats.body=clamp(s.stats.body-rand(2,5),0,100);
    s.stats.purity=clamp(s.stats.purity-rand(2,6),0,100);
    s.qi=Math.round(s.qiCap*.4);
    writeLog(s,'Breakthrough Recoil','The realm wall held. Begin again.','Cultivation','bad');
    toast('Breakthrough failed — instability increased','bad');
  }
}

function resolveYearChoice(s,optKey){
  if(!s.overlayData)return;
  const ev=s.overlayData;
  const opt=ev.opts?.find(o=>o.key===optKey);if(!opt)return;
  const eff=opt.eff||{};
  if(eff.stones)s.res.stones=Math.max(0,s.res.stones+eff.stones);
  if(eff.silver)s.res.silver=Math.max(0,s.res.silver+eff.silver);
  if(eff.debt)s.res.debt+=eff.debt;
  if(eff.insightGain)s.res.insight+=eff.insightGain;
  if(eff.merit)s.res.merit+=eff.merit;
  if(eff.sectFavor)s.sect.favor=clamp(s.sect.favor+(eff.sectFavor),0,100);
  if(eff.karma)s.stats.karma=clamp(s.stats.karma+(eff.karma),-100,100);
  if(eff.will)s.stats.will=clamp(s.stats.will+(eff.will),0,100);
  if(eff.body)s.stats.body=clamp(s.stats.body+(eff.body),0,100);
  if(eff.reputation)s.stats.reputation=clamp(s.stats.reputation+(eff.reputation),0,100);
  if(eff.social)s.stats.social=clamp(s.stats.social+(eff.social),0,100);
  if(eff.comprehension)s.stats.comprehension=clamp(s.stats.comprehension+(eff.comprehension),0,100);
  if(eff.stability)s.stats.stability=clamp(s.stats.stability+(eff.stability),0,100);
  if(eff.success)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+(eff.success);
  if(eff.daoCompBond&&s.family.daoComp){const r=s.relations.find(x=>x.name===s.family.daoComp);if(r)r.bond=clamp(r.bond+(eff.daoCompBond),-100,100);}
  writeLog(s,ev.title,opt.res,'Choice','good');
  s.overlay=null;s.overlayData=null;
}

function contestTerritory(s,tier){
  const req={mortal:4,spiritual:6,immortal:10};
  if(s.realmIndex<req[tier]){toast(`Need Realm ${req[tier]+1}+ for ${tier} territory`,'bad');return;}
  const myPow=militaryPower(s);
  const defense={mortal:700,spiritual:2000,immortal:8000}[tier];
  const chance=clamp(Math.round((myPow/defense)*50)+10,8,88);
  // Calculate casualties (~20% base)
  const casualtyRate=calcCasualties(s,tier);
  // Apply casualties regardless of win/loss
  for(const k of Object.keys(s.troops)){
    const losses=Math.round((s.troops[k]||0)*casualtyRate);
    s.troops[k]=Math.max(0,(s.troops[k]||0)-losses);
  }
  s.stats.body=clamp(s.stats.body-rand(1,3),0,100);
  if(Math.random()*100<chance){
    s.territories[tier]++;
    writeLog(s,'Territory Seized',`Won ${tier} territory. Casualty rate: ${Math.round(casualtyRate*100)}%.`,'War','good');
    toast(`⚔️ ${tier} territory captured!`,'good');
  } else {
    s.stats.instability=clamp(s.stats.instability+rand(3,8),0,100);
    writeLog(s,'Campaign Failed',`Lost the battle. ${Math.round(casualtyRate*100)}% casualties.`,'War','bad');
    toast(`Campaign failed — ${Math.round(casualtyRate*100)}% casualties`,'bad');
  }
}

function advanceYear(s){
  if(s.screen!=='game')return;
  if(s.overlay==='choice')return;
  const handlers={cultivate:resolveCultivate,study:resolveStudy,sect_duty:resolveSectDuty,explore:resolveExplore,market:resolveMarket,romance:resolveRomance,beast:resolveBeast,business:resolveBusiness,job:resolveJob};
  handlers[s.selectedAction]?.(s);
  passiveEffects(s);updateRelations(s);maybeQueueEvent(s);
  s.year++;s.age++;
  // Death check
  const cap=lifespanCap(s);
  if(s.age>=cap||s.stats.instability>=95){
    writeLog(s,s.stats.instability>=95?'Qi Deviation — Death':'Lifespan Exhausted','The heavens have closed their eyes.','Legacy','bad');
    s.screen='dead';
  }
  if(s.stats.instability>=80&&s.stats.instability<95)toast(`⚠ Instability critical: ${s.stats.instability}/100`,'bad');
  if(s.minorLevel>=9&&s.screen==='game')toast('🌟 Minor Level 9! Breakthrough ready.','');
}

function activateWindfall(s){
  if(s.windfallUsed>=2)return;
  s.pendingWindfall=pick(WINDFALL_EVENTS);
  s.overlay='windfall';
}

function claimWindfall(s){
  const wf=s.pendingWindfall;if(!wf){s.overlay=null;return;}
  s.res.stones+=wf.stones;s.res.silver+=wf.silver;s.res.insight+=wf.insight;
  if(wf.special==='relic')s.res.relics++;
  if(wf.special==='manual'){const el=MANUALS.filter(m=>s.realmIndex>=m.reqR&&!s.inv.manuals.includes(m.key));if(el.length)s.inv.manuals.push(pick(el).key);}
  if(wf.special==='comprehension_boost')s.stats.comprehension=clamp(s.stats.comprehension+12,0,100);
  if(wf.special==='physique_boost'){s.stats.purity=clamp(s.stats.purity+8,0,100);s.stats.stability=clamp(s.stats.stability+5,0,100);}
  if(wf.special==='beast_egg'&&!s.beast.pendingEgg&&!s.beast.activeKey)s.beast.pendingEgg=true;
  s.windfallUsed++;s.pendingWindfall=null;
  writeLog(s,'Windfall Claimed',`${wf.name}: ${wf.desc}`,'Fortune','good');
  toast(`✨ ${wf.name}`,'great',3000);
  s.overlay=null;
}

function getShopItems(s){
  const tier=Math.min(4,Math.floor(s.realmIndex/3));
  const items=SHOP_ITEMS.filter(i=>i.tier<=tier);
  const seed=s.year*37+s.realmIndex*13;
  return [...items].sort((a,b)=>((seed*(a.key.charCodeAt(0)||1))%97)-((seed*(b.key.charCodeAt(0)||1))%97)).slice(0,10);
}

function buyShopItem(s,key){
  const item=getShopItems(s).find(i=>i.key===key);if(!item)return;
  const cSt=item.costSt||0,cSi=item.costSi||0;
  if(cSt&&s.res.stones<cSt){toast(`Need ${cSt}💎`,'bad');return;}
  if(cSi&&s.res.silver<cSi){toast(`Need ${cSi}🪙`,'bad');return;}
  if(cSt)s.res.stones-=cSt;if(cSi)s.res.silver-=cSi;
  const eff=item.eff||{};
  if(eff.qiBoost)s.minorQi=(s.minorQi||0)+eff.qiBoost;
  if(eff.statBoost)Object.entries(eff.statBoost).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+v,0,100);});
  if(eff.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+eff.successBoost;
  if(eff.stabilityBoost)s.inv.consumables.stabilityBoost=(s.inv.consumables.stabilityBoost||0)+eff.stabilityBoost;
  if(eff.insightBoost)s.res.insight+=eff.insightBoost;
  if(eff.purityBoost)s.stats.purity=clamp(s.stats.purity+eff.purityBoost,0,100);
  if(eff.qiCapBoost)s.qiCap+=eff.qiCapBoost;
  if(eff.immortalJade)s.res.immortalJade+=eff.immortalJade;
  if(eff.beastEgg&&!s.beast.activeKey&&!s.beast.pendingEgg){s.beast.pendingEgg=true;s.beast.pendingTier=eff.rare?'rare':'common';toast('🥚 Beast egg acquired!','good');}
  if(eff.alchemyBoost)s.inv.consumables.alchemyBoost=(s.inv.consumables.alchemyBoost||0)+eff.alchemyBoost;
  writeLog(s,'Market Purchase',`${item.name} secured.`,'Market','good');
  toast(`✅ ${item.name} purchased`,'good');
}

function launchBusiness(s,key){
  const def=byKey(BUSINESSES_DEF,key);if(!def)return;
  if(s.businesses.find(b=>b.key===key)){toast('Already active','bad');return;}
  if(s.realmIndex<(def.reqR||0)){toast(`Need Realm ${def.reqR+1}+`,'bad');return;}
  if(def.costSt&&s.res.stones<def.costSt){toast(`Need ${def.costSt}💎`,'bad');return;}
  if(def.costSi&&s.res.silver<def.costSi){toast(`Need ${def.costSi}🪙`,'bad');return;}
  if(def.costSt)s.res.stones-=def.costSt;if(def.costSi)s.res.silver-=def.costSi;
  s.businesses.push({key,years:0,level:1});
  writeLog(s,'Enterprise Founded',`${def.name} established.`,'Business','good');
  toast(`🏢 ${def.name} founded`,'good');
}

function startAuction(s,lotKey){
  const lot=byKey(AUCTION_POOL,lotKey);if(!lot)return;
  if(lot.reqR&&s.realmIndex<lot.reqR){toast(`Need Realm ${lot.reqR+1}+`,'bad');return;}
  const startP=lot.baseP+rand(0,Math.round(lot.baseP*.2));
  const hasOpp=Math.random()<.72;
  s.auction={active:true,lot,playerBid:startP,oppBid:hasOpp?Math.round(startP*.85):0,oppMax:hasOpp?Math.round(lot.baseP*(1.2+Math.random()*.9)):0,oppActive:hasOpp,resolved:false,msg:''};
  s.overlay='auction';
}

function raiseBid(s,amount){
  const a=s.auction;if(!a||a.resolved)return;
  a.playerBid+=amount;
  if(a.oppActive&&a.oppBid<a.oppMax){const oResp=a.playerBid+rand(5,30);if(oResp<=a.oppMax){a.oppBid=oResp;a.msg=`Opponent raised to ${oResp}💎.`;}else{a.oppBid=a.oppMax;a.msg=`Opponent at limit (${a.oppMax}💎).`;}}
  else if(a.oppActive){a.msg='Opponent dropped out.';}
}

function commitBid(s){
  const a=s.auction;if(!a||a.resolved)return;
  if(s.res.stones<a.playerBid){toast(`Need ${a.playerBid}💎`,'bad');s.overlay=null;return;}
  const won=!a.oppActive||a.playerBid>a.oppBid;
  if(won){
    s.res.stones-=a.playerBid;const lot=a.lot;
    if(lot.type==='manual'&&lot.manKey&&!s.inv.manuals.includes(lot.manKey))s.inv.manuals.push(lot.manKey);
    if(lot.type==='artifact'&&lot.aKey&&!s.inv.artifacts.includes(lot.aKey))s.inv.artifacts.push(lot.aKey);
    if(lot.type==='beast_egg'&&!s.beast.activeKey&&!s.beast.pendingEgg){s.beast.pendingEgg=true;s.beast.pendingTier=lot.key.includes('legend')?'legendary':'rare';}
    if(lot.type==='territory')s.territories.mortal++;
    if(lot.type==='consumable'&&lot.eff){if(lot.eff.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+lot.eff.successBoost;if(lot.eff.alchemyBoost)s.inv.consumables.alchemyBoost=(s.inv.consumables.alchemyBoost||0)+lot.eff.alchemyBoost;}
    if(lot.type==='resource'&&lot.eff){if(lot.eff.herbs)s.res.herbs+=lot.eff.herbs;}
    s.metrics.auctions++;
    writeLog(s,'Auction Victory',`${lot.name} secured for ${a.playerBid} stones.`,'Auction','good');
    toast(`🔨 Won! ${lot.name}`,'great',3000);
    s.overlay=null;
  } else {
    writeLog(s,'Outbid',`Outbid on ${a.lot.name}.`,'Auction','bad');toast('Outbid — opportunity lost','bad');s.overlay=null;
  }
  a.resolved=true;
}

function hatchBeast(s,key){
  const b=byKey(BEASTS,key);if(!b)return;
  s.beast.activeKey=key;s.beast.loyalty=50;s.beast.score=1;s.beast.pendingEgg=false;
  Object.entries(b.bonus).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+Math.round(v*.4),0,100);});
  writeLog(s,'Beast Hatched!',`${b.name} bonded with your bloodline.`,'Beast','good');
  toast(`🐉 ${b.name} hatched and bonded!`,'great',4000);
  s.overlay=null;
}

// NPC interaction with bond system
function talkNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  r.bond=clamp(r.bond+3,-100,100);r.trust=clamp(r.trust+2,-100,100);
  writeLog(s,'Conversation',`Meaningful exchange with ${r.name}.`,'Bonds','neutral');
  toast(`💬 Talked with ${r.name}. Bond +3`,'',2000);
  s.overlay=null;s.overlayData=null;
}

function giftNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  if(s.res.stones<10){toast('Need 10💎','bad');return;}
  s.res.stones-=10;
  r.bond=clamp(r.bond+8,-100,100);r.trust=clamp(r.trust+5,-100,100);r.giftCooldown=2;
  toast(`🎁 Gift to ${r.name}. Bond +8`,'good');
  s.overlay=null;
}

function outingNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  if(s.res.silver<50){toast('Need 50🪙','bad');return;}
  s.res.silver-=50;
  r.bond=clamp(r.bond+12,-100,100);r.trust=clamp(r.trust+8,-100,100);
  toast(`🍵 Outing with ${r.name}. Bond +12`,'good');
  s.overlay=null;
}

function proposeToNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  if(r.bond<40){toast('Bond not deep enough (need 40+)','bad');return;}
  const propCount=[s.family.spouse,s.family.spouse2,s.family.spouse3].filter(Boolean).length;
  const maxW=_maxWives(s);
  if(propCount>=maxW){toast(`Need property for more wives (max ${maxW} with current properties)`,'bad');return;}
  if(!s.family.spouse)s.family.spouse=r.name;
  else if(!s.family.spouse2)s.family.spouse2=r.name;
  else if(!s.family.spouse3)s.family.spouse3=r.name;
  s.metrics.marriages++;writeLog(s,'Proposal Accepted',`${r.name} accepted.`,'Bonds','good');
  toast(`💍 ${r.name} accepted!`,'great',4000);s.overlay=null;
}

function daoBondNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  if(r.trust<50){toast('Need trust 50+ for Dao Bond','bad');return;}
  if(s.family.daoComp){toast('Already have Dao Companion','bad');return;}
  s.family.daoComp=r.name;writeLog(s,'Dao Bond Forged',`${r.name} accepted eternal bond.`,'Bonds','good');
  toast(`☯️ ${r.name} — Dao Bond forged!`,'great',4000);s.overlay=null;
}

function challengeNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  if(Math.random()<.5+s.stats.will*.003){r.bond=clamp(r.bond-12,-100,100);s.stats.reputation=clamp(s.stats.reputation+9,0,100);writeLog(s,'Duel Victory','Victory.','Combat','good');toast('⚔️ Duel won!','good');}
  else{s.stats.body=clamp(s.stats.body-5,0,100);s.stats.instability=clamp(s.stats.instability+8,0,100);writeLog(s,'Duel Defeat','Defeated.','Combat','bad');toast('💔 Lost the duel','bad');}
  s.overlay=null;
}

function romanceNPC(s,relKey){
  const r=s.relations.find(x=>x.key===relKey);if(!r)return;
  const pool=RELATION_POOL.find(p=>p.key===relKey);
  if(!pool?.romanceable){toast('This person is not interested','bad');return;}
  r.bond=clamp(r.bond+15,-100,100);r.trust=clamp(r.trust+10,-100,100);
  toast(`💕 Romance: ${r.name}. Bond +15`,'good');s.overlay=null;
}

// Sect elder interaction
function talkElder(s,elderName){
  if(!s.sect.elderBondsMap)s.sect.elderBondsMap={};
  const cur=s.sect.elderBondsMap[elderName]||0;
  s.sect.elderBondsMap[elderName]=cur+5;
  s.res.merit+=3;
  toast(`💬 Talked with ${elderName}. Bond +5, Merit +3`,'good');
  // Add to relations if not there
  if(!s.relations.find(r=>r.name===elderName)){
    s.relations.push({key:'elder_'+elderName.replace(/\s/g,'_'),name:elderName,role:'Sect Elder',desire:'See the sect prosper.',icon:'🧙',bond:cur+5,trust:20,giftCooldown:0,faction:'sect',giftable:true,romanceable:false});
  } else {
    const rel=s.relations.find(r=>r.name===elderName);rel.bond=clamp(rel.bond+5,-100,100);
  }
}

function giftElder(s,elderName){
  if(s.res.stones<15){toast('Need 15💎','bad');return;}
  s.res.stones-=15;
  if(!s.sect.elderBondsMap)s.sect.elderBondsMap={};
  s.sect.elderBondsMap[elderName]=(s.sect.elderBondsMap[elderName]||0)+10;
  s.sect.favor=clamp(s.sect.favor+3,0,100);
  toast(`🎁 Gift to ${elderName}. Bond +10, Favor +3`,'good');
  const rel=s.relations.find(r=>r.name===elderName);if(rel)rel.bond=clamp(rel.bond+10,-100,100);
}

function chooseElder(s,elderName){
  s.sect.chosenElder=elderName;
  s.stats.comprehension=clamp(s.stats.comprehension+5,0,100);
  writeLog(s,'Master Chosen',`${elderName} accepted you as a disciple.`,'Sect','good');
  toast(`🧙 ${elderName} is now your master!`,'great',4000);
  s.overlay=null;
}

function chooseBeastEgg(s,beastKey){
  // Called when player joins sect — choose from 3 common eggs
  hatchBeast(s,beastKey);
}

function slab(txt){return`<div class="slabel">${txt}</div>`;}
function notice(txt,cls=''){return`<div class="notice ${cls}">${txt}</div>`;}

function mkRow({icon='•',title,sub='',value='',action='',cls='',}){
  return`<button class="row ${cls}" ${action}>
    <div class="row-ico">${icon}</div>
    <div class="row-txt"><div class="row-title">${title}</div>${sub?`<div class="row-sub">${sub}</div>`:''}</div>
    ${value?`<div class="row-val">${value}</div>`:`<div class="row-arr">›</div>`}
  </button>`;
}

function hbar(title,back='close-subscreen',color='var(--text2)',right=''){
  return`<div class="hbar"><button class="hbar-back" data-action="${back}">‹</button><div class="hbar-title" style="color:${color}">${title}</div><div class="hbar-r">${right}</div></div>`;
}

function renderTopStrip(s){
  const r=getRealm(s);const phy=getPhy(s);
  const isCult=s.selectedAction==='cultivate';
  return`<div class="top">
    <div class="avatar" data-action="open-profile">${phy.icon}</div>
    <div class="profile-info">
      <div class="p-name">${s.name} · Age ${s.age}</div>
      <div class="p-sub" style="color:${r.color}">${r.name} Lv.${s.minorLevel}/9</div>
    </div>
    <div class="p-res">
      <div class="res-row"><span>💎</span><span class="res-val">${fmt(s.res.stones)}</span><span class="res-lbl">stones</span></div>

      ${s.res.immortalJade>0?`<div class="res-row"><span>✨</span><span class="res-val">${s.res.immortalJade}</span><span class="res-lbl">jade</span></div>`:''}
    </div>
  </div>`;
}

function renderQiBar(s){
  const r=getRealm(s);const pct=Math.round((s.qi/s.qiCap)*100);
  const pips=Array.from({length:9},(_,i)=>{
    const on=i<s.minorLevel-1;const now=i===s.minorLevel-1;
    return`<div class="qi-pip ${on?'on':now?'now':''}"></div>`;
  }).join('');
  return`<div class="qi-bar-wrap">
    <div class="qi-meta"><span style="color:${r.color}">${r.short||r.name} · Minor ${s.minorLevel}/9</span><span>Yr ${s.year} · Age ${s.age}</span></div>
    <div class="qi-track"><div class="qi-fill" style="width:${pct}%;background:linear-gradient(90deg,${r.color}88,${r.color})"></div></div>
    <div class="qi-pips">${pips}</div>
  </div>`;
}

function renderChronicleTab(s){
  const canBt=s.minorLevel>=9;const profile=btProfile(s);const wfAvail=s.windfallUsed<2;
  let h=renderTopStrip(s)+renderQiBar(s);
  h+=`<div class="scroll">`;
  // Windfall
  if(wfAvail)h+=`<div class="windfall" data-action="activate-windfall"><div class="windfall-t">✨ Fortuitous Encounter Available</div><div class="windfall-s">Tap to claim a windfall blessing (${2-s.windfallUsed} left)</div></div>`;
  // Pending egg
  if(s.beast.pendingEgg)h+=`<div class="windfall" data-action="open-hatch" style="border-color:rgba(255,215,0,.5)"><div class="windfall-t">🥚 Beast Egg Ready to Hatch!</div><div class="windfall-s">Tap to choose your companion bloodline</div></div>`;
  // Instability warning
  if(s.stats.instability>=70)h+=`<div class="notice bad">⚠️ Qi Instability at ${s.stats.instability}/100. Danger of qi deviation.</div>`;

function renderMarketplace(s){
  const items=getShopItems(s);

  h+=`<div class="scroll">`;
  h+=notice('Items rotate each year · Tier scales with realm.');

    const cost=cSt?`${cSt}💎`:`${cSi}🪙`;
    const can=cSt?s.res.stones>=cSt:s.res.silver>=cSi;
    h+=mkRow({icon:item.icon,title:item.name,sub:item.desc,value:cost,cls:can?'':'dim',action:can?`data-buy-item="${item.key}"`:''});
  }
  h+=`</div>`;return h;
}

function renderAuction(s){
  let h=hbar('GRAND AUCTION HALL','close-subscreen','var(--gold2)');
  h+=`<div class="scroll">`;
  h+=notice('Bid on rare manuals, beast eggs, and ancient relics. Opponents may outbid you.','warn');
  const owned=new Set([...s.inv.manuals,...s.inv.artifacts]);
  const pool=AUCTION_POOL.filter(l=>{
    if(l.manKey&&owned.has(l.manKey))return false;
    if(l.aKey&&owned.has(l.aKey))return false;
    if(l.reqR&&s.realmIndex<l.reqR)return false;
    return true;
  }).sort(()=>Math.random()-.5).slice(0,6);
  if(!pool.length)h+=notice('No lots available at your realm. Advance higher.');
  for(const lot of pool)h+=mkRow({icon:lot.icon,title:lot.name,sub:lot.desc,value:`From ${lot.baseP}💎`,action:`data-start-auction="${lot.key}"`});
  h+=`</div>`;return h;
}

    </div>`;
    h+=slab('III. Choose Temperament');
    for(const t of TEMPERAMENTS){
      const stats=Object.entries(t.stats).map(([k,v])=>`${v>0?'+':''}${v} ${k}`).join(', ');
      h+=mkRow({icon:t.icon,title:t.name,sub:`${t.desc} · ${stats}`,cls:s.selectedTemperament===t.key?'gold':'',action:`data-temperament="${t.key}"`});
    }
  } else if(s.setupStep===2){
    h+=slab('IV. Choose Your Path');
    h+=mkRow({icon:'⛩',title:'Join a Sect',sub:'Stipends, manuals, and political risk. Elder master selection.',cls:s.selectedPath==='sect'?'gold':'',action:'data-path="sect"'});

    for(const sec of SECTS){

  h+=`<div class="setup-cta"><button class="cta-btn" ${!canAdvance?'disabled':''} data-action="setup-next">
    ${s.setupStep===3||(s.setupStep===2&&s.selectedPath==='wanderer')?'Begin This Life ›':'Continue →'}

}

let S=createState();

function renderGame(s){
  const TABS=[
    {key:'chronicle',ico:'☯',lbl:'Life'},
    {key:'path',     ico:'✦',lbl:'Path'},
    {key:'world',    ico:'⌘',lbl:'World'},
    {key:'sect',     ico:'⛩',lbl:'Sect'},
    {key:'bonds',    ico:'∞',lbl:'House'},
  ];
  const tabFn={chronicle:renderChronicleTab,path:renderPathTab,world:renderWorldTab,sect:renderSectTab,bonds:renderBondsTab};
  const subFn={
    marketplace:renderMarketplace,
    auction:renderAuction,
    business:renderBusiness,
    inventory:renderInventory,
    'beast-detail':renderBeastDetail,
    'beast-hatch':renderHatchScreen,
    'choose-elder':renderElderChoice,
    military:renderMilitary,
  };

  let mainHtml='';
  if(s.subscreen&&subFn[s.subscreen]){mainHtml=`<div style="display:flex;flex-direction:column;height:100%">${subFn[s.subscreen](s)}</div>`;}
  else{mainHtml=`<div style="display:flex;flex-direction:column;height:100%">${(tabFn[s.activeTab]||renderChronicleTab)(s)}</div>`;}

  const canBt=s.minorLevel>=9;
  let full=`<div style="display:flex;flex-direction:column;height:100dvh">
    ${mainHtml}
    <div class="bottom">
      <button class="adv-btn ${canBt?'ready':''}" data-action="advance-year">${canBt?'🌟 Breakthrough Ready — Advance Year':'Age Up ›'}</button>
      <nav class="nav">${TABS.map(t=>`<button class="nav-btn ${s.activeTab===t.key&&!s.subscreen?'on':''}" data-tab="${t.key}"><span class="ico">${t.ico}</span><span>${t.lbl}</span></button>`).join('')}</nav>
    </div>
  </div>`;

  // Overlays
  if(s.overlay==='profile')full+=renderProfileOverlay(s);
  if(s.overlay==='history')full+=renderHistoryOverlay(s);
  if(s.overlay==='breakthrough'&&s.overlayData)full+=renderBreakthroughOverlay(s,s.overlayData);
  if(s.overlay==='choice'&&s.overlayData)full+=renderChoiceOverlay(s,s.overlayData);
  if(s.overlay==='windfall'&&s.pendingWindfall)full+=renderWindfallOverlay(s);
  if(s.overlay==='auction')full+=renderAuctionOverlay(s);
  if(s.overlay==='jobmenu')full+=renderJobMenu(s);
  if(s.overlay==='hatch')full+=`<div class="overlay"><div class="overlay-sheet">${renderHatchScreen(s).replace('class="scroll"','class="overlay-scroll"')}</div></div>`;
  return full;
}

function render(){
  const root=document.getElementById('root');

// EVENT BINDING
// ═══════════════════════════════════════════════════
function bindEvents(){
  const root=document.getElementById('root');
  root.onclick=e=>{
    const t=e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-launch-biz],[data-buy-property],[data-travel],[data-contest],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose-rel],[data-dao-bond],[data-challenge-rel],[data-talk-rel],[data-romance-rel],[data-outing-rel],[data-join-sect],[data-set-job],[data-sect-action],[data-elder-talk],[data-elder-gift],[data-choose-elder],[data-recruit-troop],[data-recruit-general],[data-beast-feed]');
    if(!t)return;e.stopPropagation();

    // Elder interactions
    if(t.dataset.elderTalk){talkElder(S,t.dataset.elderTalk);render();return;}
    if(t.dataset.elderGift){giftElder(S,t.dataset.elderGift);render();return;}
    if(t.dataset.chooseElder){chooseElder(S,t.dataset.chooseElder);render();return;}

    // Troop recruitment
    if(t.dataset.recruitTroop){
      const tDef=byKey(TROOP_TIERS,t.dataset.recruitTroop);if(!tDef)return;
      const qty=10;const total=tDef.cost*qty;
      if(tDef.costType==='silver'){if(S.res.silver<total){toast(`Need ${total}🪙`,'bad');return;}S.res.silver-=total;}
      else{if(S.res.stones<total){toast(`Need ${total}💎`,'bad');return;}S.res.stones-=total;}
      S.troops[t.dataset.recruitTroop]=(S.troops[t.dataset.recruitTroop]||0)+qty;
      toast(`⚔️ Recruited ${qty} ${tDef.name}`,'good');render();return;
    }
    if(t.dataset.recruitGeneral){
      const gDef=byKey(GENERAL_TIERS,t.dataset.recruitGeneral);if(!gDef)return;
      if(gDef.costType==='silver'){if(S.res.silver<gDef.cost){toast(`Need ${gDef.cost}🪙`,'bad');return;}S.res.silver-=gDef.cost;}
      else{if(S.res.stones<gDef.cost){toast(`Need ${gDef.cost}💎`,'bad');return;}S.res.stones-=gDef.cost;}
      S.generals[t.dataset.recruitGeneral]=(S.generals[t.dataset.recruitGeneral]||0)+1;
      toast(`🌟 Hired ${gDef.name}`,'good');render();return;
    }
    if(t.dataset.beastFeed){if(S.res.stones>=60){S.res.stones-=60;S.beast.loyalty=clamp(S.beast.loyalty+20,0,100);toast('🐾 Beast fed — Loyalty +20','good');}else toast('Need 60💎','bad');render();return;}

    // NPC relation actions
    if(t.dataset.talkRel){talkNPC(S,t.dataset.talkRel);render();return;}
    if(t.dataset.giftRel){giftNPC(S,t.dataset.giftRel);render();return;}
    if(t.dataset.outingRel){outingNPC(S,t.dataset.outingRel);render();return;}
    if(t.dataset.proposeRel){proposeToNPC(S,t.dataset.proposeRel);render();return;}
    if(t.dataset.daoBond){daoBondNPC(S,t.dataset.daoBond);render();return;}
    if(t.dataset.challengeRel){challengeNPC(S,t.dataset.challengeRel);render();return;}
    if(t.dataset.romanceRel){romanceNPC(S,t.dataset.romanceRel);render();return;}

    const action=t.dataset.action;
    if(action){
      if(action==='advance-year'){
        if(S.settings.ageConfirm&&!confirm('Advance one year?'))return;
        advanceYear(S);
      }
      else if(action==='attempt-breakthrough')attemptBreakthrough(S);
      else if(action==='open-profile')S.overlay='profile';
      else if(action==='open-history')S.overlay='history';
      else if(action==='close-overlay'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-breakthrough'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-subscreen')S.subscreen=null;
      else if(action==='close-auction')S.overlay=null;
      else if(action==='noop')return;
      else if(action==='setup-next'){
        if(S.setupStep===0&&S.selectedOrigin)S.setupStep=1;
        else if(S.setupStep===1&&S.selectedTemperament)S.setupStep=2;
        else if(S.setupStep===2){if(S.selectedPath==='wanderer')startGame(S);else if(S.selectedPath==='sect')S.setupStep=3;}
        else if(S.setupStep===3&&S.selectedSect){
          startGame(S);
          // Offer beast egg on sect join
          if(!S.beast.activeKey){S.beast.pendingEgg=true;S.beast.pendingTier='common';S.overlay='hatch';toast('🎁 Sect gift: choose a beast companion!','great',4000);}
        }
      }
      else if(action==='commit-bid')commitBid(S);
      else if(action==='claim-windfall')claimWindfall(S);
      else if(action==='activate-windfall')activateWindfall(S);
      else if(action==='open-hatch')S.overlay='hatch';
      else if(action==='open-jobmenu')S.overlay='jobmenu';
      else if(action==='restart'){S=createState();S.screen='setup';}
      else if(action==='release-beast'){
        if(S.beast.activeKey){
          const b=byKey(BEASTS,S.beast.activeKey);
          toast(`${b.icon} ${b.name} released. Karma noted.`,'bad',3000);
          S.stats.karma=clamp(S.stats.karma-3,-100,100);
          S.beast.activeKey=null;S.beast.loyalty=0;S.beast.score=0;
          writeLog(S,'Beast Released',`You released ${b.name}. The bond severed.`,'Beast','bad');
        }
      }
    }

    if(t.dataset.origin){S.selectedOrigin=t.dataset.origin;}
    if(t.dataset.temperament){S.selectedTemperament=t.dataset.temperament;}
    if(t.dataset.path){S.selectedPath=t.dataset.path;}
    if(t.dataset.sect){S.selectedSect=t.dataset.sect;}
    if(t.dataset.tab){S.activeTab=t.dataset.tab;S.subscreen=null;}
    if(t.dataset.open){S.subscreen=t.dataset.open;}
    if(t.dataset.selectAction)S.selectedAction=t.dataset.selectAction;
    if(t.dataset.buyItem)buyShopItem(S,t.dataset.buyItem);
    if(t.dataset.launchBiz)launchBusiness(S,t.dataset.launchBiz);
    if(t.dataset.buyProperty){
      const p=byKey(PROPERTIES,t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const canJ=p.costJ&&S.res.immortalJade>=p.costJ;
        const canSt=p.costSt&&S.res.stones>=p.costSt;
        const canSi=p.costSi&&S.res.silver>=p.costSi;
        if(canJ){S.res.immortalJade-=p.costJ;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else if(canSt){S.res.stones-=p.costSt;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else if(canSi){S.res.silver-=p.costSi;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else toast('Insufficient funds','bad');
      }
    }
    if(t.dataset.travel){
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l&&l.stage>0&&S.realmIndex<l.stage*6)toast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');
      else if(l){if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');toast(`📍 ${l.name}`,'',2000);}S.locationKey=t.dataset.travel;}
    }
    if(t.dataset.contest){contestTerritory(S,t.dataset.contest);}
    if(t.dataset.startAuction){startAuction(S,t.dataset.startAuction);}
    if(t.dataset.bidRaise){raiseBid(S,parseInt(t.dataset.bidRaise));}
    if(t.dataset.hatch){hatchBeast(S,t.dataset.hatch);}
    if(t.dataset.choose){resolveYearChoice(S,t.dataset.choose);}
    if(t.dataset.joinSect){
      const sec=byKey(SECTS,t.dataset.joinSect);
      if(sec&&!S.sect.joined){
        S.sect.joined=true;S.sect.key=t.dataset.joinSect;S.sect.rankKey='layman';
        if(sec.stats)Object.entries(sec.stats).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*.5),0,100);});
        const sm=MANUALS.find(m=>m.reqR===0&&!S.inv.manuals.includes(m.key));if(sm)S.inv.manuals.push(sm.key);
        // Beast egg gift on joining
        if(!S.beast.activeKey){S.beast.pendingEgg=true;S.beast.pendingTier='common';S.overlay='hatch';}
        writeLog(S,'Sect Joined',`Now a Layman Disciple of ${sec.name}.`,'Sect','good');
        toast(`⛩ Joined ${sec.name}!`,'great',3500);
      }
    }
    if(t.dataset.setJob){S.currentJob=t.dataset.setJob;S.overlay=null;toast(`💼 ${byKey(MORTAL_JOBS,t.dataset.setJob)?.name}`,'',2000);}
    if(t.dataset.sectAction){
      const sa=t.dataset.sectAction;
      if(sa==='assign'){S.sect.favor=clamp(S.sect.favor+8,0,100);S.res.merit+=15;writeLog(S,'Mission Done','Merit +15, Favor +8.','Sect','good');toast('⛩ Merit +15, Favor +8','good');}
      else if(sa==='donate'){if(S.res.stones>=100){S.res.stones-=100;S.res.merit+=15;S.sect.favor=clamp(S.sect.favor+8,0,100);writeLog(S,'Donated','','Sect','good');toast('💎 Donated — Merit +15','good');}else toast('Need 100💎','bad');}
      else if(sa==='scheme'){if(Math.random()<.55){S.res.merit+=25;writeLog(S,'Scheme Succeeded','Merit +25.','Sect','good');toast('😈 Scheme — Merit +25','good');}else{S.sect.rivalryPressure=clamp(S.sect.rivalryPressure+15,0,100);writeLog(S,'Scheme Backfired','','Sect','bad');toast('⚠️ Scheme backfired!','bad');}}
    }
    render();
  };
}

// Overwrite privy() to scale by tier

  const mortalIncome = s.territories.mortal * 80;

  const immortalIncome = s.territories.immortal * 1800;
  return mortalIncome + spiritIncome + immortalIncome;
};

// ── 2. CASUALTY — 20% base, elite troops reduce it ───────────
calcCasualties = function(s, tier){
  const total = totalTroops(s); if(total===0) return 0;
  let base = 0.20;
  const elite = (s.troops.spirit_warrior||0) + (s.troops.divine_guard||0);
  const eliteRatio = elite / Math.max(1, total);
  base = base * (1 - eliteRatio * 0.5);
  const genBonus = totalGenerals(s) * 0.02;
  base = Math.max(0.05, base - genBonus);
  const terr = tier==='mortal'?s.territories.mortal:tier==='spiritual'?s.territories.spiritual:s.territories.immortal;
  return Math.min(0.60, base * (1 + terr * 0.10));
};

// ── 4. PATCH getShopItems — randomized rotation ───────────────
const _gsi = getShopItems;
getShopItems = function(s){
  const tier = Math.min(4, Math.floor(s.realmIndex/3));
  const all = SHOP_ITEMS.filter(i=>(i.tier||0)<=tier);
  const seed = ((s.year||1)*37 + (s.realmIndex||0)*13) % 997;
  const shuffled = [...all].sort((a,b)=>((seed*(a.key.charCodeAt(0)||1))%97)-((seed*(b.key.charCodeAt(0)||1))%97));
  // Occasionally include one item from next tier
  const higher = SHOP_ITEMS.filter(i=>i.tier===tier+1);
  if(higher.length) shuffled.push(higher[seed % higher.length]);
  const seen = new Set();
  return shuffled.filter(i=>{if(seen.has(i.key))return false;seen.add(i.key);return true;}).slice(0,12);
};

buyShopItem = function(s, key){

function _genDynasty(s){
  const heirs=s.family.heirs||0; const res=[];
  const mn=['Tianlong','Feiyun','Kongming','Yushan','Zhenhe'];
  const mf=['Liqing','Wanying','Xiaofeng','Shanshan','Linglong'];
  const sn=(s.name||'Chen').split(' ').pop()||'Chen';
  for(let i=0;i<Math.min(heirs,5);i++){
    const f=i%2===1;
    res.push({name:`${sn} ${f?mf[i%mf.length]:mn[i%mn.length]}`,gen:1,icon:f?'👧':'👦',
      realmIdx:Math.max(0,(s.realmIndex||0)-3),power:Math.round(powerRating(s)*0.12+100)});
  }
  return res;
}

// ── 13. PATCH passiveEffects — dynasty growth, beast, business ─
const _pe = passiveEffects;
passiveEffects = function(s){
  _pe(s);
  // Reset yearly NPC interaction counters
  if(s.relations){ for(const r of s.relations) r.yearInteracts=0; }
  // Beast auto-cultivation
  if(s.beast&&s.beast.activeKey){
    s.beast.score=(s.beast.score||0)+1;
    if(s.beast.score%15===0) s.stats.body=clamp((s.stats.body||0)+1,0,100);
  }
  // Dynasty member growth
  if(s.dynastyMembers){
    for(const m of s.dynastyMembers){
      if(Math.random()<0.12) m.realmIdx=clamp((m.realmIdx||0)+1,0,REALMS.length-1);
      m.power=Math.round(((m.realmIdx||0)+1)*400+Math.random()*200);
    }
    // Dynasty threat check
    if(s.dynastyMembers.length>=5){
      const strongest=s.dynastyMembers.reduce((a,b)=>b.power>a.power?b:a,s.dynastyMembers[0]);
      if(strongest.power>powerRating(s)*0.8){
        writeLog(s,'Dynasty Tension',`${strongest.name} grows powerful — maintain your edge.`,'Dynasty','bad');
      }
    }
  }
  // Privy income from territories
  const inc = privy(s);
  if(inc>0) s.res.silver=(s.res.silver||0)+inc;
  // Business 25% passive when not actively managing
  if(s.selectedAction!=='business'){
    for(const biz of(s.businesses||[])){
      const def=byKey(BUSINESSES_DEF,biz.key);
      if(def){
        s.res.stones=(s.res.stones||0)+Math.round((def.yieldSt||0)*0.25);
        s.res.silver=(s.res.silver||0)+Math.round((def.yieldSi||0)*0.25);
      }
    }
  }
  // Skip-century offer
  if((s.year||0)>200&&(s.minorLevel||0)<9&&!s.shownSkipOffer){
    s.shownSkipOffer=true; s.overlay='skip-century';
  }
};

// ── 15. PATCH bindEvents — add all new handlers ───────────────
const _be = bindEvents;
bindEvents = function(){
  _be();
  const root = document.getElementById('root');
  const _ec = root.onclick;
  root.onclick = function(e){
    const t = e.target.closest('[data-expand-rel],[data-dual-cultiv],[data-treasury-buy],[data-action],[data-noop]');
    if(t){
      e.stopPropagation();
      // Expand NPC rel panel
      if(t.dataset.expandRel){
        S._expandedRel = S._expandedRel===t.dataset.expandRel ? null : t.dataset.expandRel;
        render(); return;
      }
      // Dual cultivation
      if(t.dataset.dualCultiv){
        const rel=S.relations.find(r=>r.key===t.dataset.dualCultiv);
        if(rel&&rel.bond>=50){
          const bonus=3+Math.round((getPhy(S).cultivMult-0.8)*4);
          S.minorQi=(S.minorQi||0)+bonus;
          S.stats.purity=clamp(S.stats.purity+2,0,100);
          rel.yearInteracts=(rel.yearInteracts||0)+1;
          writeLog(S,'Dual Cultivation',`Harmonized qi with ${rel.name}. +${bonus} qi.`,'Cultivation','good');
          toast(`☯️ Dual cultivation — Qi +${bonus}`,'good',3000);
        } else toast('Bond 50+ needed for dual cultivation','bad');
        render(); return;
      }
      // Treasury redeem
      if(t.dataset.treasuryBuy){
        const its={
          tr_qi:{eff:{qiBoost:80},merit:50},
          tr_comp:{eff:{statBoost:{comprehension:12}},merit:80},
          tr_body:{eff:{statBoost:{body:15,will:10}},merit:100},
          tr_bt:{eff:{successBoost:25},merit:150},
          tr_manual:{eff:{statBoost:{will:12,body:8}},merit:200}
        };
        const it=its[t.dataset.treasuryBuy];
        if(it&&(S.res.merit||0)>=it.merit){
          S.res.merit-=it.merit;
          const eff=it.eff||{};
          if(eff.qiBoost)S.minorQi=(S.minorQi||0)+eff.qiBoost;
          if(eff.statBoost)Object.entries(eff.statBoost).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+v,0,100);});
          if(eff.successBoost)S.inv.consumables.successBoost=(S.inv.consumables.successBoost||0)+eff.successBoost;
          toast('✅ Redeemed!','good',2000);
        } else toast('Insufficient merit','bad');
        render(); return;
      }
      if(t.dataset.noop) return;
      const action=t.dataset.action;
      if(!action){ if(_ec)_ec.call(root,e); return; }
      // New actions
      if(action==='guide-heir'){
        if((S.family.heirs||0)>0){
          if(!S.dynastyMembers||!S.dynastyMembers.length)S.dynastyMembers=_genDynasty(S);
          if(S.dynastyMembers.length){S.dynastyMembers[0].realmIdx=clamp((S.dynastyMembers[0].realmIdx||0)+1,0,REALMS.length-1);S.dynastyMembers[0].power=Math.round((S.dynastyMembers[0].realmIdx+1)*500);}
          toast('👨‍👩‍👦 Heir cultivation advanced','good');
        } else toast('No heirs yet','bad');
        render(); return;
      }
      if(action==='gift-heir-pill'){
        if((S.res.stones||0)>=50&&(S.family.heirs||0)>0){
          S.res.stones-=50;
          if(!S.dynastyMembers||!S.dynastyMembers.length)S.dynastyMembers=_genDynasty(S);
          if(S.dynastyMembers.length){S.dynastyMembers[0].realmIdx=clamp((S.dynastyMembers[0].realmIdx||0)+2,0,REALMS.length-1);}
          toast('💊 Heir boosted!','good');
        } else toast('Need 50💎 and an heir','bad');
        render(); return;
      }
      if(action==='skip-century-confirm'){
        S.year=(S.year||1)+100; S.age=(S.age||16)+100;
        S.overlay=null; S.shownSkipOffer=false;
        writeLog(S,'Century Skipped','100 years of closed-door cultivation passed.','Cultivation','good');
        toast('⏳ 100 years passed — world has changed','good',4000);
        render(); return;
      }
      // Fall through
      if(_ec) _ec.call(root,e); return;
    }
    if(_ec) _ec.call(root,e);
  };
};

// ── 16. INIT new state fields on createState ─────────────────
const _cs = createState;
createState = function(){
  const s = _cs();
  s.dynastyMembers = [];
  s.shownSkipOffer = false;
  s._expandedRel = null;
  return s;
};

})(); // end patchV7

// Boot
render();
</script>
