// EVENT BINDING
// ═══════════════════════════════════════════════════
function bindEvents(){
  const root=document.getElementById('root');
  root.onclick=e=>{
    const t=e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-launch-biz],[data-buy-property],[data-travel],[data-contest],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose-rel],[data-dao-bond],[data-challenge-rel],[data-talk-rel],[data-romance-rel],[data-outing-rel],[data-join-sect],[data-set-job],[data-sect-action],[data-elder-talk],[data-elder-gift],[data-choose-elder],[data-recruit-troop],[data-recruit-general],[data-beast-feed],[data-load-slot],[data-craft-pill],[data-craft-gear],[data-challenge-rank],[data-overthrow-sect],[data-slay-rank],[data-exterminate-sect]');
    if(!t)return;e.stopPropagation();
    if(t.dataset.loadSlot){
      const loaded=loadStateFromSlot(Number(t.dataset.loadSlot));
      if(loaded){S=loaded;render();}
      return;
    }

    // Elder interactions
    if(t.dataset.elderTalk){talkElder(S,t.dataset.elderTalk);render();return;}
    if(t.dataset.elderGift){giftElder(S,t.dataset.elderGift);render();return;}
    if(t.dataset.chooseElder){chooseElder(S,t.dataset.chooseElder);render();return;}

    // Troop recruitment
    if(t.dataset.recruitTroop){
      const tDef=byKey(TROOP_TIERS,t.dataset.recruitTroop);if(!tDef)return;
      const qty=10;const total=tDef.cost*qty;
      if(tDef.costType==='silver'){if(S.res.silver<total){toast(`Need ${total}🪙`,'bad');return;}S.res.silver-=total;}
      else{if(S.res.stones<total){toast(`Need ${total}💎`,'bad');return;}S.res.stones-=total;}
      S.troops[t.dataset.recruitTroop]=(S.troops[t.dataset.recruitTroop]||0)+qty;
      toast(`⚔️ Recruited ${qty} ${tDef.name}`,'good');render();return;
    }
    if(t.dataset.recruitGeneral){
      const gDef=byKey(GENERAL_TIERS,t.dataset.recruitGeneral);if(!gDef)return;
      if(gDef.costType==='silver'){if(S.res.silver<gDef.cost){toast(`Need ${gDef.cost}🪙`,'bad');return;}S.res.silver-=gDef.cost;}
      else{if(S.res.stones<gDef.cost){toast(`Need ${gDef.cost}💎`,'bad');return;}S.res.stones-=gDef.cost;}
      S.generals[t.dataset.recruitGeneral]=(S.generals[t.dataset.recruitGeneral]||0)+1;
      toast(`🌟 Hired ${gDef.name}`,'good');render();return;
    }
    if(t.dataset.beastFeed){if(S.res.stones>=60){S.res.stones-=60;S.beast.loyalty=clamp(S.beast.loyalty+20,0,100);toast('🐾 Beast fed — Loyalty +20','good');}else toast('Need 60💎','bad');render();return;}
    if(t.dataset.craftPill){craftAlchemyRecipe(S,t.dataset.craftPill);render();return;}
    if(t.dataset.craftGear){craftForgeRecipe(S,t.dataset.craftGear);render();return;}
    if(t.dataset.challengeRank){challengeRankedIndividual(S,t.dataset.challengeRank);render();return;}
    if(t.dataset.overthrowSect){overthrowRankedSect(S,t.dataset.overthrowSect);render();return;}
    if(t.dataset.slayRank){killRankedIndividual(S,t.dataset.slayRank);render();return;}
    if(t.dataset.exterminateSect){exterminateRankedSect(S,t.dataset.exterminateSect);render();return;}

    // NPC relation actions
    if(t.dataset.talkRel){talkNPC(S,t.dataset.talkRel);render();return;}
    if(t.dataset.giftRel){giftNPC(S,t.dataset.giftRel);render();return;}
    if(t.dataset.outingRel){outingNPC(S,t.dataset.outingRel);render();return;}
    if(t.dataset.proposeRel){proposeToNPC(S,t.dataset.proposeRel);render();return;}
    if(t.dataset.daoBond){daoBondNPC(S,t.dataset.daoBond);render();return;}
    if(t.dataset.challengeRel){challengeNPC(S,t.dataset.challengeRel);render();return;}
    if(t.dataset.romanceRel){romanceNPC(S,t.dataset.romanceRel);render();return;}

    const action=t.dataset.action;
    if(action){
      if(action==='advance-year'){
        if(S.settings.ageConfirm&&!confirm('Advance one year?'))return;
        advanceYear(S);
      }
      else if(action==='attempt-breakthrough')attemptBreakthrough(S);
      else if(action==='open-profile')S.overlay='profile';
      else if(action==='open-history')S.overlay='history';
      else if(action==='close-overlay'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-breakthrough'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-subscreen')S.subscreen=null;
      else if(action==='close-auction')S.overlay=null;
      else if(action==='noop')return;
      else if(action==='setup-next'){
        if(S.setupStep===0&&S.selectedOrigin)S.setupStep=1;
        else if(S.setupStep===1&&S.selectedTemperament)S.setupStep=2;
        else if(S.setupStep===2){if(S.selectedPath==='wanderer')startGame(S);else if(S.selectedPath==='sect')S.setupStep=3;}
        else if(S.setupStep===3&&S.selectedSect){
          startGame(S);
          // Offer beast egg on sect join
          if(!S.beast.activeKey){S.beast.pendingEgg=true;S.beast.pendingTier='common';S.overlay='hatch';toast('🎁 Sect gift: choose a beast companion!','great',4000);}
        }
      }
      else if(action==='cycle-slot'){S.saveSlot=(S.saveSlot%SAVE_SLOT_COUNT)+1;}
      else if(action==='reroll-fate'){S.selectedPhysique=rollPhysique();}
      else if(action==='commit-bid')commitBid(S);
      else if(action==='claim-windfall')claimWindfall(S);
      else if(action==='activate-windfall')activateWindfall(S);
      else if(action==='open-hatch')S.overlay='hatch';
      else if(action==='open-jobmenu')S.overlay='jobmenu';
      else if(action==='gather-materials')gatherWorldMaterials(S);
      else if(action==='refine-pill')refineWorldPill(S);
      else if(action==='forge-artifact')forgeWorldArtifact(S);
      else if(action==='inherit-heir'){if(inheritAsHeir(S)){}}
      else if(action==='rewind-10'){restoreSnapshot(S,10);}
      else if(action==='rewind-100'){restoreSnapshot(S,100);}
      else if(action==='restart'){const slot=S.saveSlot||1;S=createState();S.screen='setup';S.saveSlot=slot;}
      else if(action==='release-beast'){
        if(S.beast.activeKey){
          const b=byKey(BEASTS,S.beast.activeKey);
          toast(`${b.icon} ${b.name} released. Karma noted.`,'bad',3000);
          S.stats.karma=clamp(S.stats.karma-3,-100,100);
          S.beast.activeKey=null;S.beast.loyalty=0;S.beast.score=0;
          writeLog(S,'Beast Released',`You released ${b.name}. The bond severed.`,'Beast','bad');
        }
      }
    }

    if(t.dataset.origin){S.selectedOrigin=t.dataset.origin;}
    if(t.dataset.temperament){S.selectedTemperament=t.dataset.temperament;}
    if(t.dataset.path){S.selectedPath=t.dataset.path;}
    if(t.dataset.sect){S.selectedSect=t.dataset.sect;}
    if(t.dataset.tab){S.activeTab=t.dataset.tab;S.subscreen=null;}
    if(t.dataset.open){S.subscreen=t.dataset.open;}
    if(t.dataset.selectAction)S.selectedAction=t.dataset.selectAction;
    if(t.dataset.buyItem)buyShopItem(S,t.dataset.buyItem);
    if(t.dataset.launchBiz)launchBusiness(S,t.dataset.launchBiz);
    if(t.dataset.buyProperty){
      const p=byKey(PROPERTIES,t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const canJ=p.costJ&&S.res.immortalJade>=p.costJ;
        const canSt=p.costSt&&S.res.stones>=p.costSt;
        const canSi=p.costSi&&S.res.silver>=p.costSi;
        if(canJ){S.res.immortalJade-=p.costJ;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else if(canSt){S.res.stones-=p.costSt;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else if(canSi){S.res.silver-=p.costSi;S.inv.properties.push(p.key);toast(`🏠 ${p.name} acquired!`,'good');}
        else toast('Insufficient funds','bad');
      }
    }
    if(t.dataset.travel){
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l&&l.stage>0&&S.realmIndex<l.stage*6)toast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');
      else if(l){if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');toast(`📍 ${l.name}`,'',2000);}S.locationKey=t.dataset.travel;}
    }
    if(t.dataset.contest){contestTerritory(S,t.dataset.contest);}
    if(t.dataset.startAuction){startAuction(S,t.dataset.startAuction);}
    if(t.dataset.bidRaise){raiseBid(S,parseInt(t.dataset.bidRaise));}
    if(t.dataset.hatch){hatchBeast(S,t.dataset.hatch);}
    if(t.dataset.choose){resolveYearChoice(S,t.dataset.choose);}
    if(t.dataset.joinSect){
      const sec=byKey(SECTS,t.dataset.joinSect);
      if(sec&&!S.sect.joined){
        S.sect.joined=true;S.sect.key=t.dataset.joinSect;S.sect.rankKey='layman';
        if(sec.stats)Object.entries(sec.stats).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*.5),0,100);});
        const sm=MANUALS.find(m=>m.reqR===0&&!S.inv.manuals.includes(m.key));if(sm)S.inv.manuals.push(sm.key);
        // Beast egg gift on joining
        if(!S.beast.activeKey){S.beast.pendingEgg=true;S.beast.pendingTier='common';S.overlay='hatch';}
        writeLog(S,'Sect Joined',`Now a Layman Disciple of ${sec.name}.`,'Sect','good');
        toast(`⛩ Joined ${sec.name}!`,'great',3500);
      }
    }
    if(t.dataset.setJob){S.currentJob=t.dataset.setJob;S.overlay=null;toast(`💼 ${byKey(MORTAL_JOBS,t.dataset.setJob)?.name}`,'',2000);}
    if(t.dataset.sectAction){
      const sa=t.dataset.sectAction;
      if(sa==='assign'){S.sect.favor=clamp(S.sect.favor+8,0,100);S.res.merit+=15;writeLog(S,'Mission Done','Merit +15, Favor +8.','Sect','good');toast('⛩ Merit +15, Favor +8','good');}
      else if(sa==='donate'){if(S.res.stones>=100){S.res.stones-=100;S.res.merit+=15;S.sect.favor=clamp(S.sect.favor+8,0,100);writeLog(S,'Donated','','Sect','good');toast('💎 Donated — Merit +15','good');}else toast('Need 100💎','bad');}
      else if(sa==='scheme'){if(Math.random()<.55){S.res.merit+=25;writeLog(S,'Scheme Succeeded','Merit +25.','Sect','good');toast('😈 Scheme — Merit +25','good');}else{S.sect.rivalryPressure=clamp(S.sect.rivalryPressure+15,0,100);writeLog(S,'Scheme Backfired','','Sect','bad');toast('⚠️ Scheme backfired!','bad');}}
    }
    render();
  };
}

function calcMilitaryPower(s) {
  let p = powerRating(s);
  p += (s.soldiers || 0) * 50;
  p += (s.generals || 0) * 400;
  if (s.beast && s.beast.activeKey) {
    const b = byKey(BEASTS, s.beast.activeKey);
    if (b) p += b.cultivBonus * 180;
  }
  p += (s.disciples || 0) * 120;
  const master = s.relations ? s.relations.find(r => r.key === 'master') : null;
  if (master && master.bond > 40) p += master.bond * 25;
  return Math.round(p);
}

function getBeastStageIcon(s) {
  if (!s.beast || !s.beast.activeKey) return '❓';
  const stages = BEAST_STAGES[s.beast.activeKey] || { baby:'🐾', juvenile:'🐾', adult:'🌟🐾', full:'✨🌟🐾' };
  const score = s.beast.score || 0;
  if (score < 5)  return stages.baby;
  if (score < 15) return stages.juvenile;
  if (score < 30) return stages.adult;
  return stages.full;
}

function rollRandomLife(s) {
  s.selectedOrigin      = pick(ORIGINS).key;
  s.selectedTemperament = pick(TEMPERAMENTS).key;
  s.selectedPhysique    = rollPhysique();
  s.selectedPath        = Math.random() < 0.6 ? 'sect' : 'wanderer';
  if (s.selectedPath === 'sect') {
    s.selectedSect = pick(SECTS.filter(sec => (sec.allowRealm || 0) === 0)).key;
  }
  s._randomLife = true;
}

function leaveSect(s) {
  if (!s.sect || !s.sect.joined) return;
  const lt = SECT_LEAGUE_TIERS[s.sect.key] || { leaveKarma:0, leaveRep:-5 };
  const secName = byKey(SECTS, s.sect.key)?.name || 'Unknown Sect';
  s.stats.karma      = clamp(s.stats.karma + lt.leaveKarma, -100, 100);
  s.stats.reputation = clamp(s.stats.reputation + lt.leaveRep, 0, 100);
  if (lt.league === 'Demonic' && lt.chaseRealm) {
    s.sect.demonicChase = { sectKey: s.sect.key, endRealm: lt.chaseRealm };
    writeLog(s, 'Left Demonic Sect — Now Hunted',
      `Leaving ${secName} has made you a target. Hunters will pursue you until you surpass their realm.`, 'Sect', 'bad');
    showToast(`☠️ Left ${secName} — demonic hunters now pursue you!`, 'bad', 5000);
  } else {
    writeLog(s, `Left ${secName}`, `You severed ties. The righteous world noticed.`, 'Sect', 'bad');
    showToast(`Left ${secName}. Reputation -${Math.abs(lt.leaveRep)}`, 'bad', 3000);
  }
  s.sect.joined = false; s.sect.key = null;
  s.sect.rankKey = 'layman'; s.sect.favor = 0; s.sect.rivalryPressure = 0;
}

function addDisciple(s) {
  if (!s.sect || !s.sect.joined || s.realmIndex < 4) {
    showToast('Need Nascent Soul realm + sect to take disciples', 'bad'); return;
  }
  if (s.sect.favor < 5) { showToast('Need 5 sect favor to accept a disciple', 'bad'); return; }
  const maxDisc = Math.max(0, s.realmIndex - 3);
  if ((s.disciples || 0) >= maxDisc) { showToast(`Max ${maxDisc} disciples at current realm`, 'bad'); return; }
  s.sect.favor = clamp(s.sect.favor - 5, 0, 100);
  s.disciples = (s.disciples || 0) + 1;
  const names = ['Xu Mingling','Tang Yao','Bei Suchen','Fang Ruoqi','Wen Zhanjin','Chu Tianhe','Shen Liuyan','Qin Boyuan'];
  if (!s.discipleList) s.discipleList = [];
  const taken = new Set(s.discipleList.map(d => d.name));
  const name = names.find(n => !taken.has(n)) || `Disciple ${s.disciples}`;
  s.discipleList.push({ name, realmIndex:0, merit:0, years:0, path:pick(['sword','pill','body']), sentOut:false });
  writeLog(s, 'Disciple Accepted', `${name} bowed at your feet and accepted the master-disciple bond.`, 'Sect', 'good');
  showToast(`🧒 ${name} accepted as disciple!`, 'good', 4000);
}

function sendDiscipleOut(s, idx) {
  if (!s.discipleList || !s.discipleList[idx] || s.discipleList[idx].sentOut) return;
  const d = s.discipleList[idx];
  d.sentOut = true;
  const outcomes = [
    { desc:`${d.name} founded a small sect. Your legacy spreads.`,      stones:80,  karma:4 },
    { desc:`${d.name} married into a great cultivator family.`,          silver:400, reputation:5 },
    { desc:`${d.name} found a spirit vein and shares income with you.`,  stones:50,  silver:200 },
    { desc:`${d.name} became a wandering hero. Your name travels far.`,  reputation:8 },
  ];
  const out = pick(outcomes);
  if (out.stones)     s.res.stones    += out.stones;
  if (out.silver)     s.res.silver    += out.silver;
  if (out.karma)      s.stats.karma    = clamp(s.stats.karma + out.karma, -100, 100);
  if (out.reputation) s.stats.reputation = clamp(s.stats.reputation + out.reputation, 0, 100);
  writeLog(s, 'Disciple Sent Forth', out.desc, 'Legacy', 'good');
  showToast(`🌟 ${d.name} sent out into the world!`, 'good', 3500);
}

function checkDemonicChase(s) {
  if (!s.sect || !s.sect.demonicChase) return;
  const cd = s.sect.demonicChase;
  if (s.realmIndex >= cd.endRealm) {
    const secName = byKey(SECTS, cd.sectKey)?.name || 'Demonic Sect';
    s.sect.demonicChase = null;
    writeLog(s, 'Demonic Chase Ended', `You have grown too powerful for ${secName} to threaten you.`, 'Sect', 'good');
    showToast(`🛡 ${secName} no longer hunts you`, 'good', 3500);
    return;
  }
  if (Math.random() < 0.30) {
    s.stats.instability = clamp(s.stats.instability + rand(3, 8), 0, 100);
    s.stats.body        = clamp(s.stats.body - rand(1, 3), 0, 100);
    const secName = byKey(SECTS, cd.sectKey)?.name || 'Demonic Sect';
    writeLog(s, `${secName} Assassins Strike`, `Hunters found your trail. Instability increased.`, 'Sect', 'bad');
    showToast(`⚠️ Demonic assassins — instability +${rand(3,8)}`, 'bad');
  }
}

function progressDisciples(s) {
  if (!s.discipleList || !s.discipleList.length) return;
  for (const d of s.discipleList) {
    if (d.sentOut) continue;
    d.years++;
    const speed = Math.max(1, Math.round((s.stats.comprehension - 40) * 0.1 + 3));
    if (d.years % speed === 0 && d.realmIndex < s.realmIndex - 2 && d.realmIndex < REALMS.length - 1) {
      d.realmIndex++;
      writeLog(s, 'Disciple Breakthrough', `${d.name} reached ${REALMS[d.realmIndex].name}!`, 'Sect', 'good');
    }
    d.merit += rand(2, 6);
  }
}

function checkTutorial(s) {
  if (!s.tutorialDone) s.tutorialDone = {};
  for (const step of TUTORIAL_STEPS) {
    if (s.tutorialDone[step.key]) continue;
    if (s.realmIndex < step.minRealm) continue;
    let fire = false;
    if (step.trigger === 'year2'   && s.year === 2)         fire = true;
    if (step.trigger === 'minor9'  && s.minorLevel >= 9)    fire = true;
    if (step.trigger === 'year10'  && s.year >= 10)         fire = true;
    if (step.trigger === `realm${step.minRealm}` && s.realmIndex >= step.minRealm) fire = true;
    if (fire) {
      s.tutorialDone[step.key] = true;
      showToast(`💡 ${step.msg}`, 'warn', 5500);
      break;
    }
  }
}

function getUniqueShopItems(s) {
  // SHOP_ITEMS uses tier:0-4 field; tier = floor(realmIndex/2) capped at 4
  const currentTier = Math.min(4, Math.floor(s.realmIndex / 2));
  const eligible = SHOP_ITEMS.filter(i => (i.tier !== undefined ? i.tier : 0) <= currentTier);
  // Stable shuffle based on year so shop refreshes each year but doesn't flicker on re-render
  const seed = s.year * 7 + s.realmIndex * 13;
  const shuffled = eligible.slice().sort((a, b) => {
    const ha = (seed * 31 + a.key.charCodeAt(0) * 17) % 97;
    const hb = (seed * 31 + b.key.charCodeAt(0) * 17) % 97;
    return ha - hb;
  });
  const seen = new Set();
  return shuffled.filter(i => { if (seen.has(i.key)) return false; seen.add(i.key); return true; }).slice(0, 6);
}

function resolveGamble(s, costStr) {
  const cost = parseInt(costStr);
  if (s.res.stones < cost) { showToast('Insufficient spirit stones', 'bad'); return; }
  s.res.stones -= cost;
  const mult = cost >= 120 ? 3 : cost >= 40 ? 1.6 : 1;
  const pool = GAMBLE_OUTCOMES.map(o => ({
    ...o, w: o.key === 'nothing' ? Math.max(5, 40 - (mult - 1) * 14) : o.weight * mult
  }));
  const total = pool.reduce((acc, o) => acc + o.w, 0);
  let roll = Math.random() * total;
  let result = pool[pool.length - 1];
  for (const o of pool) { roll -= o.w; if (roll <= 0) { result = o; break; } }
  const stoneGain = result.reward.stones ? rand(10, 50) * Math.round(mult) : 0;
  const herbGain  = result.reward.herbs  ? rand(2, 8) : 0;
  if (stoneGain) s.res.stones += stoneGain;
  if (herbGain)  s.res.herbs  += herbGain;
  if (result.reward.relics) s.res.relics++;
  if (result.reward.beastEgg && !s.beast.activeKey && !s.beast.pendingEgg) {
    s.beast.pendingEgg = true;
    showToast('🥚 A beast egg emerged from the boulder!', 'warn', 4500);
  }
  if (!s.gamblingWins) s.gamblingWins = [];
  s.gamblingWins.unshift({ icon:result.icon, desc:result.desc, year:s.year });
  if (s.gamblingWins.length > 15) s.gamblingWins.length = 15;
  const gainStr = stoneGain ? `+${stoneGain}💎` : herbGain ? `+${herbGain} herbs` : result.reward.relics ? '+1 relic' : '';
  writeLog(s, `Boulder Cut — ${result.name}`, `${result.desc}${gainStr?' ('+gainStr+')':''}`, 'Gambling', result.key === 'nothing' ? 'bad' : 'good');
  showToast(`${result.icon} ${result.name}${gainStr?' — '+gainStr:''}`, result.key === 'nothing' ? 'bad' : 'good', 3500);
}

function resolveGamblingDice(s, stakeStr) {
  const stake = parseInt(stakeStr);
  if (s.res.stones < stake) { showToast('Insufficient spirit stones', 'bad'); return; }
  s.res.stones -= stake;
  const luckyMod = (s.stats.luck - 50) * 0.004;
  if (stake === 50) {
    const draws = [rand(0, stake * 2), rand(0, stake * 2), rand(0, stake * 2)];
    const best = Math.max(...draws);
    const win = Math.round(best * 0.8);
    s.res.stones += win;
    const net = win - stake;
    writeLog(s, 'Heaven Draw', `Drew ${draws.join(', ')}. Best: ${best}. Won: ${win} stones.`, 'Gambling', net >= 0 ? 'good' : 'bad');
    showToast(`🃏 Heaven Draw: ${win}💎 won (net ${net >= 0 ? '+' : ''}${net})`, net >= 0 ? 'good' : 'bad', 3200);
  } else {
    if (Math.random() + luckyMod >= 0.5) {
      s.res.stones += stake * 2;
      writeLog(s, 'Dice Win', `+${stake * 2} stones!`, 'Gambling', 'good');
      showToast(`🎲 Won! +${stake * 2}💎`, 'good', 2800);
    } else {
      writeLog(s, 'Dice Loss', `Lost ${stake} stones.`, 'Gambling', 'bad');
      showToast(`🎲 Lost ${stake}💎`, 'bad', 2200);
    }
  }
}

function resolveSelfAuction(s, key) {
  const [type] = key.split('_');
  if (type === 'herbs') {
    if (s.res.herbs < 5) { showToast('Need 5+ herbs', 'bad'); return; }
    s.res.herbs -= 5;
    const gain = Math.round(rand(20, 45) * 0.8 * (1 + (s.stats.business - 50) * 0.005));
    s.res.stones += gain;
    writeLog(s, 'Herbs Sold', `5 herbs → ${gain} stones.`, 'Auction', 'good');
    showToast(`🌿 Herbs sold — +${gain}💎`, 'good');
  } else if (type === 'relic') {
    if (s.res.relics < 1) { showToast('No relics to sell', 'bad'); return; }
    s.res.relics--;
    const gain = Math.round(rand(60, 200) * 0.8);
    s.res.stones += gain;
    writeLog(s, 'Relic Sold', `Ancient relic sold for ${gain} stones.`, 'Auction', 'good');
    showToast(`🏺 Relic sold — +${gain}💎`, 'good');
  } else if (type === 'pill') {
    const half = Math.floor((s.inv.consumables.successBoost || 0) / 2);
    if (half <= 0) { showToast('Not enough pills to sell', 'bad'); return; }
    s.inv.consumables.successBoost -= half;
    const gain = Math.round(rand(30, 80) * half * 0.8);
    s.res.stones += gain;
    writeLog(s, 'Pills Sold', `${half}% success pills → ${gain} stones.`, 'Auction', 'good');
    showToast(`💊 Pills sold — +${gain}💎`, 'good');
  } else if (type === 'silver') {
    if (s.res.silver < 500) { showToast('Need 500+ silver', 'bad'); return; }
    s.res.silver -= 500;
    s.res.stones += 8;
    writeLog(s, 'Silver Exchanged', '500 silver → 8 spirit stones.', 'Market', 'good');
    showToast('🪙 500 silver → 8💎', 'warn');
  }
}

function resolveExchange(s, key) {
  if (key === 'copper-silver') {
    const gained = Math.floor((s.res.copper || 0) / 100);
    if (gained < 1) { showToast('Need 100+ copper', 'bad'); return; }
    s.res.copper = (s.res.copper || 0) % 100;
    s.res.silver += gained;
    showToast(`🪙 +${gained} silver`, 'good');
  } else if (key === 'silver-stones') {
    const stones = Math.floor(s.res.silver / 1000);
    if (stones < 1) { showToast('Need 1000+ silver for 1 stone', 'bad'); return; }
    s.res.silver -= stones * 1000;
    s.res.stones += stones;
    showToast(`💎 +${stones} spirit stones`, 'good');
  } else if (key === 'stones-jade') {
    if (s.realmIndex < 10 || s.res.stones < 1000) { showToast('Need Realm 11+ and 1000 stones', 'bad'); return; }
    s.res.stones -= 1000; s.res.immortalJade++;
    showToast('✨ +1 Immortal Jade!', 'warn', 3200);
  }
}

function handlePickSaveSlot(s, slotStr) {
  const slot = parseInt(slotStr);
  if (slot >= 0) {
    s.autoSaveSlot = slot;
    s.settings.autoSave = true;
  }
  if (s._randomLife) {
    s._randomLife = false;
    startGame(s);
  } else {
    s.setupStep = 0;
  }
}

// ─────────────────────────────────────────────────────────────
const _base_passiveEffects = passiveEffects;
passiveEffects = function(s) {
  _base_passiveEffects(s);
  progressDisciples(s);
  if ((s.disciples || 0) > 0 && s.sect.joined) {
    s.res.merit += s.disciples * (2 + s.realmIndex);
  }
  // Timed luxury effects (lightweight): expire by year, re-apply into consumables
  if (s.effects) {
    for (const [k, v] of Object.entries(s.effects)) {
      if (!v || v.untilYear === undefined) continue;
      if (s.year > v.untilYear) { delete s.effects[k]; continue; }
      if (k === 'dangerReduce') {
        s.inv.consumables.dangerReduce = Math.max(s.inv.consumables.dangerReduce || 0, v.value || 0);
      }
      if (k === 'alchemyBoost') {
        s.inv.consumables.alchemyBoost = Math.max(s.inv.consumables.alchemyBoost || 0, v.value || 0);
      }
      if (k === 'dynastyPrivy') {
        s.res.silver += (v.value || 0);
      }
    }
  }
  checkDemonicChase(s);
  checkTutorial(s);
  if (s.realmIndex === 0 && s.year <= 5) {
    s.res.copper = (s.res.copper || 0) + rand(20, 60);
  }
}

// OVERRIDE: maybeQueueEvent — with per-event cooldowns
// ─────────────────────────────────────────────────────────────
const _eventCooldowns = {};
maybeQueueEvent = function(s) {
  if (s.overlay === 'choice') return;
  if (Math.random() > 0.22) return;
  const pool = YEAR_EVENTS.filter(e => {
    if (e.realm !== -1 && s.realmIndex < e.realm) return false;
    return (s.year - (_eventCooldowns[e.key] || 0)) >= 6;
  });
  if (!pool.length) return;
  const ev = pick(pool);
  _eventCooldowns[ev.key] = s.year;
  s.overlay     = 'choice';
  s.overlayData = { ...ev };
}

function renderTerritoryWars(s) {
  const myPow = calcMilitaryPower(s);

  h += `<div class="screen-scroll">`;
  h += `<div class="card" style="margin-top:8px">

    <div class="card-sub">Cultivation: ${fmt(powerRating(s))} · Soldiers: ${fmt((s.soldiers||0)*50)} · Generals: ${fmt((s.generals||0)*400)}${s.beast.activeKey?' · Beast: '+fmt((byKey(BEASTS,s.beast.activeKey)?.cultivBonus||0)*180):''}</div>

  h += `<div class="notice" style="margin:6px 12px">Win% is shown before you commit. Even 10× stronger = 92% max. Losing costs soldiers.</div>`;
  const TIER_REQ = { mortal:4, spiritual:6, immortal:10 };
  for (const tier of ['mortal','spiritual','immortal']) {
    h += `<div class="section-label">${tier.toUpperCase()} TERRITORIES (${s.territories[tier]} held)</div>`;

      h += `<div class="notice warn">Requires Realm ${TIER_REQ[tier]+1}+. Locked.</div>`; continue;
    }
    for (const enemy of TERRITORY_ENEMIES.filter(e => e.tier === tier)) {
      const ratio = myPow / Math.max(enemy.basePower, 1);
      const pct   = Math.min(92, Math.max(8, Math.round(50 * Math.pow(ratio, 0.6))));
      const rew   = enemy.reward.immortalJade ? `${enemy.reward.immortalJade}✨` : `${enemy.reward.stones}💎`;
      h += renderRow({ icon:'⚔️', title:enemy.name, sub:`Enemy power: ${fmt(enemy.basePower)} · Win: ${pct}% · Reward: ${rew} + territory`, value:`${pct}%`, cls:pct>=65?'good':pct>=40?'':'danger', action:`data-contest-enemy="${enemy.key}"` });
    }
  }
  h += `<div class="section-label">BUILD MILITARY</div>`;
  h += renderRow({ icon:'⚔️', title:'Recruit Soldiers (×50)', sub:'100💎 → +50 troops → +2,500 power', value:'100💎', action:'data-military-buy="soldiers"' });

  return h;
}

// ─────────────────────────────────────────────────────────────
// OVERRIDE: bindEvents — single definition, all new handlers
// ─────────────────────────────────────────────────────────────
bindEvents = function() {
  const root = document.getElementById('root');
  root.onclick = e => {
    const t = e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-buy-artifact],[data-buy-lux],[data-launch-biz],[data-buy-property],[data-travel],[data-contest-enemy],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose],[data-dao-comp],[data-challenge],[data-talk-rel],[data-toggle],[data-open-rel],[data-save-slot],[data-load-slot],[data-delete-slot],[data-join-sect],[data-set-job],[data-sect-action],[data-commit-crime],[data-refine-pill],[data-forge-item],[data-buy-beast-egg],[data-beast-action],[data-dynasty-action],[data-immortal-action],[data-seek-immortal-manual],[data-pick-save-slot],[data-send-disciple],[data-military-buy],[data-gamble],[data-gamble-dice],[data-self-auction],[data-exchange]');
    if (!t) return;
    e.stopPropagation();

    // ── New handlers first ──
    if (t.dataset.pickSaveSlot !== undefined) { handlePickSaveSlot(S, t.dataset.pickSaveSlot); render(); return; }
    if (t.dataset.gamble)       { resolveGamble(S, t.dataset.gamble); render(); return; }
    if (t.dataset.gambleDice)   { resolveGamblingDice(S, t.dataset.gambleDice); render(); return; }
    if (t.dataset.selfAuction)  { resolveSelfAuction(S, t.dataset.selfAuction); render(); return; }
    if (t.dataset.exchange)     { resolveExchange(S, t.dataset.exchange); render(); return; }
    if (t.dataset.sendDisciple !== undefined) { sendDiscipleOut(S, parseInt(t.dataset.sendDisciple)); render(); return; }
    if (t.dataset.militaryBuy) {
      const m = t.dataset.militaryBuy;
      if (m==='soldiers') { if(S.res.stones>=100){S.res.stones-=100;S.soldiers+=50;writeLog(S,'Soldiers Recruited','+50 soldiers.','War','good');showToast('⚔️ +50 soldiers','good');}else showToast('Need 100💎','bad'); }
      else if (m==='general')  { if(S.res.stones>=300){S.res.stones-=300;S.generals++;writeLog(S,'General Hired','+1 general.','War','good');showToast('🌟 General hired — +400 power','good');}else showToast('Need 300💎','bad'); }
      else if (m==='alliance') { if(S.res.silver>=200){S.res.silver-=200;S.soldiers+=100;writeLog(S,'Alliance','+100 allied soldiers.','War','good');showToast('🤝 Alliance: +100 soldiers','good');}else showToast('Need 200🪙','bad'); }
      render(); return;
    }
    if (t.dataset.contestEnemy) {
      const enemy = TERRITORY_ENEMIES.find(e => e.key === t.dataset.contestEnemy);
      if (enemy) {
        const myPow = calcMilitaryPower(S);
        const TIER_REQ = { mortal:4, spiritual:6, immortal:10 };
        if (S.realmIndex < TIER_REQ[enemy.tier]) { showToast(`Need Realm ${TIER_REQ[enemy.tier]+1}+ for ${enemy.tier} territory`,'bad'); render(); return; }
        const ratio  = myPow / Math.max(enemy.basePower, 1);
        const winPct = Math.min(92, Math.max(8, Math.round(50 * Math.pow(ratio, 0.6))));
        if (Math.random() * 100 < winPct) {
          S.territories[enemy.tier]++;
          if (enemy.reward.stones)      S.res.stones       += enemy.reward.stones;
          if (enemy.reward.immortalJade) S.res.immortalJade += enemy.reward.immortalJade;
          S.rankings.sect += 5;
          updateDynastyTier(S);
          writeLog(S, `Defeated ${enemy.name}`, `Power ${fmt(myPow)} vs ${fmt(enemy.basePower)}. +1 ${enemy.tier} territory.`, 'War', 'good');
          showToast(`⚔️ ${enemy.name} defeated! Territory +1`, 'good', 3500);
        } else {
          const loss = Math.max(5, Math.round((enemy.basePower / Math.max(myPow, 1)) * 10));
          S.soldiers = Math.max(0, Math.round(S.soldiers * (1 - loss/100)));
          S.stats.body = clamp(S.stats.body - rand(1,3), 0, 100);
          writeLog(S, `Defeated by ${enemy.name}`, `${loss}% casualty loss.`, 'War', 'bad');
          showToast(`Campaign lost — ${loss}% casualties`, 'bad', 3000);
        }
      }
      render(); return;
    }

    // ── action handlers ──
    const action = t.dataset.action;
    if (action) {
      if (action==='advance-year') {
        if (S.settings.ageConfirm && !confirm('Advance one year?')) return;
        advanceYear(S);
        checkTutorial(S);
        if (S.minorLevel >= 9 && S.screen === 'game') showToast('🌟 Minor Level 9! Breakthrough ready.', 'warn', 3000);
      }
      else if (action==='attempt-breakthrough')  { attemptBreakthrough(S); }
      else if (action==='start-new-life')         { S=createState(); S.adPhase='new_life'; S.screen='ad'; startAdCountdown(); }
      else if (action==='start-random-life')      { S=createState(); rollRandomLife(S); S.adPhase='new_life'; S.screen='ad'; startAdCountdown(); }
      else if (action==='finish-ad')              { clearInterval(adInterval); S.screen='setup'; if(!S._randomLife) S.selectedPhysique=rollPhysique(); }
      else if (action==='claim-windfall')         { clearInterval(adInterval); claimWindfall(S); showToast('✨ Windfall claimed!','warn',3000); }
      else if (action==='activate-windfall')      { activateWindfall(S); startAdCountdown(); }
      else if (action==='open-profile')           { S.overlay='profile'; }
      else if (action==='open-history')           { S.overlay='history'; }
      else if (action==='close-overlay')          { S.overlay=null; S.overlayData=null; }
      else if (action==='close-breakthrough')     { S.overlay=null; S.overlayData=null; }
      else if (action==='close-subscreen')        { S.subscreen=null; }
      else if (action==='close-auction')          { S.overlay=null; }
      else if (action==='noop')                   { return; }
      else if (action==='setup-next') {
        if (S.setupStep===0&&S.selectedOrigin)         S.setupStep=1;
        else if (S.setupStep===1&&S.selectedTemperament) S.setupStep=2;
        else if (S.setupStep===2) { if(S.selectedPath==='wanderer') startGame(S); else if(S.selectedPath==='sect') S.setupStep=3; }
        else if (S.setupStep===3&&S.selectedSect)       startGame(S);
      }
      else if (action==='open-save'||action==='open-save-title') { S.overlay='save'; }
      else if (action==='commit-bid')             { commitBid(S); }
      else if (action==='open-crime')             { S.overlay='crime'; }
      else if (action==='open-hatch')             { S.overlay='hatch'; }
      else if (action==='open-jobmenu')           { S.overlay='jobmenu'; }
      else if (action==='leave-sect')             { leaveSect(S); }
      else if (action==='take-disciple')          { addDisciple(S); }
    }

    if (t.dataset.origin)       { S.selectedOrigin=t.dataset.origin; }
    if (t.dataset.temperament)  { S.selectedTemperament=t.dataset.temperament; }
    if (t.dataset.path)         { S.selectedPath=t.dataset.path; }
    if (t.dataset.sect)         { S.selectedSect=t.dataset.sect; }
    if (t.dataset.tab)          { S.activeTab=t.dataset.tab; S.subscreen=null; }
    if (t.dataset.open)         { S.subscreen=t.dataset.open; }
    if (t.dataset.selectAction) { S.selectedAction=t.dataset.selectAction; showToast(`Action: ${t.dataset.selectAction}`,'warn',1400); }

    if (t.dataset.buyItem)      { buyShopItem(S,t.dataset.buyItem); }
    if (t.dataset.buyLux) {
      const it=LUXURY_ITEMS.find(x=>x.key===t.dataset.buyLux);
      if(it && S.res.stones>=it.costStones){
        S.res.stones-=it.costStones;
        // Apply effects
        const eff=it.effect||{};
        if(eff.statBoost){
          for(const[k,v] of Object.entries(eff.statBoost)){
            if(k in S.stats) S.stats[k]=clamp(S.stats[k]+v,0,100);
          }
        }
        if(eff.dangerReduce){
          S.effects=S.effects||{};
          S.effects.dangerReduce={value:eff.dangerReduce,untilYear:S.year+(eff.years||10)};
        }
        if(eff.successBoost){
          S.inv.consumables.successBoost=(S.inv.consumables.successBoost||0)+eff.successBoost;
        }
        if(eff.alchemyBoost){
          S.effects=S.effects||{};
          S.effects.alchemyBoost={value:eff.alchemyBoost,untilYear:S.year+(eff.years||6)};
        }
        if(eff.forgeBoost){
          S.effects=S.effects||{};
          S.effects.forgeBoost={value:eff.forgeBoost,untilYear:S.year+(eff.years||5)};
        }
        if(eff.dynastyPrivy){
          S.effects=S.effects||{};
          S.effects.dynastyPrivy={value:eff.dynastyPrivy,untilYear:S.year+(eff.years||8)};
        }
        writeLog(S,'Luxury Purchase',`${it.name} acquired from the luxury market.`,'Market','good');
        showToast(`🏷 Luxury acquired: ${it.name}`,'good',3500);
      } else showToast('Cannot purchase luxury item','bad');
    }
    if (t.dataset.buyArtifact) {
      const [key,price]=t.dataset.buyArtifact.split('_');
      if(!S.inv.artifacts.includes(key)&&S.res.stones>=parseInt(price)){
        S.res.stones-=parseInt(price); S.inv.artifacts.push(key);
        const a=byKey(ARTIFACTS,key); if(a) Object.entries(a.bonus).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.4),0,100);});
        writeLog(S,'Artifact Purchased',`${a?.name||key} secured.`,'Market','good'); showToast(`💎 ${a?.name||key} purchased!`,'good');
      } else showToast('Cannot purchase','bad');
    }
    if (t.dataset.launchBiz)    { launchBusiness(S,t.dataset.launchBiz); }
    if (t.dataset.buyProperty) {
      const p=PROPERTIES.find(x=>x.key===t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const okJ=p.costJade&&S.res.immortalJade>=(p.costJade||99999);
        const okSt=p.costStones&&S.res.stones>=p.costStones;
        const okSi=p.costSilver&&S.res.silver>=p.costSilver;
        if(okJ){S.res.immortalJade-=p.costJade;S.inv.properties.push(p.key);writeLog(S,'Property Acquired',p.name,'Business','good');showToast(`🏠 ${p.name} acquired!`,'good');}
        else if(okSt){S.res.stones-=p.costStones;S.inv.properties.push(p.key);writeLog(S,'Property Acquired',p.name,'Business','good');showToast(`🏠 ${p.name} acquired!`,'good');}
        else if(okSi){S.res.silver-=p.costSilver;S.inv.properties.push(p.key);writeLog(S,'Property Acquired',p.name,'Business','good');showToast(`🏠 ${p.name} acquired!`,'good');}
        else showToast('Insufficient funds','bad');
      }
    }
    if (t.dataset.travel) {
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l&&l.stage>0&&S.realmIndex<l.stage*6){showToast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');}
      else if(l){if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');showToast(`📍 ${l.name}`,'warn',2000);}S.locationKey=t.dataset.travel;}
    }
    if (t.dataset.startAuction) { startAuction(S,t.dataset.startAuction); }
    if (t.dataset.bidRaise)     { raiseBid(S,parseInt(t.dataset.bidRaise)); }
    if (t.dataset.hatch)        { hatchBeast(S,t.dataset.hatch); showToast(`🐉 ${byKey(BEASTS,t.dataset.hatch)?.name} bonded!`,'good',4000); S.overlay=null; }
    if (t.dataset.choose)       { resolveYearChoice(S,t.dataset.choose); }
    if (t.dataset.giftRel) {
      if(S.res.stones>=10){S.res.stones-=10;const r=S.relations.find(x=>x.key===t.dataset.giftRel);if(r){r.bond=clamp(r.bond+8,-100,100);r.trust=clamp(r.trust+5,-100,100);r.giftCooldown=2;showToast(`🎁 Gift to ${r.name} — Bond +8`,'good');}
      }else showToast('Need 10💎','bad');
    }
    if (t.dataset.propose) {
      const r=S.relations.find(x=>x.key===t.dataset.propose);
      if(r&&r.bond>=40&&!S.family.spouse){S.family.spouse=r.name;S.metrics.marriages++;writeLog(S,'Proposal Accepted',`${r.name} accepted.`,'Bonds','good');showToast(`💍 ${r.name} accepted!`,'good',4000);S.overlay=null;}
      else showToast('Bond not deep enough (need 40+)','bad');
    }
    if (t.dataset.daoComp) {
      const r=S.relations.find(x=>x.key===t.dataset.daoComp);
      if(r&&r.trust>=50&&!S.family.daoComp){S.family.daoComp=r.name;writeLog(S,'Dao Bond Forged',`${r.name} accepted.`,'Bonds','good');showToast(`☯️ ${r.name} — Dao Bond!`,'good',4000);S.overlay=null;}
      else showToast('Need trust 50+ for Dao Bond','bad');
    }
    if (t.dataset.challenge) {
      const r=S.relations.find(x=>x.key===t.dataset.challenge);
      if(r){if(Math.random()<0.5+S.stats.will*0.003){r.bond=clamp(r.bond-12,-100,100);S.stats.reputation=clamp(S.stats.reputation+9,0,100);writeLog(S,'Duel Victory','Victory.','Combat','good');showToast('⚔️ Won the duel!','good');}
      else{S.stats.body=clamp(S.stats.body-5,0,100);S.stats.instability=clamp(S.stats.instability+8,0,100);writeLog(S,'Duel Loss','Defeated.','Combat','bad');showToast('💔 Lost the duel','bad');}S.overlay=null;}
    }
    if (t.dataset.talkRel) {
      const r=S.relations.find(x=>x.key===t.dataset.talkRel);
      if(r){r.bond=clamp(r.bond+3,-100,100);r.trust=clamp(r.trust+2,-100,100);showToast(`💬 Talked with ${r.name}. Bond +3`,'warn',2000);}
      S.overlay=null;
    }
    if (t.dataset.toggle)       { S.settings[t.dataset.toggle]=!S.settings[t.dataset.toggle]; if(t.dataset.toggle==='autoSave')S.autoSaveSlot=S.settings.autoSave?0:-1; showToast(`${t.dataset.toggle}: ${S.settings[t.dataset.toggle]?'ON':'OFF'}`,'warn',1600); }
    if (t.dataset.openRel)      { S.overlay='rel-detail'; S.overlayData=t.dataset.openRel; }
    if (t.dataset.saveSlot!==undefined)  { if(saveGame(S,parseInt(t.dataset.saveSlot)))showToast(`💾 Saved to Slot ${parseInt(t.dataset.saveSlot)+1}`,'good'); S.overlay=null; }
    if (t.dataset.loadSlot!==undefined)  { const ld=loadGame(parseInt(t.dataset.loadSlot)); if(ld){S=ld;S.overlay=null;showToast('📂 Life loaded','good');}else showToast('Failed to load','bad'); }
    if (t.dataset.deleteSlot!==undefined){ deleteSave(parseInt(t.dataset.deleteSlot)); showToast('🗑 Save deleted','bad',1600); }
    if (t.dataset.joinSect) {
      const sec=byKey(SECTS,t.dataset.joinSect);
      if(sec&&!S.sect.joined&&S.realmIndex>=(sec.allowRealm||0)){
        S.sect.joined=true;S.sect.key=t.dataset.joinSect;S.sect.rankKey='layman';
        if(sec.stats)Object.entries(sec.stats).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.5),0,100);});
        const sm=MANUALS.find(m=>m.reqRealm===0&&!S.inv.manuals.includes(m.key));if(sm)S.inv.manuals.push(sm.key);
        writeLog(S,'Sect Joined',`Now a Layman Disciple of ${sec.name}.`,'Sect','good');showToast(`⛩ Joined ${sec.name}!`,'good',3500);
      }
    }
    if (t.dataset.setJob)       { S.currentJob=t.dataset.setJob; S.overlay=null; showToast(`💼 ${byKey(MORTAL_JOBS,t.dataset.setJob)?.name}`,'warn',2000); }
    if (t.dataset.sectAction) {
      const sa=t.dataset.sectAction; const cost=({assign:0,'assign-junior':5,donate:0,scheme:3,'request-manual':0,faction:5})[sa]||0;
      if(cost>0&&S.sect.favor<cost){showToast(`Need ${cost} favor`,'bad');render();return;}
      if(cost>0)S.sect.favor=clamp(S.sect.favor-cost,0,100);
      if(sa==='assign'||sa==='assign-junior'){S.sect.favor=clamp(S.sect.favor+8,0,100);S.res.merit+=15;writeLog(S,'Duty Done','','Sect','good');showToast('⛩ Merit +15, Favor +8','good');}
      else if(sa==='donate'){if(S.res.stones>=100){S.res.stones-=100;S.res.merit+=15;S.sect.favor=clamp(S.sect.favor+8,0,100);writeLog(S,'Donated','','Sect','good');showToast('💎 Donated — Merit +15','good');}else showToast('Need 100💎','bad');}
      else if(sa==='scheme'){if(Math.random()<0.55){S.res.merit+=25;writeLog(S,'Scheme Succeeded','','Sect','good');showToast('😈 Scheme — Merit +25','good');}else{S.sect.rivalryPressure=clamp(S.sect.rivalryPressure+15,0,100);writeLog(S,'Scheme Backfired','','Sect','bad');showToast('⚠️ Scheme backfired!','bad');}}
      else if(sa==='faction'){if(Math.random()<0.6){S.sect.favor=clamp(S.sect.favor+20,0,100);writeLog(S,'Faction Aligned','','Sect','good');showToast('🤝 Favor +20','good');}else{S.sect.rivalryPressure=clamp(S.sect.rivalryPressure+20,0,100);writeLog(S,'Wrong Faction','','Sect','bad');showToast('😬 Wrong faction!','bad');}}
    }
    if (t.dataset.commitCrime)  { commitCrime(S,t.dataset.commitCrime); }
    if (t.dataset.refinePill)   { refinePill(S,t.dataset.refinePill); }
    if (t.dataset.forgeItem)    { forgeItem(S,t.dataset.forgeItem); }
    if (t.dataset.dynastyAction) {
      const da=t.dataset.dynastyAction;
      if(da==='campaign'){if(Math.random()<0.55){const tier=S.realmIndex>=6?'spiritual':'mortal';S.territories[tier]++;updateDynastyTier(S);writeLog(S,'Campaign Victory','','War','good');showToast('⚔️ Territory captured!','good');}else{S.soldiers=Math.max(0,Math.round(S.soldiers*0.9));writeLog(S,'Campaign Defeat','','War','bad');showToast('💔 Campaign defeated','bad');}}
      else if(da==='alliance'){if(S.res.silver>=200){S.res.silver-=200;S.territories.mortal++;updateDynastyTier(S);writeLog(S,'Alliance Forged','','Dynasty','good');showToast('🤝 Territory +1','good');}else showToast('Need 200🪙','bad');}
      else if(da==='edict'){if(S.res.merit>=50){S.res.merit-=50;S.sect.favor=clamp(S.sect.favor+10,0,100);writeLog(S,'Edict Issued','','Dynasty','good');showToast('📜 Edict — Favor +10','good');}else showToast('Need 50 merit','bad');}
    }
    if (t.dataset.immortalAction) {
      if(S.realmIndex>=12&&Math.random()<0.45){S.stats.reputation=clamp(S.stats.reputation+15,0,100);S.res.immortalJade+=3;writeLog(S,'Heavenly Position','','Immortal','good');showToast('👑 Heavenly position!','good',4000);}
      else{S.stats.instability=clamp(S.stats.instability+15,0,100);writeLog(S,'Contest Failed','','Immortal','bad');showToast('Contest failed','bad');}
    }
    if (t.dataset.seekImmortalManual) {
      if(S.realmIndex>=9){const el=MANUALS.filter(m=>m.rarity==='Mythic'&&m.reqRealm<=S.realmIndex&&!S.inv.manuals.includes(m.key));if(el.length&&S.res.immortalJade>=5){S.res.immortalJade-=5;S.inv.manuals.push(pick(el).key);writeLog(S,'Mythic Manual','','Immortal','good');showToast('🌌 Mythic manual!','good',4000);}else if(!el.length)showToast('No mythic manuals available','bad');else showToast('Need 5 Immortal Jade','bad');}
      else showToast('Requires Realm 10+','bad');
    }
    if (t.dataset.buyBeastEgg) {
      const[key,price]=t.dataset.buyBeastEgg.split('_');
      if(!S.beast.activeKey&&!S.beast.pendingEgg&&S.res.stones>=parseInt(price)){S.res.stones-=parseInt(price);S.beast.pendingEgg=true;writeLog(S,'Beast Egg','Acquired.','Beast','good');showToast('🥚 Beast egg — go hatch it!','good',3500);S.overlay='hatch';}
      else showToast('Cannot buy beast egg right now','bad');
    }
    if (t.dataset.beastAction) {
      const ba=t.dataset.beastAction;
      if(ba==='feed'){if(S.res.stones>=60){S.res.stones-=60;S.beast.loyalty=clamp(S.beast.loyalty+20,0,100);showToast('🐾 Beast fed — Loyalty +20','good');}else showToast('Need 60💎','bad');}
      else if(ba==='upgrade-chain'){if(S.res.stones>=70){S.res.stones-=70;const b=byKey(BEASTS,S.beast.activeKey);if(b)b.cultivBonus+=3;writeLog(S,'Beast Upgraded','+3 cultiv.','Beast','good');showToast('⛓ Chain upgraded — +3 cultiv','good');}else showToast('Need 70💎','bad');}
    }
    render();
  };
}

// ─── UTILITY HELPERS ─────────────────────────────────────────
function getPrestige(s){
  let p = s.realmIndex * 15;
  p += s.territories.mortal*3 + s.territories.spiritual*8 + s.territories.immortal*20;
  p += Math.floor(s.res.merit/20);
  p += s.inv.artifacts.length*4;
  const rank = byKey(SECT_RANKS, s.sect.rankKey);
  if(rank) p += (SECT_RANKS.indexOf(rank))*8;
  p += (s.metrics.breakthroughs||0)*5;
  return Math.min(p, 999);
}

function getPlayerAvatarEmoji(s){
  const stage = getPlayerStage(s);
  return stage.emoji;
}

function getNPCRealmName(realmIdx){
  const r = REALMS[Math.min(realmIdx, REALMS.length-1)];
  return r ? r.name : 'Mortal';
}

function buildYearLog(s){
  // Group eventLog by year, return last 8 years
  const byYear = {};
  for(const e of s.eventLog){
    if(!byYear[e.year]) byYear[e.year]=[];
    byYear[e.year].push(e);
  }
  const years = Object.keys(byYear).map(Number).sort((a,b)=>b-a).slice(0,8);
  return years.map(yr=>({year:yr, entries:byYear[yr]}));
}

function getSectMembers(s){
  if(!s.sect.joined) return [];
  return (SECT_MEMBERS[s.sect.key]||[]);
}

// ─── STATE PATCHES ───────────────────────────────────────────
const _v5_createState = createState;
createState = function(){
  const s = _v5_createState();
  s.gender         = 'male';   // 'male'|'female'
  s.prestige       = 0;
  s.concubines     = [];       // [{name,bond}]
  s.sectMembers    = {};       // cached NPC bonds {npcName: bond}
  s.schemeTarget   = null;     // current scheme target
  s.dualCultPartner= null;
  s.uniqueEventsDone = {};     // which unique events fired
  s.lastTerritoryAttack = -99; // year of last territory attack
  s.lastUniqueEvent = -15;
  s.auctionBidHistory = [];
  s.auctionTurnsLeft  = 0;
  s.manualRequired    = {};    // realmIndex -> manual key acquired
  s.setupStep = -1;            // -1 = gender select, then 0-3
  s.killLog    = [];
  return s;
};

const _v5_startGame = startGame;
startGame = function(s){
  _v5_startGame(s);
  s.prestige = s.realmIndex*15 + (s.stats.reputation||10);
  // Relationship pool filtered by origin
  _initRelationsForOrigin(s);
  if(!s.uniqueEventsDone) s.uniqueEventsDone={};
  if(!s.lastTerritoryAttack) s.lastTerritoryAttack=-99;
  if(!s.lastUniqueEvent) s.lastUniqueEvent=-15;
  if(!s.concubines) s.concubines=[];
  if(!s.sectMembers) s.sectMembers={};
  if(!s.manualRequired) s.manualRequired={};
  if(!s.killLog) s.killLog=[];
};

function _initRelationsForOrigin(s){
  const origin = s.selectedOrigin;
  // Beggars start with no relationships; village/others start with a few
  let pool;
  if(origin==='beggar'){
    pool = []; // no relationships — must earn them
  } else if(origin==='merchant'){
    pool = RELATIONS_POOL.filter(r=>['merchant_ally','rival','comp_lian'].includes(r.key));
  } else if(origin==='disciple'){
    pool = RELATIONS_POOL.filter(r=>['master','rival','comp_su','disciple1'].includes(r.key));
  } else {
    pool = RELATIONS_POOL.filter(r=>['master','rival','comp_lian','old_friend'].includes(r.key));
  }
  // Gender: female player gets male romance options, male gets female ones
  // (already in pool — comp_su is male, comp_lian/mei are female)
  s.relations = pool.map(r=>({
    ...r, bond:r.baseAffinity+rand(-8,8),
    trust:clamp(r.baseAffinity+rand(-12,12),-100,100),
    events:[], giftCooldown:0,
  }));
}

// ─── PASSIVE EFFECTS PATCH ───────────────────────────────────
const _v5_passiveEffects = passiveEffects;
passiveEffects = function(s){
  _v5_passiveEffects(s);
  // Prestige
  s.prestige = getPrestige(s);
  // Dual cultivation speed bonus
  if(s.dualCultPartner){
    const bonus = Math.round((physique(s).cultivMult - 0.8) * 3) + 3;
    s.minorQi = (s.minorQi||0) + bonus;
  }
  // Property prestige bonus (passive income boost)
  if(s.inv.properties.includes('shop'))       { s.res.silver += 15; s.prestige++; }
  if(s.inv.properties.includes('estate'))     { s.res.silver += 40; s.prestige += 2; }
  if(s.inv.properties.includes('spirit_court')){ s.res.stones += 3; s.prestige += 3; }
  // Territory upkeep (casualties reduce attack cooldown when insufficient)
  // Manual requirement check — remind if missing
  _checkManualRequirement(s);
};

function _checkManualRequirement(s){
  // Need a manual for each major realm boundary: 0,2,4,6,9,12
  const boundaries = {0:null, 2:'foundation_manual', 4:'nascent_manual', 6:'void_manual', 9:'mahayana_manual', 12:'immortal_edict'};
  for(const [realmStr, manualKey] of Object.entries(boundaries)){
    if(!manualKey) continue;
    const realm = parseInt(realmStr);
    if(s.realmIndex >= realm && !s.manualRequired[realm]){
      // Check if they have ANY manual that covers this realm
      const hasCovering = s.inv.manuals.some(mk=>{
        const m=byKey(MANUALS,mk);
        return m && m.reqRealm<=realm && m.reqRealm>=Math.max(0,realm-2);
      });
      s.manualRequired[realm] = hasCovering;
    }
  }
}

// ─── MAYBEQUEUE UNIQUE EVENT ─────────────────────────────────
const _v5_maybeQueue = maybeQueueEvent;
maybeQueueEvent = function(s){
  // Unique events every ~10 years
  if(s.overlay==='choice') return;
  const yearsSinceLast = s.year - (s.lastUniqueEvent||0);
  if(yearsSinceLast >= 10 && Math.random() < 0.6){
    const eligible = UNIQUE_EVENTS.filter(e=>
      !s.uniqueEventsDone[e.key] &&
      s.realmIndex >= e.minRealm &&
      (s.gender==='male' || !['ue_concubine_offer'].includes(e.key))
    );
    if(eligible.length){
      const ev = pick(eligible);
      s.lastUniqueEvent = s.year;
      s.uniqueEventsDone[ev.key] = true;
      s.overlay = 'unique_event';
      s.overlayData = ev;
      return;
    }
  }
  // Fall through to regular events (less frequent)
  if(Math.random() < 0.12) _v5_maybeQueue(s);
};

// ─── RESOLVE UNIQUE EVENT ────────────────────────────────────
function resolveUniqueEvent(s, choiceIdx){
  const ev = s.overlayData;
  if(!ev || !ev.choice) return;
  const ch = ev.choice[choiceIdx];
  if(!ch) return;
  const e = ch.eff||{};
  if(e.stones)         s.res.stones    = Math.max(0, s.res.stones+e.stones);
  if(e.silver)         s.res.silver    = Math.max(0, s.res.silver+e.silver);
  if(e.herbs)          s.res.herbs     += e.herbs;
  if(e.relics)         s.res.relics    += e.relics;
  if(e.karma)          s.stats.karma    = clamp(s.stats.karma+e.karma,-100,100);
  if(e.reputation)     s.stats.reputation= clamp(s.stats.reputation+e.reputation,0,100);
  if(e.insight)        s.res.insight   += e.insight;
  if(e.comprehension)  s.stats.comprehension=clamp(s.stats.comprehension+e.comprehension,0,100);
  if(e.will)           s.stats.will     = clamp(s.stats.will+e.will,0,100);
  if(e.purity)         s.stats.purity   = clamp(s.stats.purity+e.purity,0,100);
  if(e.stability)      s.stats.stability= clamp(s.stats.stability+e.stability,0,100);
  if(e.instability)    s.stats.instability=clamp(s.stats.instability+e.instability,0,100);
  if(e.luck)           s.stats.luck     = clamp(s.stats.luck+e.luck,0,100);
  if(e.ruthlessness)   s.stats.ruthlessness=clamp(s.stats.ruthlessness+e.ruthlessness,0,100);
  if(e.notoriety)      s.rankings.notoriety+=e.notoriety;
  if(e.sectFavor)      s.sect.favor     = clamp(s.sect.favor+e.sectFavor,0,100);
  if(e.beastLoyalty)   s.beast.loyalty  = clamp(s.beast.loyalty+e.beastLoyalty,0,100);
  if(e.soldiers)       s.soldiers       = (s.soldiers||0)+e.soldiers;
  if(e.disciples)      s.disciples      = Math.max(0,(s.disciples||0)+e.disciples);
  if(e.successBoost)   s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+e.successBoost;
  if(e.newConcubine && !s.family.spouse){
    s.concubines = s.concubines||[];
    s.concubines.push({name:'Lady Hua Mei', bond:30, realmIdx:1});
    writeLog(s,'Concubine Accepted','Lady Hua Mei joined your household as a secondary consort.','Bonds','neutral');
  }
  if(e.demonicManual){
    const dm=MANUALS.find(m=>m.domain==='Demonic'&&!s.inv.manuals.includes(m.key));
    if(dm) s.inv.manuals.push(dm.key);
  }
  if(e.ghostManual){
    const gm=MANUALS.find(m=>m.domain==='Ghost'&&!s.inv.manuals.includes(m.key))||MANUALS.find(m=>!s.inv.manuals.includes(m.key)&&m.reqRealm===0);
    if(gm) s.inv.manuals.push(gm.key);
  }
  if(e.manualHint){
    const em=MANUALS.find(m=>m.reqRealm<=s.realmIndex&&!s.inv.manuals.includes(m.key));
    if(em){ s.inv.manuals.push(em.key); writeLog(s,'Manual Found','Hidden manual discovered from merchant stock.','Market','good'); }
  }
  if(e.breakthrough_bonus) s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+e.breakthrough_bonus;
  if(e.dualCultEvent && !s.dualCultPartner && !s.family.spouse){
    s.dualCultPartner='Fellow Cultivator (Anonymous)';
    writeLog(s,'Dual Cultivation Agreed','A mutual resonance cultivation began. Your cultivation speed increases.','Cultivation','good');
  }
  if(e.daoCompBond && s.family.daoComp){
    const r=s.relations.find(x=>x.name===s.family.daoComp);
    if(r) r.bond=clamp(r.bond+e.daoCompBond,-100,100);
  }
  writeLog(s, ev.title, ch.label+' — '+ev.text.substring(0,60)+'…', 'Encounter', 'good');
  s.overlay=null; s.overlayData=null;
  showToast(`✨ ${ev.title.substring(0,40)}…`, 'warn', 4000);
}

// ─── TERRITORY WARFARE (PATCHED — cooldown + casualties) ─────
function contestTerritoryV5(s, tier){
  const TIER_REQ={mortal:4,spiritual:6,immortal:10};
  if(s.realmIndex<TIER_REQ[tier]){showToast(`Need Realm ${TIER_REQ[tier]+1}+ for ${tier} territory`,'bad');return;}
  const yearsSince = s.year-(s.lastTerritoryAttack||0);
  if(yearsSince<TERRITORY_COOLDOWN_YRS){showToast(`Territory recovery in progress — wait ${TERRITORY_COOLDOWN_YRS-yearsSince} more year(s)`,'bad');return;}
  s.lastTerritoryAttack=s.year;
  const myPow = calcMilitaryPower ? calcMilitaryPower(s) : powerRating(s)+(s.soldiers||0)*50+(s.generals||0)*400;
  const enemy = TERRITORY_ENEMIES.find(e=>e.tier===tier&&e.basePower<=myPow*3)||TERRITORY_ENEMIES.find(e=>e.tier===tier);
  if(!enemy){showToast('No eligible enemy found','bad');return;}
  const ratio  = myPow/Math.max(enemy.basePower,1);
  const winPct = Math.min(92,Math.max(8,Math.round(50*Math.pow(ratio,0.6))));
  // Casualties always happen regardless of win/loss
  const casualtyBase = Math.max(3, Math.round(100/(ratio+1)));
  const casualtySoldiers = Math.min(s.soldiers||0, Math.round((s.soldiers||0)*casualtyBase/100));
  s.soldiers = Math.max(0,(s.soldiers||0)-casualtySoldiers);
  s.stats.body = clamp(s.stats.body-rand(1,3),0,100);
  if(Math.random()*100<winPct){
    s.territories[tier]++;
    if(enemy.reward.stones)       s.res.stones+=enemy.reward.stones;
    if(enemy.reward.immortalJade) s.res.immortalJade+=enemy.reward.immortalJade;
    s.rankings.sect+=5;
    if(typeof updateDynastyTier==='function') updateDynastyTier(s);
    writeLog(s,`Territory Seized — ${enemy.name}`,`Power ${fmt(myPow)} vs ${fmt(enemy.basePower)}. ${casualtySoldiers} soldiers lost in battle. +1 ${tier} territory.`,'War','good');
    showToast(`⚔️ Victory! Territory +1 · ${casualtySoldiers} soldiers lost`,'good',3500);
  } else {
    s.stats.instability=clamp(s.stats.instability+rand(3,8),0,100);
    writeLog(s,`Defeated — ${enemy.name}`,`${casualtySoldiers} soldiers lost. Retreat ordered. Regroup before next attack.`,'War','bad');
    showToast(`Campaign failed — ${casualtySoldiers} soldiers lost · ${TERRITORY_COOLDOWN_YRS}yr cooldown`,'bad',3500);
  }
}

// ─── KILL NPC ────────────────────────────────────────────────
function killNPC(s, relKey){
  const rel = s.relations.find(r=>r.key===relKey);
  if(!rel){showToast('Target not found','bad');return;}
  const npcRealmIdx = rel.realmIdx||rand(0,s.realmIndex+1);
  const realmDiff = s.realmIndex - npcRealmIdx;
  if(realmDiff < 2){showToast(`Your cultivation gap is insufficient (need 2+ realms above target)`,'bad');return;}
  // Open kill in sect = exile
  if(s.sect.joined && rel.faction==='sect'){
    writeLog(s,'Exiled From Sect',`Killing ${rel.name} openly was witnessed. You are expelled from the sect in disgrace.`,'Sect','bad');
    showToast(`☠️ Killed ${rel.name} — EXILED from sect!`,'bad',5000);
    s.sect.joined=false; s.sect.key=null; s.sect.favor=0; s.sect.rivalryPressure=0;
    s.stats.karma=clamp(s.stats.karma-20,-100,100);
    s.stats.reputation=clamp(s.stats.reputation-25,0,100);
  } else {
    // Assassination — harder to track
    const caught = Math.random()<0.25;
    if(caught && s.sect.joined){
      writeLog(s,'Secret Execution Exposed',`${rel.name} killed but evidence surfaces. Sect reputation damaged.`,'Crime','bad');
      s.sect.favor=clamp(s.sect.favor-20,0,100);
      s.stats.karma=clamp(s.stats.karma-10,-100,100);
      showToast(`🔍 Murder discovered — Sect favor -20`,'bad',4000);
    } else {
      writeLog(s,'Silent Elimination',`${rel.name} was eliminated without witnesses. Their position is now vacant.`,'Crime','neutral');
      showToast(`☠️ ${rel.name} eliminated silently`,'bad',3500);
    }
    s.stats.karma=clamp(s.stats.karma-8,-100,100);
    s.stats.ruthlessness=clamp(s.stats.ruthlessness+5,0,100);
  }
  // Remove from relations
  s.relations = s.relations.filter(r=>r.key!==relKey);
  if(!s.killLog) s.killLog=[];
  s.killLog.push({name:rel.name, year:s.year});
  s.overlay=null; s.overlayData=null;
}

// ─── CHALLENGE FOR POSITION ──────────────────────────────────
function challengeForPosition(s, npcName, role){
  const myPow = powerRating(s);
  const npcRealmIdx = (getSectMembers(s).find(m=>m.name===npcName)||{}).realmIdx||s.realmIndex;
  const npcPow = npcRealmIdx*800+500;
  const winChance = Math.min(90, Math.max(10, Math.round(50*Math.pow(myPow/Math.max(npcPow,1),0.6))));
  if(Math.random()*100<winChance){
    writeLog(s,`Position Claimed — ${role}`,`You defeated ${npcName} in open challenge. The position is now yours.`,'Sect','good');
    showToast(`🏆 Defeated ${npcName}! Now ${role}`,'good',4000);
    s.sect.rankKey = role.includes('Vice')?'vice_leader':role.includes('Elder')?'elder':'core';
    s.sect.favor=clamp(s.sect.favor+15,0,100);
    s.stats.reputation=clamp(s.stats.reputation+12,0,100);
  } else {
    writeLog(s,`Challenge Failed — ${npcName}`,`You challenged ${npcName} and lost. Your standing in the sect weakened.`,'Sect','bad');
    showToast(`💔 Defeated by ${npcName}`,'bad',3000);
    s.sect.favor=clamp(s.sect.favor-10,0,100);
    s.stats.instability=clamp(s.stats.instability+8,0,100);
    s.stats.reputation=clamp(s.stats.reputation-5,0,100);
  }
  s.overlay=null;
}

// ─── SCHEME AGAINST LEADER ───────────────────────────────────
function schemeAgainstLeader(s, target){
  if(s.sect.favor<20){showToast('Need 20 favor to form a faction coalition','bad');return;}
  s.sect.favor=clamp(s.sect.favor-20,0,100);
  const myPow = powerRating(s);
  const schemePower = myPow + s.stats.social*10 + s.stats.ruthlessness*8;
  const success = Math.random()<0.45+(s.stats.charm-50)*0.004;
  if(success){
    writeLog(s,`Scheme Succeeded — ${target} Removed`,`Through careful manipulation and coalition-building, ${target} was ousted. The position shifts.`,'Sect','good');
    showToast(`😈 Scheme succeeded — ${target} removed!`,'good',5000);
    s.stats.ruthlessness=clamp(s.stats.ruthlessness+5,0,100);
    s.stats.karma=clamp(s.stats.karma-8,-100,100);
    // Promote player
    if(target.includes('Patriarch') || target.includes('Leader')){
      if(s.sect.rankKey==='elder'||s.sect.rankKey==='vice_leader') s.sect.rankKey='patriarch';
    } else {
      if(s.sect.rankKey==='inner'||s.sect.rankKey==='core') s.sect.rankKey='elder';
    }
    s.sect.favor=clamp(s.sect.favor+25,0,100);
  } else {
    writeLog(s,`Scheme Backfired`,`The plot was discovered. You narrowly avoided expulsion but trust is shattered.`,'Sect','bad');
    showToast(`⚠️ Scheme exposed — sect trust shattered`,'bad',4000);
    s.sect.rivalryPressure=clamp(s.sect.rivalryPressure+30,0,100);
    s.stats.karma=clamp(s.stats.karma-5,-100,100);
  }
  s.overlay=null;
}

// ─── DIVORCE / BREAK UP ──────────────────────────────────────
function breakUpWithSpouse(s){
  if(!s.family.spouse){showToast('No spouse to leave','bad');return;}
  const spouseName = s.family.spouse;
  s.family.spouse=null;
  s.res.stones = Math.max(0, s.res.stones - 200);  // penalty
  s.res.silver = Math.max(0, s.res.silver - 1000);
  s.stats.reputation=clamp(s.stats.reputation-20,0,100);
  s.stats.karma=clamp(s.stats.karma-6,-100,100);
  // Sect reacts if spouse was sect member
  if(s.sect.joined){
    s.sect.rivalryPressure=clamp(s.sect.rivalryPressure+25,0,100);
    s.sect.favor=clamp(s.sect.favor-15,0,100);
  }
  writeLog(s,'Marriage Severed',`You divorced ${spouseName}. 200💎 and 1000🪙 paid as settlement. Sect and family are furious.`,'Bonds','bad');
  showToast(`💔 Divorced ${spouseName} — heavy penalties applied`,'bad',5000);
  s.overlay=null;
}

// ─── AUCTION PATCH — 3-turn bidding ─────────────────────────
const _v5_startAuction = startAuction;
startAuction = function(s, lotKey){
  _v5_startAuction(s, lotKey);
  s.auctionTurnsLeft = 3;
  s.auctionBidHistory = [];
  if(s.auction && s.auction.lot){
    s.auctionBidHistory.push({who:'system',text:`Auction opens at ${s.auction.playerBid}💎`});
  }
};

function auctionNextTurn(s){
  if(!s.auction || s.auction.resolved) return;
  // Opponent bids
  if(s.auction.opponentActive && s.auction.opponentBid < s.auction.opponentMax){
    const oppBid = Math.min(s.auction.opponentMax, s.auction.opponentBid+rand(10,40));
    if(oppBid > s.auction.playerBid){
      s.auction.opponentBid=oppBid;
      s.auctionBidHistory.push({who:'opp',text:`Opponent bids ${oppBid}💎`});
    }
  }
  s.auctionTurnsLeft--;
  if(s.auctionTurnsLeft<=0) commitBid(s);
}

    h+=`<div class="notice warn" style="margin-top:8px">You are a Wandering Cultivator. Join a sect for stipends, manuals, and political opportunities.</div>`;

      h+=renderRow({icon:sec.icon,title:sec.name,sub:`${lt.tier||'?'} Tier · ${lt.league||sec.doctrine} · ${sec.focus}`,action:`data-join-sect="${sec.key}"`,value:'Join',cls:'good'});
    }

  }
  const sec=byKey(SECTS,s.sect.key);
  const rank=byKey(SECT_RANKS,s.sect.rankKey)||SECT_RANKS[0];
  const lt=(typeof SECT_LEAGUE_TIERS!=='undefined'?SECT_LEAGUE_TIERS[s.sect.key]:null)||{};
  h+=`<div class="card" style="margin-top:8px;border-color:var(--jade)">
    <div class="card-title">${sec.icon} ${sec.name}</div>
    <div class="card-sub">${lt.tier||'?'} Tier · ${lt.league||sec.doctrine}<br>${sec.focus}</div>
  </div>`;
  h+=`<div class="card good"><div class="card-title">${rank.name}</div>
    <div class="card-sub">Stipend: ${rank.stipendStones}💎 + ${rank.stipendSilver}🪙/yr<br>Merit: ${s.res.merit} · Favor: ${s.sect.favor}/100 · Rivalry: ${s.sect.rivalryPressure}/100</div></div>`;

  h+=sectionLabel('SECT MEMBERS');
  const members = getSectMembers(s);
  const patriarch = {name:`Patriarch ${sec.name.split(' ')[0]}`,role:'Sect Patriarch',realmIdx:Math.min(12,s.realmIndex+4),icon:'👴',romanceable:false,charm:30};
  for(const m of [patriarch,...members]){
    const bond = s.sectMembers[m.name]||0;
    const rname = getNPCRealmName(m.realmIdx);
    const canRomance = m.romanceable && m.charm>(s.stats.charm-10) && !s.family.spouse;
    const canDual = m.romanceable && bond>=40 && (s.stats.charm>60||s.stats.purity>60);
    const canKill = s.realmIndex>=(m.realmIdx+2);
    const canChallenge = s.realmIndex>=(m.realmIdx-1);
    h+=`<div class="sect-member-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div style="font-size:26px">${m.icon}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${m.name}</div>
          <div style="font-size:10px;color:var(--text3)">${m.role}</div>
          <div style="font-size:10px;font-weight:700;margin-top:2px;color:${REALMS[Math.min(m.realmIdx,REALMS.length-1)].color}">${rname}</div>
        </div>
        <div class="bond-chip ${bond>=0?'pos':'neg'}">${bond>=0?'+':''}${bond}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        <button style="padding:5px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--surface3);color:var(--text2);font-size:10px;cursor:pointer" data-sect-gift="${m.name}">🎁 Gift</button>
        <button style="padding:5px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--surface3);color:var(--text2);font-size:10px;cursor:pointer" data-sect-talk="${m.name}">💬 Talk</button>
        ${canRomance?`<button style="padding:5px 8px;border-radius:6px;border:1px solid var(--jade);color:var(--jade2);background:var(--surface3);font-size:10px;cursor:pointer" data-sect-romance="${m.name}">💕 Romance</button>`:''}
        ${canDual?`<button style="padding:5px 8px;border-radius:6px;border:1px solid rgba(80,128,255,.4);color:#8ab0ff;background:var(--surface3);font-size:10px;cursor:pointer" data-sect-dual="${m.name}">☯️ Dual Cult</button>`:''}
        ${canChallenge&&m.role.includes('Elder')||m.role.includes('Vice')?`<button style="padding:5px 8px;border-radius:6px;border:1px solid var(--gold);color:var(--gold2);background:var(--surface3);font-size:10px;cursor:pointer" data-challenge-position="${m.name}_${m.role}">⚔️ Challenge</button>`:''}

      </div>
    </div>`;
  }

  h+=sectionLabel('SECT POLITICS');
  h+=renderRow({icon:'📜',title:'Complete Sect Duty',sub:'Earn merit and favor',action:'data-sect-action="assign"',value:'+Merit'});

  }
  h+=renderRow({icon:'🚪',title:'Leave Sect',sub:'Has reputation/karma consequences',action:'data-action="leave-sect"',cls:'danger',value:'Leave'});
  h+=`</div>`;return h;
};
