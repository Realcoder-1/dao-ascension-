}

// ─── BIND EVENTS — single clean definition ───────────────────
bindEvents = function(){
  const root=document.getElementById('root');
  root.onclick=e=>{
    const t=e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-buy-artifact],[data-launch-biz],[data-buy-property],[data-travel],[data-contest-enemy],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose],[data-dao-comp],[data-challenge],[data-talk-rel],[data-toggle],[data-open-rel],[data-save-slot],[data-load-slot],[data-delete-slot],[data-join-sect],[data-set-job],[data-sect-action],[data-commit-crime],[data-refine-pill],[data-forge-item],[data-buy-beast-egg],[data-beast-action],[data-dynasty-action],[data-immortal-action],[data-seek-immortal-manual],[data-pick-save-slot],[data-send-disciple],[data-military-buy],[data-gamble],[data-gamble-dice],[data-self-auction],[data-exchange],[data-resolve-unique],[data-set-gender],[data-scheme-target],[data-sect-gift],[data-sect-talk],[data-sect-romance],[data-sect-dual],[data-challenge-position],[data-kill-npc],[data-auction-next-turn],[data-npc-action],[data-contest]');
    if(!t)return;
    e.stopPropagation();

    // Gender
    if(t.dataset.setGender){S.gender=t.dataset.setGender;render();return;}

    // Unique event resolution
    if(t.dataset.resolveUnique!==undefined){resolveUniqueEvent(S,parseInt(t.dataset.resolveUnique));render();return;}

    // Scheme target
    if(t.dataset.schemeTarget){schemeAgainstLeader(S,t.dataset.schemeTarget);render();return;}

    // Sect NPC interactions
    if(t.dataset.sectGift){
      const nm=t.dataset.sectGift;
      if(S.res.stones>=15){S.res.stones-=15;S.sectMembers=S.sectMembers||{};S.sectMembers[nm]=(S.sectMembers[nm]||0)+10;writeLog(S,'Gift Given',`Gift to ${nm}. Bond +10.`,'Sect','good');showToast(`🎁 Gift to ${nm} — Bond +10`,'good');}else showToast('Need 15💎','bad');
      render();return;
    }
    if(t.dataset.sectTalk){
      const nm=t.dataset.sectTalk;
      S.sectMembers=S.sectMembers||{};S.sectMembers[nm]=(S.sectMembers[nm]||0)+4;
      writeLog(S,'Conversation',`Meaningful exchange with ${nm}.`,'Sect','neutral');showToast(`💬 Talked with ${nm}. Bond +4`,'warn',2000);
      render();return;
    }
    if(t.dataset.sectRomance){
      const nm=t.dataset.sectRomance;
      const bond=S.sectMembers?.[nm]||0;
      if(bond>=30&&!S.family.spouse){S.family.spouse=nm;S.metrics.marriages++;writeLog(S,'Married',`${nm} accepted.`,'Bonds','good');showToast(`💍 Married ${nm}!`,'good',4000);}
      else if(bond<30) showToast('Build more bond first (need 30+)','bad');
      else showToast('Already married','bad');
      render();return;
    }
    if(t.dataset.sectDual){
      const nm=t.dataset.sectDual;
      startDualCultivation(S,nm);render();return;
    }
    if(t.dataset.challengePosition){
      const [nm,...roleParts]=t.dataset.challengePosition.split('_');
      challengeForPosition(S,nm,roleParts.join('_'));render();return;
    }
    if(t.dataset.killNpc){
      killNPC(S,t.dataset.killNpc);render();return;
    }

    // Auction next turn
    if(t.dataset.auctionNextTurn){auctionNextTurn(S);render();return;}

    // Territory contest (old data-contest attr)
    if(t.dataset.contest){
      contestTerritoryV5(S,t.dataset.contest);render();return;
    }

    // New territory enemies
    if(t.dataset.contestEnemy){
      const enemy=typeof TERRITORY_ENEMIES!=='undefined'?TERRITORY_ENEMIES.find(e=>e.key===t.dataset.contestEnemy):null;
      if(enemy){
        const yearsSince=S.year-(S.lastTerritoryAttack||0);
        if(yearsSince<TERRITORY_COOLDOWN_YRS){showToast(`Cooldown — wait ${TERRITORY_COOLDOWN_YRS-yearsSince} year(s)`,'bad');render();return;}
        S.lastTerritoryAttack=S.year;
        const myPow=typeof calcMilitaryPower==='function'?calcMilitaryPower(S):powerRating(S);
        const ratio=myPow/Math.max(enemy.basePower,1);
        const winPct=Math.min(92,Math.max(8,Math.round(50*Math.pow(ratio,0.6))));
        const casualtySoldiers=Math.min(S.soldiers||0,Math.round((S.soldiers||0)*Math.max(3,Math.round(100/(ratio+1)))/100));
        S.soldiers=Math.max(0,(S.soldiers||0)-casualtySoldiers);
        S.stats.body=clamp(S.stats.body-rand(1,3),0,100);
        if(Math.random()*100<winPct){
          S.territories[enemy.tier]++;
          if(enemy.reward.stones)S.res.stones+=enemy.reward.stones;
          if(enemy.reward.immortalJade)S.res.immortalJade+=enemy.reward.immortalJade;
          S.rankings.sect+=5;if(typeof updateDynastyTier==='function')updateDynastyTier(S);
          writeLog(S,`Territory Seized`,`${casualtySoldiers} soldiers lost. +1 ${enemy.tier} territory.`,'War','good');
          showToast(`⚔️ Victory! +1 territory · ${casualtySoldiers} soldiers lost`,'good',3500);
        } else {
          S.stats.instability=clamp(S.stats.instability+rand(3,8),0,100);
          writeLog(S,`Campaign Lost`,`${casualtySoldiers} soldiers lost. Retreat.`,'War','bad');
          showToast(`Lost · ${casualtySoldiers} soldiers lost · ${TERRITORY_COOLDOWN_YRS}yr cooldown`,'bad',3500);
        }
      }
      render();return;
    }

    // Military buildup
    if(t.dataset.militaryBuy){
      const m=t.dataset.militaryBuy;
      if(m==='soldiers'){if(S.res.stones>=100){S.res.stones-=100;S.soldiers+=50;writeLog(S,'Soldiers Recruited','+50 soldiers.','War','good');showToast('⚔️ +50 soldiers','good');}else showToast('Need 100💎','bad');}
      else if(m==='general'){if(S.res.stones>=300){S.res.stones-=300;S.generals++;writeLog(S,'General Hired','+1 general.','War','good');showToast('🌟 General hired!','good');}else showToast('Need 300💎','bad');}
      else if(m==='alliance'){if(S.res.silver>=200){S.res.silver-=200;S.soldiers+=100;writeLog(S,'Alliance','+100 soldiers.','War','good');showToast('🤝 +100 soldiers','good');}else showToast('Need 200🪙','bad');}
      render();return;
    }

    // Gamble
    if(t.dataset.gamble&&typeof resolveGamble!=='undefined'){resolveGamble(S,t.dataset.gamble);render();return;}
    if(t.dataset.gambleDice&&typeof resolveGamblingDice!=='undefined'){resolveGamblingDice(S,t.dataset.gambleDice);render();return;}
    if(t.dataset.selfAuction&&typeof resolveSelfAuction!=='undefined'){resolveSelfAuction(S,t.dataset.selfAuction);render();return;}
    if(t.dataset.exchange&&typeof resolveExchange!=='undefined'){resolveExchange(S,t.dataset.exchange);render();return;}
    if(t.dataset.sendDisciple!==undefined&&typeof sendDiscipleOut!=='undefined'){sendDiscipleOut(S,parseInt(t.dataset.sendDisciple));render();return;}
    if(t.dataset.pickSaveSlot!==undefined&&typeof handlePickSaveSlot!=='undefined'){handlePickSaveSlot(S,t.dataset.pickSaveSlot);render();return;}

    // Action
    const action=t.dataset.action;
    if(action){
      if(action==='advance-year'){
        if(S.settings.ageConfirm&&!confirm('Advance one year?'))return;
        advanceYear(S);
        if(typeof checkTutorial!=='undefined')checkTutorial(S);
        if(S.screen==='game'&&S.minorLevel>=9)showToast('🌟 Minor Level 9! Breakthrough ready.','warn',3000);
      }
      else if(action==='attempt-breakthrough'){
        if(!S.inv.manuals.length){showToast('📖 Acquire a cultivation manual first!','bad',3500);return;}
        attemptBreakthrough(S);
        if(S.overlay==='breakthrough')showToast(`⚡ Entered ${currentRealm(S).name}!`,'good',4000);
      }
      else if(action==='start-new-life')  {S=createState();S.adPhase='new_life';S.screen='ad';startAdCountdown();}
      else if(action==='start-random-life'){S=createState();if(typeof rollRandomLife!=='undefined')rollRandomLife(S);S.adPhase='new_life';S.screen='ad';startAdCountdown();}
      else if(action==='finish-ad')       {clearInterval(adInterval);S.screen='setup';if(!S._randomLife)S.selectedPhysique=rollPhysique();}
      else if(action==='claim-windfall')  {clearInterval(adInterval);claimWindfall(S);showToast('✨ Windfall claimed!','warn',3000);}
      else if(action==='activate-windfall'){activateWindfall(S);startAdCountdown();}
      else if(action==='open-profile')    {S.overlay='profile';}
      else if(action==='open-history')    {S.overlay='history';}
      else if(action==='close-overlay')   {S.overlay=null;S.overlayData=null;}
      else if(action==='close-breakthrough'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-subscreen') {S.subscreen=null;}
      else if(action==='close-auction')   {S.overlay=null;}
      else if(action==='noop')            {return;}
      else if(action==='open-save'||action==='open-save-title'){S.overlay='save';}
      else if(action==='commit-bid')      {commitBid(S);}
      else if(action==='open-crime')      {S.overlay='crime';}
      else if(action==='open-hatch')      {S.overlay='hatch';}
      else if(action==='open-jobmenu')    {S.overlay='jobmenu';}
      else if(action==='leave-sect')      {if(typeof leaveSect!=='undefined')leaveSect(S);else{S.sect.joined=false;S.sect.key=null;}}
      else if(action==='take-disciple')   {if(typeof addDisciple!=='undefined')addDisciple(S);}
      else if(action==='break-up')        {breakUpWithSpouse(S);}
      else if(action==='setup-gender-next'){S.setupStep=0;}
      else if(action==='setup-next'){
        if(S.setupStep===0&&S.selectedOrigin)         S.setupStep=1;
        else if(S.setupStep===1&&S.selectedTemperament)S.setupStep=2;
        else if(S.setupStep===2){if(S.selectedPath==='wanderer')startGame(S);else if(S.selectedPath==='sect')S.setupStep=3;}
        else if(S.setupStep===3&&S.selectedSect)       startGame(S);
      }
    }

    // Nav
    if(t.dataset.origin)       S.selectedOrigin=t.dataset.origin;
    if(t.dataset.temperament)  S.selectedTemperament=t.dataset.temperament;
    if(t.dataset.path)         S.selectedPath=t.dataset.path;
    if(t.dataset.sect)         S.selectedSect=t.dataset.sect;
    if(t.dataset.tab)          {S.activeTab=t.dataset.tab;S.subscreen=null;}
    if(t.dataset.open)         S.subscreen=t.dataset.open;
    if(t.dataset.selectAction) {S.selectedAction=t.dataset.selectAction;showToast(`Action: ${t.dataset.selectAction}`,'warn',1400);}

    // Purchases
    if(t.dataset.buyItem)     buyShopItem(S,t.dataset.buyItem);
    if(t.dataset.buyArtifact){
      const[key,price]=t.dataset.buyArtifact.split('_');
      if(!S.inv.artifacts.includes(key)&&S.res.stones>=parseInt(price)){
        S.res.stones-=parseInt(price);S.inv.artifacts.push(key);
        const a=byKey(ARTIFACTS,key);if(a)Object.entries(a.bonus).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.4),0,100);});
        writeLog(S,'Artifact Purchased',`${a?.name||key} secured.`,'Market','good');showToast(`💎 ${a?.name||key}!`,'good');
      }else showToast('Cannot purchase','bad');
    }
    if(t.dataset.launchBiz)   launchBusiness(S,t.dataset.launchBiz);
    if(t.dataset.buyProperty){
      const p=PROPERTIES.find(x=>x.key===t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const okJ=p.costJade&&S.res.immortalJade>=p.costJade;
        const okSt=p.costStones&&S.res.stones>=p.costStones;
        const okSi=p.costSilver&&S.res.silver>=p.costSilver;
        if(okJ){S.res.immortalJade-=p.costJade;S.inv.properties.push(p.key);writeLog(S,'Property',p.name,'Business','good');showToast(`🏠 ${p.name}!`,'good');}
        else if(okSt){S.res.stones-=p.costStones;S.inv.properties.push(p.key);writeLog(S,'Property',p.name,'Business','good');showToast(`🏠 ${p.name}!`,'good');}
        else if(okSi){S.res.silver-=p.costSilver;S.inv.properties.push(p.key);writeLog(S,'Property',p.name,'Business','good');showToast(`🏠 ${p.name}!`,'good');}
        else showToast('Insufficient funds','bad');
      }
    }
    if(t.dataset.travel){
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l&&l.stage>0&&S.realmIndex<l.stage*6)showToast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');
      else if(l){if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');showToast(`📍 ${l.name}`,'warn',2000);}S.locationKey=t.dataset.travel;}
    }
    if(t.dataset.startAuction) startAuction(S,t.dataset.startAuction);
    if(t.dataset.bidRaise){raiseBid(S,parseInt(t.dataset.bidRaise));if(S.auctionBidHistory)S.auctionBidHistory.push({who:'you',text:`You bid ${S.auction.playerBid}💎`});}
    if(t.dataset.hatch)        {hatchBeast(S,t.dataset.hatch);showToast(`🐉 ${byKey(BEASTS,t.dataset.hatch)?.name} bonded!`,'good',4000);S.overlay=null;}
    if(t.dataset.choose)       resolveYearChoice(S,t.dataset.choose);
    if(t.dataset.giftRel){
      if(S.res.stones>=10){S.res.stones-=10;const r=S.relations.find(x=>x.key===t.dataset.giftRel);if(r){r.bond=clamp(r.bond+8,-100,100);r.trust=clamp(r.trust+5,-100,100);r.giftCooldown=2;showToast(`🎁 Gift — Bond +8`,'good');}}else showToast('Need 10💎','bad');
    }
    if(t.dataset.propose){
      const r=S.relations.find(x=>x.key===t.dataset.propose);
      if(r&&r.bond>=40&&!S.family.spouse){S.family.spouse=r.name;S.metrics.marriages++;writeLog(S,'Proposal Accepted',`${r.name} accepted.`,'Bonds','good');showToast(`💍 ${r.name} accepted!`,'good',4000);S.overlay=null;}
      else showToast(r&&r.bond<40?'Bond not deep enough (need 40+)':'Already married','bad');
    }
    if(t.dataset.daoComp){
      const r=S.relations.find(x=>x.key===t.dataset.daoComp);
      if(r&&r.trust>=50&&!S.family.daoComp){S.family.daoComp=r.name;writeLog(S,'Dao Bond',`${r.name} bonded.`,'Bonds','good');showToast(`☯️ ${r.name} — Dao Bond!`,'good',4000);S.overlay=null;}
      else showToast('Need trust 50+','bad');
    }
    if(t.dataset.challenge){
      const r=S.relations.find(x=>x.key===t.dataset.challenge);
      if(r){if(Math.random()<0.5+S.stats.will*0.003){r.bond=clamp(r.bond-12,-100,100);S.stats.reputation=clamp(S.stats.reputation+9,0,100);writeLog(S,'Duel Victory','','Combat','good');showToast('⚔️ Won!','good');}else{S.stats.body=clamp(S.stats.body-5,0,100);S.stats.instability=clamp(S.stats.instability+8,0,100);writeLog(S,'Duel Loss','','Combat','bad');showToast('💔 Lost','bad');}S.overlay=null;}
    }
    if(t.dataset.talkRel){
      const r=S.relations.find(x=>x.key===t.dataset.talkRel);
      if(r){r.bond=clamp(r.bond+3,-100,100);r.trust=clamp(r.trust+2,-100,100);showToast(`💬 Bond +3`,'warn',2000);}S.overlay=null;
    }
    if(t.dataset.openRel)      {S.overlay='rel-detail';S.overlayData=t.dataset.openRel;}
    if(t.dataset.toggle)       {S.settings[t.dataset.toggle]=!S.settings[t.dataset.toggle];if(t.dataset.toggle==='autoSave')S.autoSaveSlot=S.settings.autoSave?0:-1;showToast(`${t.dataset.toggle}: ${S.settings[t.dataset.toggle]?'ON':'OFF'}`,'warn',1600);}
    if(t.dataset.saveSlot!==undefined) {if(saveGame(S,parseInt(t.dataset.saveSlot)))showToast(`💾 Saved to Slot ${parseInt(t.dataset.saveSlot)+1}`,'good');S.overlay=null;}
    if(t.dataset.loadSlot!==undefined) {const ld=loadGame(parseInt(t.dataset.loadSlot));if(ld){S=ld;S.overlay=null;showToast('📂 Life loaded','good');}else showToast('Failed to load','bad');}
    if(t.dataset.deleteSlot!==undefined){deleteSave(parseInt(t.dataset.deleteSlot));showToast('🗑 Deleted','bad',1600);}
    if(t.dataset.joinSect){
      const sec=byKey(SECTS,t.dataset.joinSect);
      if(sec&&!S.sect.joined&&S.realmIndex>=(sec.allowRealm||0)){
        S.sect.joined=true;S.sect.key=t.dataset.joinSect;S.sect.rankKey='layman';
        if(sec.stats)Object.entries(sec.stats).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.5),0,100);});
        const sm=MANUALS.find(m=>m.reqRealm===0&&!S.inv.manuals.includes(m.key));if(sm)S.inv.manuals.push(sm.key);
        // Add sect members to relations pool
        const members=getSectMembers(S);
        for(const m of members.slice(0,2)){
          if(!S.relations.find(r=>r.name===m.name)){
            S.relations.push({...m,key:'sect_'+m.name.replace(/\s/g,'_'),bond:10,trust:10,events:[],giftCooldown:0,realmIdx:m.realmIdx});
          }
        }
        writeLog(S,'Sect Joined',`Now a Layman Disciple of ${sec.name}.`,'Sect','good');showToast(`⛩ Joined ${sec.name}!`,'good',3500);
      }
    }
    if(t.dataset.setJob)       {S.currentJob=t.dataset.setJob;S.overlay=null;showToast(`💼 ${byKey(MORTAL_JOBS,t.dataset.setJob)?.name}`,'warn',2000);}
    if(t.dataset.sectAction){
      const sa=t.dataset.sectAction;

    }
    render();

  // Swipe back gesture
  const swipe=document.getElementById('swipe-catcher');
  if(swipe){

// ─── RENDER EDUCATION SCREEN ─────────────────────────────────
function renderEducation(s) {
  let h = renderHeaderBar('EDUCATION & LEARNING', 'close-subscreen', 'var(--azure2)');
  h += `<div class="screen-scroll">`;
  const learnedPct = Math.min(100, Math.round((s.learned||0)/1.5));
  h += `<div class="card" style="margin-top:8px">
    <div class="card-title">📚 Learned: ${s.learned||0}/150</div>
    <div class="learned-bar"><div class="learned-fill" style="width:${learnedPct}%"></div></div>
    <div class="card-sub" style="margin-top:6px">Learned stat unlocks higher occupations and improves comprehension. Study at an academy to increase it.</div>
  </div>`;
  h += sectionLabel('PLACES OF LEARNING');
  for(const edu of EDUCATION_PLACES) {
    const locked = (edu.reqLearned && (s.learned||0)<edu.reqLearned) ||
                   (edu.reqSect && !s.sect.joined) ||
                   (edu.reqRealm && s.realmIndex<edu.reqRealm);
    const cost = edu.costType==='silver' ? `${edu.cost}🪙` : edu.costType==='stones' ? `${edu.cost}💎` : `${edu.cost}✨`;
    const canAfford = edu.costType==='silver'? s.res.silver>=edu.cost : edu.costType==='stones'? s.res.stones>=edu.cost : s.res.immortalJade>=edu.cost;
    h += renderRow({icon:edu.icon, title:edu.name, sub:`${edu.desc} · +${edu.learned} Learned`, value:locked?'Locked':cost, cls:!locked&&canAfford?'good':!locked?'':'muted',
      action:!locked&&canAfford?`data-educate="${edu.key}"`:'data-buy-nope="1"'});
  }
  h += sectionLabel('JOB REQUIREMENTS');
  h += `<div class="notice">Some advanced occupations require a minimum Learned score: Noble Scion (30), Physician (20), Formation Setter (25), Alchemy Apprentice (15). Education unlocks these.</div>`;
  h += `</div>`;
  return h;
}

      h += `</div>`;
      return h;
    },
  };

  let mainContent = '';
  if(s.subscreen && subFn[s.subscreen]) {
    mainContent = subFn[s.subscreen](s);
  } else {
    mainContent = (tabFn[s.activeTab]||renderChronicleTab)(s);
  }

  const canBt = s.minorLevel>=9;
  // Always show advance button AND nav bar
  const bottomBar = `<div class="game-bottom">

    <nav class="footer-nav">

    </nav>
  </div>`;

  let fullHtml = `<div class="game-shell">
    <div class="game-main"><div style="height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch">${mainContent}</div></div>
    ${bottomBar}
  </div>`;

  // Overlays
  if(s.overlay==='profile')                      fullHtml += renderProfileOverlay(s);
  if(s.overlay==='history')                      fullHtml += renderHistoryOverlay(s);
  if(s.overlay==='breakthrough'&&s.overlayData)  fullHtml += renderBreakthroughOverlay(s,s.overlayData);
  if(s.overlay==='choice'&&s.overlayData)        fullHtml += renderChoiceOverlay(s,s.overlayData);
  if(s.overlay==='unique_event'&&s.overlayData)  fullHtml += renderUniqueEventOverlay(s);
  if(s.overlay==='auction')                      fullHtml += renderAuctionOverlay(s);
  if(s.overlay==='save')                         fullHtml += renderSaveOverlay(s);
  if(s.overlay==='jobmenu')                      fullHtml += renderJobMenuV6(s);
  if(s.overlay==='continue')                     fullHtml += renderContinueLifeOverlay();
  if(s.overlay==='hatch')                        fullHtml += `<div class="overlay"><div class="overlay-panel">${renderHatchScreen(s).replace('<div class="screen-scroll">','<div class="overlay-scroll">')}</div></div>`;
  if(s.overlay==='crime')                        fullHtml += `<div class="overlay"><div class="overlay-panel">${renderCrimeScreen(s).replace('<div class="screen-scroll">','<div class="overlay-scroll">')}</div></div>`;
  if(s.overlay==='rel-detail'&&s.overlayData)    fullHtml += renderRelDetailOverlay(s,s.overlayData);
  return fullHtml;
};

// ─── JOB MENU V6 — with learned requirements ─────────────────

    h+=`<div class="notice warn" style="margin:6px 12px">⚠️ Hunted by ${chn} — Cultivate past Realm ${s.sect.demonicChase.endRealm+1} to end pursuit.</div>`;
  }
  // Current year log — only THIS year's events
  const thisYearEntries = s.eventLog.filter(e=>e.year===s.year||e.year===s.year-1).slice(0,6);
  h += sectionLabel(`YEAR ${s.year} — AGE ${s.age}`);
  h += `<div class="yr-log-block">`;
  if(thisYearEntries.length===0) {
    h += `<div class="yr-log-line">Cultivation continues. The path stretches forward.</div>`;
  }
  for(const e of thisYearEntries) {
    const cls = e.tone==='good'?'good':e.tone==='bad'?'bad':'';
    h += `<div class="yr-log-line ${cls}">• ${e.title}${e.text?' — '+(e.text||'').substring(0,60):''}</div>`;
  }
  h += `</div>`;
  h += sectionLabel('CULTIVATION');
  h += renderRow({icon:'🧘',title:'Advance Year',sub:`Action: ${s.selectedAction} · Speed: ${cultivationSpeed(s)} qi/yr`,action:'data-action="advance-year"',value:'⏭'});
  h += renderRow({icon:'⚡',title:canBt?'Breakthrough Ready!':'Cultivating…',sub:`${profile.chance}% success · Stability ${profile.stability}% · Minor ${s.minorLevel}/9`,cls:canBt?'good':'muted',action:canBt?'data-action="attempt-breakthrough"':'',value:canBt?'BREAK!':s.minorLevel+'/9'});
  if(s.beast&&s.beast.pendingEgg) h += renderRow({icon:'🥚',title:'Beast Egg Ready!',sub:'Tap to hatch your companion',cls:'good',action:'data-action="open-hatch"',value:'HATCH'});
  else if(s.beast&&s.beast.activeKey) {
    const b=byKey(BEASTS,s.beast.activeKey);
    if(b) h += renderRow({icon:getBeastStageIcon?getBeastStageIcon(s):b.icon,title:b.name,sub:`${b.tier} · Loyalty ${s.beast.loyalty} · Score ${s.beast.score}`,action:'data-open="beast-detail"'});
  }
  h += sectionLabel('LINEAGE & POWER');
  h += renderRow({icon:'👨‍👩‍👦',title:'Relationships',sub:`Spouse: ${s.family.spouse||'None'} · Companion: ${s.family.daoComp||'None'} · Heirs: ${s.family.heirs}`,action:'data-open="relationships"'});
  h += renderRow({icon:'⚡',title:'Inventory & Power',sub:`${s.inv.artifacts.length} artifacts · ${s.inv.manuals.length} manuals · Power: ${fmt(powerRating(s))}`,action:'data-open="inventory"'});
  h += renderRow({icon:'🏦',title:'Enterprise',sub:`${s.businesses.length} business(es) · ${fmt(s.res.stones)}💎 ${fmt(s.res.silver)}🪙`,action:'data-open="business"'});
  h += sectionLabel('ACTIVITIES');
  h += renderRow({icon:'🎰',title:'Gambling Den',sub:'Boulder cutting · Dice games',action:'data-open="gambling"'});
  h += renderRow({icon:'⚗️',title:'Alchemy Tower',sub:'Refine pills from spirit herbs',action:'data-open="alchemy"'});
  h += renderRow({icon:'🔨',title:'Artifact Forge',sub:'Forge items from relic materials',action:'data-open="forge"'});
  h += renderRow({icon:'💹',title:'Currency Exchange',sub:'Copper → Silver → Stones → Jade',action:'data-open="currency-exchange"'});
  if(s.realmIndex>=4) h += renderRow({icon:'⚔️',title:'Territory Warfare',sub:`Military power: ${fmt(calcMilitaryPower(s))}`,action:'data-open="territory-wars"'});
  if(s.realmIndex>=10) h += renderRow({icon:'👑',title:'Immortal Systems',sub:'Jade, divine territory, celestial beasts',action:'data-open="immortal"',cls:'good'});
  if(s.stats.karma<-10||(s.metrics&&s.metrics.crimesDone>0)) h += renderRow({icon:'😈',title:'Dark Path',sub:'Criminal enterprises. Karma at stake.',action:'data-action="open-crime"',cls:'danger'});
  h += `</div>`;
  return h;
};

// ─── PATCH renderBondsTab — workplace link ───────────────────
const _v6rbt = renderBondsTab;
renderBondsTab = function(s) {

  for(const rel of (s.relations||[])) {
    const pool=RELATIONS_POOL.find(p=>p.key===rel.key);

    const isSpouse=s.family.spouse===rel.name;
    const isDaoComp=s.family.daoComp===rel.name;
    const npcPow = npcPowerRating(rel.realmIdx||0,0,0,false);
    h += `<div class="rel-card">
      <div class="rel-header">
        <div class="rel-portrait">${rel.icon}</div>
        <div class="rel-info">
          <div class="rel-name">${rel.name}${isSpouse?' 💍':''}${isDaoComp?' ☯️':''}
            <span class="npc-power-badge">⚡${fmt(npcPow)}</span>
          </div>
          <div class="rel-role">${rel.role}</div>
          <div class="rel-desire">"${rel.desire}"</div>
        </div>
        <div><span style="font-size:18px;font-weight:800;color:${isPos?'var(--jade2)':'var(--scarlet2)'}">${rel.bond>0?'+':''}${rel.bond}</span></div>
      </div>
      <div class="bond-bar"><div class="bond-fill ${isPos?'pos':'neg'}" style="width:${Math.abs(rel.bond)}%"></div></div>
      <div class="rel-actions">
        ${pool?.giftable&&!rel.giftCooldown?`<button class="rel-action-btn jade" data-gift-rel="${rel.key}">🎁 Gift (10💎)</button>`:''}
        ${pool?.romanceable&&!isSpouse&&!s.family.spouse&&rel.bond>=40?`<button class="rel-action-btn gold" data-propose="${rel.key}">💍 Propose</button>`:''}
        ${pool?.romanceable&&!isDaoComp&&!s.family.daoComp&&rel.trust>=50?`<button class="rel-action-btn gold" data-dao-comp="${rel.key}">☯️ Dao Bond</button>`:''}
        ${(rel.key==='rival'||rel.key==='dao_enemy')?`<button class="rel-action-btn scarlet" data-challenge="${rel.key}">⚔️ Challenge</button>`:''}
        <button class="rel-action-btn" data-talk-rel="${rel.key}">💬 Talk</button>
      </div>
    </div>`;
  }
  h += sectionLabel('HOUSE');
  h += renderRow({icon:'💍',title:s.family.spouse||'No Spouse',sub:'Marriage alliance',value:s.family.spouse?'Married':'—'});
  h += renderRow({icon:'☯️',title:s.family.daoComp||'No Dao Companion',sub:'+8% breakthrough when bonded',value:s.family.daoComp?'Bonded':'—'});
  h += renderRow({icon:'👶',title:`Heirs: ${s.family.heirs}`,sub:'Bloodline successors',value:s.family.clanTier});
  h += sectionLabel('WORKPLACE & SECT');
  h += renderRow({icon:'💼',title:'Workplace',sub:'Interact with coworkers and superiors',action:'data-open="workplace"'});
  if(s.sect.joined) h += renderRow({icon:'⛩',title:'Sect Members',sub:'Challenge, romance, dual cultivate',action:'data-open="sect-members"'});
  h += sectionLabel('DISCIPLES');
  s.realmIndex>=4&&s.sect.joined
    ? h+=renderRow({icon:'🎓',title:`${s.disciples||0} Disciples`,sub:'Manage and send out disciples',action:'data-open="disciple-hall"',value:'Manage'})
    : h+=notice('Reach Nascent Soul realm and join a sect to take disciples.');
  h += `</div>`;
  return h;
};

// ─── OVERRIDE bindEvents — comprehensive v6 ─────────────────
bindEvents = function() {
  const root = document.getElementById('root');
  if(!root) return;
  root.onclick = e => {
    const t = e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-buy-artifact],[data-buy-lux],[data-launch-biz],[data-buy-property],[data-travel],[data-contest-enemy],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose],[data-dao-comp],[data-challenge],[data-talk-rel],[data-toggle],[data-open-rel],[data-save-slot],[data-load-slot],[data-delete-slot],[data-join-sect],[data-set-job],[data-sect-action],[data-commit-crime],[data-refine-pill],[data-forge-item],[data-buy-beast-egg],[data-beast-action],[data-dynasty-action],[data-immortal-action],[data-seek-immortal-manual],[data-pick-save-slot],[data-send-disciple],[data-military-buy],[data-gamble],[data-gamble-dice],[data-self-auction],[data-exchange],[data-unique-choice],[data-npc-talk],[data-npc-romance],[data-npc-dao],[data-npc-confront],[data-challenge-position],[data-kill-npc],[data-dual-cult],[data-educate],[data-buy-nope],[data-set-gender]');
    if(!t) return;
    e.stopPropagation();

    // ── Gender selection ──
    if(t.dataset.setGender){S.gender=t.dataset.setGender;render();return;}

    // ── V6 new handlers ──
    if(t.dataset.pickSaveSlot!==undefined){handlePickSaveSlot(S,t.dataset.pickSaveSlot);render();return;}
    if(t.dataset.gamble)       {resolveGamble(S,t.dataset.gamble);render();return;}
    if(t.dataset.gambleDice)   {resolveGamblingDice(S,t.dataset.gambleDice);render();return;}
    if(t.dataset.selfAuction)  {resolveSelfAuction(S,t.dataset.selfAuction);render();return;}
    if(t.dataset.exchange)     {resolveExchange(S,t.dataset.exchange);render();return;}
    if(t.dataset.sendDisciple!==undefined){sendDiscipleOut(S,parseInt(t.dataset.sendDisciple));render();return;}
    if(t.dataset.militaryBuy){
      const m=t.dataset.militaryBuy;
      if(m==='soldiers'){if(S.res.stones>=100){S.res.stones-=100;S.soldiers+=50;showToast('⚔️ +50 soldiers','good');}else showToast('Need 100💎','bad');}
      else if(m==='general'){if(S.res.stones>=300){S.res.stones-=300;S.generals++;showToast('🌟 General hired!','good');}else showToast('Need 300💎','bad');}
      else if(m==='alliance'){if(S.res.silver>=200){S.res.silver-=200;S.soldiers+=100;showToast('🤝 Alliance: +100 soldiers','good');}else showToast('Need 200🪙','bad');}
      render();return;
    }
    if(t.dataset.contestEnemy){
      contestTerritoryV5(S, TERRITORY_ENEMIES.find(e=>e.key===t.dataset.contestEnemy)?.tier||'mortal');
      render();return;
    }
    if(t.dataset.uniqueChoice!==undefined){resolveUniqueEvent(S,parseInt(t.dataset.uniqueChoice));render();return;}
    if(t.dataset.npcTalk){
      const name=t.dataset.npcTalk;
      if(!S.npcInteractThisYear)S.npcInteractThisYear={};
      S.npcInteractThisYear[name]=(S.npcInteractThisYear[name]||0)+1;
      if(!S.sectMembers)S.sectMembers={};
      S.sectMembers[name]=clamp((S.sectMembers[name]||0)+3,-100,100);
      if(S.workplaceNPCs){const npc=S.workplaceNPCs.find(n=>n.name===name);if(npc)npc.bond=clamp(npc.bond+3,-100,100);}
      // Add to relations if not there
      if(!S.relations.find(r=>r.name===name)){
        const m=(getSectMembers(S)||[]).find(mm=>mm.name===name)||{icon:'🧑',role:'Acquaintance',desire:'Grow stronger.'};
        S.relations.push({key:'npc_'+name.replace(/\s/g,'_'),name,icon:m.icon||'🧑',bond:5,trust:3,role:m.role||'Acquaintance',desire:m.desire||'',giftCooldown:0,realmIdx:m.realmIdx||0});
      }
      showToast(`💬 Brief exchange with ${name}. Bond +3`,'warn',2000);
      render();return;
    }
    if(t.dataset.npcRomance){
      const name=t.dataset.npcRomance;
      if(!S.npcInteractThisYear)S.npcInteractThisYear={};
      S.npcInteractThisYear[name]=(S.npcInteractThisYear[name]||0)+1;
      if(!S.sectMembers)S.sectMembers={};
      S.sectMembers[name]=clamp((S.sectMembers[name]||0)+8,-100,100);
      showToast(`💕 Pursuing ${name}…`,'good',2500);
      render();return;
    }
    if(t.dataset.npcDao){
      const name=t.dataset.npcDao;
      const bond=(S.sectMembers&&S.sectMembers[name])||0;
      if(bond>=40&&!S.family.daoComp){S.family.daoComp=name;writeLog(S,'Dao Bond Forged',`${name} accepted the eternal bond.`,'Bonds','good');showToast(`☯️ ${name} — Dao Bond!`,'good',4000);}
      else showToast('Bond not deep enough (need 40+)','bad');
      render();return;
    }
    if(t.dataset.npcConfront){
      const name=t.dataset.npcConfront;
      if(!S.npcInteractThisYear)S.npcInteractThisYear={};
      S.npcInteractThisYear[name]=(S.npcInteractThisYear[name]||0)+1;
      if(Math.random()<0.55){S.stats.social=clamp(S.stats.social+4,0,100);showToast(`⚔️ Stood up to ${name}!`,'good');}
      else{showToast(`😬 ${name} humiliated you`,'bad');}
      render();return;
    }
    if(t.dataset.challengePosition){
      const[name,role]=t.dataset.challengePosition.split('|');
      challengeForPosition(S,name,role);
      render();return;
    }
    if(t.dataset.killNpc){killNPC(S,t.dataset.killNpc);render();return;}
    if(t.dataset.dualCult){
      const partner=t.dataset.dualCult;
      const bonus=3+Math.round((physique(S).cultivMult-0.8)*4);
      S.minorQi=(S.minorQi||0)+bonus;
      S.stats.purity=clamp(S.stats.purity+2,0,100);
      writeLog(S,'Dual Cultivation',`Harmonized qi with ${partner}. +${bonus} qi.`,'Cultivation','good');
      showToast(`☯️ Dual cultivation — Qi +${bonus}`,'good',3000);
      render();return;
    }
    if(t.dataset.educate){
      const edu=EDUCATION_PLACES.find(e=>e.key===t.dataset.educate);
      if(!edu)return;
      let canAfford=false;
      if(edu.costType==='silver'&&S.res.silver>=edu.cost){S.res.silver-=edu.cost;canAfford=true;}
      else if(edu.costType==='stones'&&S.res.stones>=edu.cost){S.res.stones-=edu.cost;canAfford=true;}
      else if(edu.costType==='jade'&&S.res.immortalJade>=edu.cost){S.res.immortalJade-=edu.cost;canAfford=true;}
      if(canAfford){
        S.learned=(S.learned||0)+edu.learned;
        S.stats.comprehension=clamp(S.stats.comprehension+3,0,100);
        writeLog(S,'Education Complete',`Studied at ${edu.name}. Learned +${edu.learned}.`,'Study','good');
        showToast(`📚 Learned +${edu.learned}! Comprehension +3`,'good',3000);
      } else showToast('Insufficient funds','bad');
      render();return;
    }

    // ── Continue life ──
    const action=t.dataset.action;
    if(action==='open-continue-life'){S.overlay='continue';render();return;}

    // ── Core action handlers ──
    if(action){
      if(action==='advance-year'){
        if(S.settings.ageConfirm&&!confirm('Advance one year?'))return;
        const handlers={cultivate:resolveCultivate,study:resolveStudy,sect_duty:resolveSectDuty,explore:resolveExplore,market:resolveMarket,romance:resolveRomance,beast:resolveBeast,business:resolveBusiness,job:resolveJob};
        if(S.screen==='game'&&S.overlay!=='choice'){
          handlers[S.selectedAction]?.(S);
          passiveEffects(S);updateRelations(S);triggerWandererEvent(S);maybeQueueEvent(S);
          S.year++;S.age++;
          S.npcInteractThisYear={};
          if(S.settings.autoSave&&S.autoSaveSlot>=0)saveGame(S,S.autoSaveSlot);
          const cap=lifespanCap(S);
          if(S.age>=cap||S.stats.instability>=95){
            writeLog(S,S.stats.instability>=95?'Qi Deviation':'Lifespan Exhausted','Your story ends here.','Legacy','bad');
            S.screen='dead';
            showToast('Your cultivation journey ends here.','bad',4000);
          }
          if(S.stats.instability>=80&&S.stats.instability<95)showToast(`⚠️ Instability critical: ${S.stats.instability}/100`,'bad');
          if(S.minorLevel>=9&&S.screen==='game')showToast('🌟 Minor Level 9! Breakthrough ready.','warn',3000);
        }
      }
      else if(action==='attempt-breakthrough'){attemptBreakthrough(S);}
      else if(action==='start-new-life'){S=createState();S.adPhase='new_life';S.screen='ad';startAdCountdown();}
      else if(action==='start-random-life'){S=createState();rollRandomLife(S);S.adPhase='new_life';S.screen='ad';startAdCountdown();}
      else if(action==='finish-ad'){clearInterval(adInterval);S.screen='setup';if(!S._randomLife)S.selectedPhysique=rollPhysique();}
      else if(action==='claim-windfall'){clearInterval(adInterval);claimWindfall(S);showToast('✨ Windfall claimed!','warn',3000);}
      else if(action==='activate-windfall'){activateWindfall(S);startAdCountdown();}
      else if(action==='open-profile'){S.overlay='profile';}
      else if(action==='open-history'){S.overlay='history';}
      else if(action==='close-overlay'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-breakthrough'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-subscreen'){S.subscreen=null;}
      else if(action==='close-auction'){S.overlay=null;}
      else if(action==='noop')return;
      else if(action==='setup-gender-next'){S.setupStep=0;}
      else if(action==='setup-next'){
        if(S.setupStep===0&&S.selectedOrigin)S.setupStep=1;
        else if(S.setupStep===1&&S.selectedTemperament)S.setupStep=2;
        else if(S.setupStep===2){if(S.selectedPath==='wanderer')startGame(S);else if(S.selectedPath==='sect')S.setupStep=3;}
        else if(S.setupStep===3&&S.selectedSect)startGame(S);
      }
      else if(action==='open-save'||action==='open-save-title'){S.overlay='save';}
      else if(action==='commit-bid'){commitBid(S);}
      else if(action==='open-crime'){S.overlay='crime';}
      else if(action==='open-hatch'){S.overlay='hatch';}
      else if(action==='open-jobmenu'){S.overlay='jobmenu';}
      else if(action==='leave-sect'){leaveSect(S);}
      else if(action==='take-disciple'){addDisciple(S);}
    }

    if(t.dataset.origin)      {S.selectedOrigin=t.dataset.origin;}
    if(t.dataset.temperament) {S.selectedTemperament=t.dataset.temperament;}
    if(t.dataset.path)        {S.selectedPath=t.dataset.path;}
    if(t.dataset.sect)        {S.selectedSect=t.dataset.sect;}
    if(t.dataset.tab)         {S.activeTab=t.dataset.tab;S.subscreen=null;}
    if(t.dataset.open)        {S.subscreen=t.dataset.open;}
    if(t.dataset.selectAction){S.selectedAction=t.dataset.selectAction;showToast(`Action: ${t.dataset.selectAction}`,'warn',1400);}

    if(t.dataset.buyItem)     {buyShopItem(S,t.dataset.buyItem);}
    if(t.dataset.buyNope)     {showToast('Not enough resources','bad',1800);}
    if(t.dataset.buyLux){
      const it=typeof LUXURY_ITEMS!=='undefined'?LUXURY_ITEMS.find(x=>x.key===t.dataset.buyLux):null;
      if(it&&S.res.stones>=it.costStones){
        S.res.stones-=it.costStones;const eff=it.effect||{};
        if(eff.statBoost)for(const[k,v]of Object.entries(eff.statBoost)){if(k in S.stats)S.stats[k]=clamp(S.stats[k]+v,0,100);}
        if(eff.successBoost)S.inv.consumables.successBoost=(S.inv.consumables.successBoost||0)+eff.successBoost;
        writeLog(S,'Luxury Purchase',`${it.name} acquired.`,'Market','good');showToast(`🏷 ${it.name}`,'good',3500);
      }else showToast('Cannot purchase','bad');
    }
    if(t.dataset.buyArtifact){
      const[key,price]=t.dataset.buyArtifact.split('_');
      if(!S.inv.artifacts.includes(key)&&S.res.stones>=parseInt(price)){
        S.res.stones-=parseInt(price);S.inv.artifacts.push(key);
        const a=byKey(ARTIFACTS,key);if(a)Object.entries(a.bonus).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.4),0,100);});
        showToast(`💎 ${a?.name||key} purchased!`,'good');
      }else showToast('Cannot purchase','bad');
    }
    if(t.dataset.launchBiz)   {launchBusiness(S,t.dataset.launchBiz);}
    if(t.dataset.buyProperty){
      const p=PROPERTIES.find(x=>x.key===t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const okJ=p.costJade&&S.res.immortalJade>=p.costJade;
        const okSt=p.costStones&&S.res.stones>=p.costStones;
        const okSi=p.costSilver&&S.res.silver>=p.costSilver;
        if(okJ){S.res.immortalJade-=p.costJade;S.inv.properties.push(p.key);showToast(`🏠 ${p.name}!`,'good');}
        else if(okSt){S.res.stones-=p.costStones;S.inv.properties.push(p.key);showToast(`🏠 ${p.name}!`,'good');}
        else if(okSi){S.res.silver-=p.costSilver;S.inv.properties.push(p.key);showToast(`🏠 ${p.name}!`,'good');}
        else showToast('Insufficient funds','bad');
      }
    }
    if(t.dataset.travel){
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l&&l.stage>0&&S.realmIndex<l.stage*6)showToast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');
      else if(l){if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');showToast(`📍 ${l.name}`,'warn',2000);}S.locationKey=t.dataset.travel;}
    }
    if(t.dataset.startAuction){startAuction(S,t.dataset.startAuction);}
    if(t.dataset.bidRaise)    {raiseBid(S,parseInt(t.dataset.bidRaise));}
    if(t.dataset.hatch)       {hatchBeast(S,t.dataset.hatch);showToast(`🐉 ${byKey(BEASTS,t.dataset.hatch)?.name} bonded!`,'good',4000);S.overlay=null;}
    if(t.dataset.choose)      {resolveYearChoice(S,t.dataset.choose);}
    if(t.dataset.giftRel){
      if(S.res.stones>=10){S.res.stones-=10;const r=S.relations.find(x=>x.key===t.dataset.giftRel);if(r){r.bond=clamp(r.bond+8,-100,100);r.trust=clamp(r.trust+5,-100,100);r.giftCooldown=2;showToast(`🎁 Gift — Bond +8`,'good');}
      }else showToast('Need 10💎','bad');
    }
    if(t.dataset.propose){
      const r=S.relations.find(x=>x.key===t.dataset.propose);
      if(r&&r.bond>=40&&!S.family.spouse){S.family.spouse=r.name;S.metrics.marriages++;writeLog(S,'Proposal Accepted',`${r.name} accepted.`,'Bonds','good');showToast(`💍 ${r.name} accepted!`,'good',4000);S.overlay=null;}
      else showToast('Bond not deep enough (need 40+)','bad');
    }
    if(t.dataset.daoComp){
      const r=S.relations.find(x=>x.key===t.dataset.daoComp);
      if(r&&r.trust>=50&&!S.family.daoComp){S.family.daoComp=r.name;writeLog(S,'Dao Bond Forged',`${r.name} accepted.`,'Bonds','good');showToast(`☯️ ${r.name} — Dao Bond!`,'good',4000);S.overlay=null;}
      else showToast('Need trust 50+ for Dao Bond','bad');

// Auto-restore last session if save exists
(function autoRestore() {
  try {
    const saves = getSaveSlots();
    const lastIdx = saves.reduce((best, sv, i) => {
      if (!sv) return best;
      const prev = best >= 0 ? saves[best] : null;
      return (!prev || (sv._savedAt || 0) > (prev._savedAt || 0)) ? i : best;
    }, -1);
    if (lastIdx >= 0 && saves[lastIdx]) {
      S = saves[lastIdx];
      S.overlay = null;
      S.subscreen = null;
      // Show title so player can choose to continue, but flag it
      S._hasAutoRestore = true;
      S._autoRestoreSlot = lastIdx;
      S.screen = 'title';
    }
  } catch(e) {}
})();
render();

// ─── TOAST SYSTEM (replaces old one, suppresses action-set toasts) ─
let _toastEl = null, _toastTimer = null, _toastQ = [];

showToast = function(msg, type='good', dur=2200) {
  // Suppress spammy notifications about actions being set
  if (/^Action( set)?:/i.test(msg)) return;
  _toastQ.push({msg, type, dur});
  if (!_toastEl) _nextToast();
};

function _nextToast() {
  if (!_toastQ.length) return;
  const {msg, type, dur} = _toastQ.shift();
  if (_toastEl) { _toastEl.remove(); _toastEl = null; }
  clearTimeout(_toastTimer);
  const el = document.createElement('div');
  el.className = `dao-toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  _toastEl = el;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  _toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { if (_toastEl === el) { el.remove(); _toastEl = null; } _nextToast(); }, 230);
  }, dur);
}

// ─── PATCH calcMilitaryPower to use tiered soldiers ───────────
const _origCMP = calcMilitaryPower;
calcMilitaryPower = function(s) {
  let p = powerRating(s);
  if (s.soldierTiers) {
    p += (s.soldierTiers.militia  || 0) * 50;
    p += (s.soldierTiers.veteran  || 0) * 150;
    p += (s.soldierTiers.elite    || 0) * 400;
    p += (s.soldierTiers.immortal || 0) * 1200;
  } else {
    p += (s.soldiers || 0) * 50;
  }
  p += (s.generals  || 0) * 400;
  p += (s.disciples || 0) * 120;
  if (s.elderMaster) p += 500;
  if (s.beast && s.beast.activeKey) {

    if (b) p += b.cultivBonus * 180;
  }

// ─── TERRITORY CASUALTIES (proportional to territory held) ───
function contestTerritoryV7(s, tier) {
  const REQ = { mortal:4, spiritual:6, immortal:10 };
  if (s.realmIndex < REQ[tier]) {
    showToast(`Need Realm ${REQ[tier]+1}+ for ${tier} territory`, 'bad'); return;
  }
  const cooldown = 3;
  if ((s.year - (s.lastTerritoryAttack||0)) < cooldown) {
    showToast(`Forces recovering — wait ${cooldown - (s.year - (s.lastTerritoryAttack||0))} more year(s)`, 'bad'); return;
  }
  s.lastTerritoryAttack = s.year;
  const myPow = calcMilitaryPower(s);
  const enemy = (typeof TERRITORY_ENEMIES !== 'undefined' ? TERRITORY_ENEMIES : []).find(e=>e.tier===tier);
  if (!enemy) { showToast('No enemies in this region yet', 'warn'); return; }
  const ratio = myPow / Math.max(enemy.basePower, 1);
  const winPct = Math.min(92, Math.max(8, Math.round(50 * Math.pow(ratio, 0.6))));
  // Scale casualties with territories held
  const held = (s.territories.mortal||0) + (s.territories.spiritual||0)*2 + (s.territories.immortal||0)*4;
  const casualtyScale = Math.max(1, 1 + held * 0.05);
  const baseCas = Math.max(3, Math.round(100/(ratio+1)));
  const actualCas = Math.min(40, Math.round(baseCas * casualtyScale));
  // Apply to tiered soldiers (weakest first)
  let lost = 0;
  if (s.soldierTiers) {
    const total = Object.values(s.soldierTiers).reduce((a,b)=>a+b,0);
    let pool = Math.round(total * actualCas / 100);
    lost = pool;
    for (const tk of ['militia','veteran','elite','immortal']) {
      const l = Math.min(s.soldierTiers[tk]||0, pool);
      s.soldierTiers[tk] = (s.soldierTiers[tk]||0) - l;
      pool -= l;
      if (pool <= 0) break;
    }
  }
  s.stats.body = Math.max(0, s.stats.body - Math.floor(Math.random()*3+1));
  if (Math.random()*100 < winPct) {
    s.territories[tier] = (s.territories[tier]||0) + 1;
    if (enemy.reward?.stones) s.res.stones += enemy.reward.stones;
    if (enemy.reward?.immortalJade) s.res.immortalJade += (enemy.reward.immortalJade||0);
    writeLog(s,'Territory Seized',`Victory! ${lost} troops lost (${actualCas}% casualties). +1 ${tier} territory.`,'War','good');
    showToast(`⚔️ Victory! +1 territory · ${lost} casualties (${actualCas}%)`, 'good', 3500);
  } else {
    s.stats.instability = Math.min(100, s.stats.instability + Math.floor(Math.random()*6+3));
    writeLog(s,'Campaign Lost',`${lost} soldiers lost (${actualCas}%). Ordered retreat.`,'War','bad');
    showToast(`Defeated — ${lost} casualties · ${cooldown}yr cooldown`, 'bad', 3500);
  }
}

    h += renderRow({icon:'⛓️',title:'Upgrade Beast Chain',sub:'70💎 → +3 cultivation bonus',action:'data-beast-action="upgrade-chain"',value:'70💎'});
    h += renderRow({icon:'🔓',title:'Release the Beast',sub:'Set your companion free. Cannot be undone.',action:'data-beast-action="release"',cls:'danger',value:'Release'});
    h += renderRow({icon:'☠️',title:'Absorb Beast Core',sub:'Sacrifice for +50 qi +5 comprehension. Karma hit.',action:'data-beast-action="sacrifice"',cls:'danger',value:'Sacrifice'});
    return h + `</div>`;
  }
  if (s.beastEggs && s.beastEggs.length > 0) {
    h += `<div class="section-label">EGGS IN INVENTORY</div>`;
    s.beastEggs.forEach((egg, i) => {
      const b = byKey(BEASTS, egg.key);
      if (b) h += renderRow({icon:'🥚',title:`${b.name} Egg`,sub:`${b.tier} — Tap to hatch`,action:`data-hatch-inv="${i}"`,value:'Hatch',cls:'good'});
    });
    h += notice('Only one active beast companion at a time.');
    return h + `</div>`;
  }
  if (s.beast.pendingEgg) {
    h += notice('🥚 You have a beast egg! Choose its bloodline below.', 'success');
    h += `<div class="section-label">CHOOSE BLOODLINE</div>`;
    const choices = (s.beast.joinEggChoices || BEASTS.filter(b=>b.reqRealm<=1).map(b=>b.key).slice(0,3));
    for (const k of choices) {
      const b = byKey(BEASTS, k);
      if (!b) continue;
      const bonStr = Object.entries(b.bonus).map(([k2,v])=>`+${v} ${k2}`).join(', ');
      h += renderRow({icon:b.icon,title:b.name,sub:`${b.tier} · ${bonStr} · Cultiv +${b.cultivBonus}/yr`,value:'Choose',cls:'good',action:`data-hatch="${b.key}"`});
    }
    return h + `</div>`;
  }
  h += notice('No beast companion yet. Win one at auction, explore ruins, or join a sect for a starter egg.');
  h += `<div class="section-label">PURCHASE BEAST EGGS</div>`;
  for (const b of BEASTS.filter(b2 => s.realmIndex >= b2.reqRealm).slice(0,5)) {
    const bonStr = Object.entries(b.bonus).map(([k,v])=>`+${v} ${k}`).join(', ');
    const price = 80 + b.reqRealm * 60;
    const ok = s.res.stones >= price && !s.beast.activeKey && !s.beast.pendingEgg;
    h += renderRow({icon:b.icon,title:`${b.name} Egg`,sub:`${b.tier} · ${bonStr}`,value:`${price}💎`,cls:ok?'good':'muted',action:ok?`data-buy-beast-egg="${b.key}_${price}"`:''});
  }
  h += `</div>`;
  return h;
}

// ─── RENDER: TERRITORY WAR V7 (tiered soldiers, casualty info) ─
function renderTerritoryWarV7(s) {
  const myPow = calcMilitaryPower(s);
  const held = (s.territories.mortal||0) + (s.territories.spiritual||0)*2 + (s.territories.immortal||0)*4;
  let h = renderHeaderBar('TERRITORY WARFARE', 'close-subscreen', '#cc3344');
  h += `<div class="screen-scroll">`;
  h += `<div class="card" style="margin-top:8px"><div class="card-title">⚡ Military Power: ${typeof fmt==='function'?fmt(myPow):myPow}</div>
    <div class="card-sub">Your cultivation + Tiered soldiers + Generals + Beast bonus + Elder master</div></div>`;
  if (held > 0) {
    const mult = Math.round((1 + held*0.05)*100) - 100;
    h += `<div class="notice warn" style="margin:4px 12px">⚠️ ${held} territory weight held — casualties are ${mult}% higher in future battles.</div>`;
  }
  const TREQ = {mortal:4,spiritual:6,immortal:10};
  for (const tier of ['mortal','spiritual','immortal']) {
    h += `<div class="section-label">${tier.toUpperCase()} TERRITORIES (${s.territories[tier]||0} held)</div>`;
    if (s.realmIndex < TREQ[tier]) {
      h += `<div class="notice warn">Requires Realm ${TREQ[tier]+1}+</div>`; continue;
    }
    const enemies = (typeof TERRITORY_ENEMIES !== 'undefined' ? TERRITORY_ENEMIES : []).filter(e=>e.tier===tier);
    for (const en of enemies) {
      const ratio = myPow / Math.max(en.basePower||1000, 1);
      const pct = Math.min(92, Math.max(8, Math.round(50*Math.pow(ratio,0.6))));
      const rew = en.reward?.immortalJade ? `${en.reward.immortalJade}✨` : `${en.reward?.stones||0}💎`;
      h += renderRow({icon:'⚔️',title:en.name,sub:`Enemy: ${typeof fmt==='function'?fmt(en.basePower):en.basePower} · Win: ${pct}% · Reward: ${rew}`,value:`${pct}%`,cls:pct>=65?'good':pct>=40?'warn':'danger',action:`data-contest-v7="${en.key}_${tier}"`});
    }
  }
  h += `<div class="section-label">SOLDIER ROSTER</div>`;
  h += `<div class="stat-grid" style="margin:4px 12px">`;
  for (const t of SOLDIER_TIERS_V7) {
    h += `<div class="stat-cell"><div class="stat-val">${(s.soldierTiers||{})[t.key]||0}</div><div class="stat-key">${t.icon} ${t.name}</div><div style="font-size:8px;color:var(--text3,#555)">⚡${t.power} each</div></div>`;
  }
  h += `</div>`;
  h += `<div class="section-label">RECRUIT</div>`;
  for (const t of SOLDIER_TIERS_V7) {
    const locked = s.realmIndex < t.reqRealm;
    const res = t.type==='silver'?s.res.silver:t.type==='stones'?s.res.stones:s.res.immortalJade;
    const ok = !locked && res >= t.cost;
    const costStr = t.type==='silver'?`${t.cost}🪙`:t.type==='stones'?`${t.cost}💎`:`${t.cost}✨`;
    h += renderRow({icon:t.icon,title:`Recruit ${t.name}`,sub:`+10 ${t.name} · ${costStr}/batch · Power +${t.power*10}`,value:locked?`R${t.reqRealm+1}+`:costStr,cls:ok?'good':'muted',action:ok?`data-recruit-v7="${t.key}"`:''});
  }
  h += renderRow({icon:'🌟',title:'Hire General',sub:'300💎 → +1 general (power +400)',value:'300💎',action:'data-military-buy="general"'});
  h += `</div>`;
  return h;
}

      '[data-sect],' +
      '[data-buy-nope]'
    );
    if (!t) return;
    e.stopPropagation();

    // ── V7 NEW HANDLERS ──

    if (t.dataset.selectMaster) {
      const elder = ELDER_MASTERS_V7.find(e2 => e2.key === t.dataset.selectMaster);
      if (elder && S.sect.joined) {
        S.elderMaster = elder;
        const b = elder.bonus;

    }

    if (t.dataset.recruitV7) {

      if (td) {
        const res = td.type==='silver'?S.res.silver:td.type==='stones'?S.res.stones:S.res.immortalJade;

          if (td.type==='silver')  S.res.silver       -= td.cost;
          else if (td.type==='stones') S.res.stones    -= td.cost;
          else                     S.res.immortalJade  -= td.cost;

          showToast(`${td.icon} +10 ${td.name}!`, 'good');
        } else showToast('Insufficient resources', 'bad');
      }
      render(); return;
    }

    if (t.dataset.contestV7) {
      const [eKey, tier] = t.dataset.contestV7.split('_');
      contestTerritoryV7(S, tier);
      render(); return;
