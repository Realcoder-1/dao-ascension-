<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Dao Ascension</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #080810;
  --surface: #0f0f1a;
  --surface2: #161625;
  --surface3: #1e1e32;
  --surface4: #26263e;
  --border: #232338;
  --border2: #323254;
  --text: #ede8dc;
  --text2: #a09888;
  --text3: #6a6480;
  --text4: #3e3a52;
  --gold: #c8a040;
  --gold2: #f0c060;
  --gold3: #fde080;
  --jade: #3a9a7a;
  --jade2: #50c89a;
  --jade3: #70e8ba;
  --scarlet: #a02840;
  --scarlet2: #d04060;
  --azure: #2850a0;
  --azure2: #4878d0;
  --indigo: #4030a0;
  --indigo2: #6858d8;
  --qi-color: #5080ff;
  --qi-glow: rgba(80,128,255,0.35);
  --font-main: 'Georgia', 'Times New Roman', serif;
  --font-ui: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono: 'Courier New', monospace;
  --radius: 8px;
  --radius2: 14px;
  --radius3: 20px;
}
/* ============================================================
   RESET & BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
button{font-family:inherit;cursor:pointer;}
#root{height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:430px;margin:0 auto;position:relative;background:var(--bg);}

/* ============================================================
   SCROLLABLE AREAS
   ============================================================ */
.screen-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:100px;}
.screen-scroll::-webkit-scrollbar{width:2px;}
.screen-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.overlay-scroll{overflow-y:auto;flex:1;padding-bottom:24px;}
.overlay-scroll::-webkit-scrollbar{width:2px;}
.overlay-scroll::-webkit-scrollbar-thumb{background:var(--border2);}

/* ============================================================
   TOP STRIP
   ============================================================ */
.top-strip{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:10;}
.cultivator-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--surface4),var(--surface3));border:2px solid var(--gold);cursor:pointer;position:relative;overflow:visible;flex-shrink:0;}
.avatar-inner{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
.aura-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;pointer-events:none;animation:aura-pulse 2.4s ease-in-out infinite;}
@keyframes aura-pulse{0%,100%{border-color:transparent;box-shadow:none;}50%{border-color:var(--qi-color);box-shadow:0 0 10px var(--qi-glow),0 0 20px var(--qi-glow);}}
.avatar-char{font-size:26px;position:relative;z-index:1;}
.avatar-char.cultivating{animation:meditate 2s ease-in-out infinite;}
@keyframes meditate{0%,100%{transform:scale(1)translateY(0);}50%{transform:scale(1.06)translateY(-2px);}}
.qi-orbs{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;}
.qi-orb{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--qi-color);opacity:0;}
.qi-orb.active{animation:qi-orbit var(--dur,2.5s) linear infinite;opacity:0.8;}
@keyframes qi-orbit{from{transform:rotate(var(--start,0deg))translateX(28px);}to{transform:rotate(calc(var(--start,0deg)+360deg))translateX(28px);}}
.profile-info{flex:1;min-width:0;}
.profile-name{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-main);}
.profile-sub{font-size:11px;color:var(--text2);margin-top:1px;}
.resources-strip{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.res-item{display:flex;align-items:center;gap:3px;font-size:11px;}
.res-val{font-weight:700;color:var(--gold);font-family:var(--font-mono);}
.res-lbl{color:var(--text3);font-size:10px;}

/* ============================================================
   QI BAR
   ============================================================ */
.qi-bar-wrap{background:var(--surface);padding:5px 12px 7px;border-bottom:1px solid var(--border);flex-shrink:0;}
.qi-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:3px;font-family:var(--font-mono);}
.qi-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;position:relative;}
.qi-fill{height:100%;border-radius:3px;transition:width 0.5s cubic-bezier(.4,0,.2,1);position:relative;}
.qi-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25));border-radius:0 3px 3px 0;}
.minor-pips{display:flex;gap:2px;margin-top:3px;}
.minor-pip{flex:1;height:2px;border-radius:1px;background:var(--surface4);transition:background 0.3s;}
.minor-pip.filled{background:var(--qi-color);box-shadow:0 0 4px var(--qi-glow);}
.minor-pip.current{background:var(--gold);}

/* ============================================================
   SECTION LABELS
   ============================================================ */
.section-label{padding:14px 14px 6px;font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);}

/* ============================================================
   LIST ROWS
   ============================================================ */
.list-row{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:transparent;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;color:var(--text);transition:background 0.12s;}
.list-row:active{background:var(--surface2);}
.list-row.selected{background:rgba(80,128,255,0.07);border-left:2px solid var(--qi-color);padding-left:12px;}
.list-row.selected-gold{background:rgba(200,160,64,0.07);border-left:2px solid var(--gold);padding-left:12px;}
.list-row.muted{opacity:0.55;}
.list-row.danger{border-left:2px solid var(--scarlet);padding-left:12px;}
.list-row.good{border-left:2px solid var(--jade);padding-left:12px;}
.list-row.warn{border-left:2px solid var(--gold);padding-left:12px;}
.row-icon{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--border);}
.row-text{flex:1;min-width:0;}
.row-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.row-sub{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.35;}
.row-value{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;margin-left:6px;font-family:var(--font-mono);}
.row-arr{color:var(--text3);font-size:14px;flex-shrink:0;}

/* ============================================================
   BOTTOM BAR
   ============================================================ */
.bottom-bar{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.advance-btn{width:100%;padding:13px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--surface3),var(--surface2));border:1px solid var(--border2);border-bottom:none;color:var(--text);cursor:pointer;letter-spacing:0.5px;transition:all 0.15s;font-family:var(--font-ui);}
.advance-btn:active{background:var(--surface3);}
.advance-btn.bt-ready{background:linear-gradient(135deg,#1a3828,#122018);border-color:var(--jade2);color:var(--jade2);animation:btn-pulse 1.4s ease-in-out infinite;}
@keyframes btn-pulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 16px rgba(80,200,154,0.25);}}
.footer-nav{display:flex;border-top:1px solid var(--border);}
.footer-btn{flex:1;padding:7px 2px 5px;background:transparent;border:none;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;transition:color 0.12s;}
.footer-btn.active{color:var(--gold);}
.footer-btn .ico{font-size:18px;line-height:1;}

/* ============================================================
   HEADER BAR
   ============================================================ */
.header-bar{display:flex;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.hdr-back{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hdr-title{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);}
.hdr-right{width:34px;display:flex;justify-content:flex-end;}
.hdr-action{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--gold);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* ============================================================
   OVERLAYS
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;max-width:430px;left:50%;transform:translateX(-50%);}
.overlay-panel{background:var(--surface);border-radius:var(--radius2) var(--radius2) 0 0;width:100%;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;animation:slide-up 0.22s cubic-bezier(.2,.8,.4,1);}
@keyframes slide-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.overlay-btn{padding:14px;text-align:center;font-size:14px;font-weight:700;background:var(--surface2);border:none;border-top:1px solid var(--border);color:var(--text);cursor:pointer;width:100%;flex-shrink:0;}
.overlay-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;}
.overlay-btn.danger{color:var(--scarlet2);background:rgba(160,40,64,0.1);}

/* ============================================================
   CARDS
   ============================================================ */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);margin:6px 12px;padding:12px;}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;font-family:var(--font-main);}
.card-sub{font-size:11px;color:var(--text2);line-height:1.55;}
.card.good{border-color:rgba(80,200,154,0.3);background:rgba(58,154,122,0.06);}
.card.warn{border-color:rgba(200,160,64,0.3);background:rgba(200,160,64,0.05);}
.card.danger{border-color:rgba(160,40,64,0.3);background:rgba(160,40,64,0.06);}

/* ============================================================
   STAT GRID
   ============================================================ */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 12px;}
.stat-cell{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 6px;text-align:center;}
.stat-val{font-size:17px;font-weight:800;color:var(--text);font-family:var(--font-mono);}
.stat-key{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;}

/* ============================================================
   PILLS
   ============================================================ */
.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.pill.inferior{background:rgba(100,90,80,0.2);color:#887870;}
.pill.common{background:rgba(160,152,136,0.18);color:var(--text2);}
.pill.rare{background:rgba(80,128,255,0.18);color:#8ab0ff;}
.pill.legendary{background:rgba(192,160,64,0.18);color:var(--gold2);}
.pill.mythic{background:rgba(180,80,255,0.18);color:#c880ff;}

/* ============================================================
   REALM BADGE
   ============================================================ */
.realm-badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface3);border:1px solid var(--border2);border-radius:16px;padding:3px 10px 3px 5px;font-size:11px;}
.realm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ============================================================
   NOTICES
   ============================================================ */
.notice{padding:9px 12px;background:rgba(80,128,255,0.07);border:1px solid rgba(80,128,255,0.18);border-radius:var(--radius);margin:6px 12px;font-size:11px;color:var(--text2);line-height:1.5;}
.notice.warn{background:rgba(200,160,64,0.07);border-color:rgba(200,160,64,0.25);color:#d4a84a;}
.notice.danger{background:rgba(160,40,64,0.08);border-color:rgba(160,40,64,0.25);color:var(--scarlet2);}
.notice.success{background:rgba(58,154,122,0.08);border-color:rgba(58,154,122,0.25);color:var(--jade2);}

/* ============================================================
   BREAKTHROUGH SCREEN
   ============================================================ */
.bt-flash{position:fixed;inset:0;pointer-events:none;animation:bt-flare 1s ease-out forwards;max-width:430px;left:50%;transform:translateX(-50%);}
@keyframes bt-flare{0%{opacity:0;background:radial-gradient(ellipse at 50% 40%,rgba(80,128,255,0.6),transparent 65%);}30%{opacity:1;}100%{opacity:0;}}
.bt-realm-icon{font-size:56px;text-align:center;padding:20px 0 8px;animation:bt-icon-pop 0.5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes bt-icon-pop{from{transform:scale(0.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.bt-title{text-align:center;font-size:22px;font-weight:800;color:var(--gold2);text-shadow:0 0 24px rgba(240,192,96,0.5);letter-spacing:3px;font-family:var(--font-main);}
.bt-realm{text-align:center;font-size:15px;padding:4px 0 12px;font-weight:600;}

/* ============================================================
   AUCTION UI
   ============================================================ */
.auction-item-card{margin:10px 12px;padding:14px;background:linear-gradient(135deg,rgba(200,160,64,0.08),rgba(200,160,64,0.02));border:1px solid rgba(200,160,64,0.3);border-radius:var(--radius2);}
.bid-row{display:flex;gap:6px;margin-top:8px;}
.bid-inc{flex:1;padding:10px 4px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.12s;}
.bid-inc:active{background:var(--border2);}
.bid-commit{width:100%;padding:13px;margin-top:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:var(--radius);color:#000;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:0.5px;}
.bid-commit:disabled{opacity:0.35;cursor:not-allowed;background:var(--surface3);color:var(--text3);}
.bid-status{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.bid-mine{font-size:20px;font-weight:800;color:var(--gold2);font-family:var(--font-mono);}
.bid-opp{font-size:15px;font-weight:700;color:var(--scarlet2);font-family:var(--font-mono);}
.bid-msg{font-size:11px;color:var(--text2);min-height:16px;margin-top:4px;font-style:italic;}

/* ============================================================
   SETUP SCREEN
   ============================================================ */
.setup-wrap{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 15%,rgba(80,60,160,0.25),transparent 55%),var(--bg);overflow:hidden;}
.splash{padding:28px 20px 14px;text-align:center;flex-shrink:0;}
.splash-logo{font-family:var(--font-main);font-size:30px;font-weight:700;color:var(--gold2);letter-spacing:5px;text-shadow:0 0 30px rgba(240,192,96,0.4),0 2px 0 rgba(0,0,0,0.5);margin-bottom:4px;}
.splash-sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}
.setup-scroll{flex:1;overflow-y:auto;padding-bottom:100px;}
.setup-cta{position:sticky;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,var(--bg) 30%);flex-shrink:0;}
.cta-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:var(--radius2);color:#000;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;font-family:var(--font-ui);}
.cta-btn:disabled{opacity:0.35;cursor:not-allowed;background:var(--surface3);color:var(--text3);}
.cta-btn.secondary{background:linear-gradient(135deg,var(--azure),var(--azure2));color:var(--text);}
.physique-reveal-wrap{padding:16px 12px;text-align:center;}
.physique-big-icon{font-size:64px;margin-bottom:12px;animation:phy-pop 0.6s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes phy-pop{from{transform:scale(0.2) rotate(-15deg);opacity:0;}to{transform:scale(1) rotate(0deg);opacity:1;}}
.physique-reveal-name{font-size:22px;font-weight:800;color:var(--text);font-family:var(--font-main);margin-bottom:6px;}
.physique-reveal-desc{font-size:13px;color:var(--text2);line-height:1.6;padding:0 10px;}
.physique-mult{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--jade2);margin-top:10px;font-family:var(--font-mono);}

/* ============================================================
   AD SCREEN
   ============================================================ */
.ad-wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(80,60,160,0.2),transparent 60%),var(--bg);padding:30px 24px;text-align:center;}
.ad-logo{font-size:56px;margin-bottom:16px;animation:ad-float 3s ease-in-out infinite;}
@keyframes ad-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.ad-title{font-size:22px;font-weight:800;color:var(--gold2);margin-bottom:10px;font-family:var(--font-main);}
.ad-desc{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:28px;max-width:300px;}
.ad-timer-ring{width:80px;height:80px;position:relative;margin:0 auto 24px;}
.ad-timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--qi-color);font-family:var(--font-mono);}
.ad-skip-btn{padding:14px 40px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:var(--radius2);color:#000;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.5px;}
.ad-skip-btn:disabled{opacity:0.35;cursor:not-allowed;background:var(--surface3);color:var(--text3);}

/* ============================================================
   RELATIONSHIP CARD
   ============================================================ */
.rel-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);margin:6px 12px;padding:12px;}
.rel-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.rel-portrait{width:52px;height:52px;border-radius:50%;background:var(--surface3);border:2px solid var(--border2);font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rel-info{flex:1;}
.rel-name{font-size:14px;font-weight:700;color:var(--text);font-family:var(--font-main);}
.rel-role{font-size:11px;color:var(--text2);margin-top:1px;}
.rel-desire{font-size:10px;color:var(--text3);font-style:italic;margin-top:2px;}
.bond-score{font-size:18px;font-weight:800;font-family:var(--font-mono);}
.bond-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.bond-fill{height:100%;border-radius:2px;transition:width 0.4s;}
.bond-fill.pos{background:linear-gradient(90deg,var(--jade),var(--jade2));}
.bond-fill.neg{background:linear-gradient(90deg,var(--scarlet),var(--scarlet2));}
.rel-actions{display:flex;gap:6px;flex-wrap:wrap;}
.rel-action-btn{padding:7px 10px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius);font-size:11px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;}
.rel-action-btn.jade{border-color:var(--jade);color:var(--jade2);}
.rel-action-btn.gold{border-color:var(--gold);color:var(--gold2);}
.rel-action-btn.scarlet{border-color:var(--scarlet);color:var(--scarlet2);}

/* ============================================================
   BUSINESS GRID
   ============================================================ */
.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px;}
.biz-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:4px;}
.biz-card:active{border-color:var(--gold);}
.biz-card.owned{border-color:var(--jade);background:rgba(58,154,122,0.05);}
.biz-card.locked{opacity:0.45;cursor:not-allowed;}
.biz-icon{font-size:24px;}
.biz-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.2;}
.biz-desc{font-size:10px;color:var(--text2);line-height:1.4;}
.biz-cost{font-size:11px;color:var(--gold);font-weight:700;font-family:var(--font-mono);}
.biz-yield{font-size:10px;color:var(--jade2);}

/* ============================================================
   WINDFALL BANNER
   ============================================================ */
.windfall-banner{margin:8px 12px;padding:12px;background:linear-gradient(135deg,rgba(192,160,64,0.12),rgba(192,160,64,0.04));border:1px solid rgba(192,160,64,0.35);border-radius:var(--radius2);cursor:pointer;position:relative;overflow:hidden;}
.windfall-banner::before{content:'✨';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:0.3;}
.windfall-title{font-size:13px;font-weight:700;color:var(--gold2);font-family:var(--font-main);}
.windfall-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.windfall-uses{font-size:10px;color:var(--gold);margin-top:4px;font-family:var(--font-mono);}

/* ============================================================
   SAVE SLOTS
   ============================================================ */
.save-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;}
.save-slot{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;cursor:pointer;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color 0.15s;}
.save-slot:active{border-color:var(--gold);}
.save-slot.empty{border-style:dashed;align-items:center;justify-content:center;color:var(--text3);font-size:12px;}
.save-slot-name{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font-main);}
.save-slot-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.save-slot-realm{font-size:10px;font-weight:700;margin-top:3px;}
.save-slot-row{display:flex;justify-content:space-between;margin-top:6px;}
.save-action-load{font-size:10px;color:var(--jade2);font-weight:700;}
.save-action-del{font-size:10px;color:var(--scarlet2);}

/* ============================================================
   PORTRAIT STAGES (breakthrough visuals)
   ============================================================ */
.portrait-stage{text-align:center;padding:16px 20px;}
.portrait-emoji{font-size:72px;line-height:1;margin-bottom:12px;}
.portrait-label{font-size:14px;font-weight:700;color:var(--text);font-family:var(--font-main);}
.portrait-desc{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.55;}

/* ============================================================
   CRIME / DARK PATHS
   ============================================================ */
.crime-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:rgba(160,40,64,0.06);border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;transition:background 0.12s;}
.crime-btn:active{background:rgba(160,40,64,0.12);}

/* ============================================================
   TERRITORY DISPLAY
   ============================================================ */
.territory-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 12px;}
.terr-cell{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center;}
.terr-count{font-size:22px;font-weight:800;font-family:var(--font-mono);}
.terr-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;}

/* ============================================================
   MISC
   ============================================================ */
.spacer{height:12px;}
.divider{height:1px;background:var(--border);margin:4px 0;}
.center{text-align:center;}
.glow-text{text-shadow:0 0 8px currentColor;}
.action-row{display:flex;gap:8px;padding:8px 12px;}
.action-btn{flex:1;padding:10px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.12s;}
.action-btn:active{background:var(--border2);}
.action-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;}
.action-btn.jade{background:linear-gradient(135deg,var(--jade),var(--jade2));color:#000;border:none;}

/* ============================================================
   SECT RANK STRIP
   ============================================================ */
.rank-strip{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;}
.rank-pip{flex-shrink:0;padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:10px;color:var(--text3);white-space:nowrap;}
.rank-pip.current{background:rgba(200,160,64,0.15);border-color:var(--gold);color:var(--gold2);font-weight:700;}
.rank-pip.achieved{background:rgba(58,154,122,0.1);border-color:var(--jade);color:var(--jade2);}

/* ============================================================
   EVENT LOG ENTRY
   ============================================================ */
.log-entry{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.log-entry:active{background:var(--surface2);}
.log-year{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-bottom:3px;}
.log-title{font-size:12px;font-weight:700;color:var(--text);}
.log-text{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.45;}
.log-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-top:3px;}

/* ============================================================
   IMMORTAL REALM ACCENTS
   ============================================================ */
.immortal-glow{box-shadow:0 0 20px rgba(96,255,204,0.15);}
.dao-glow{box-shadow:0 0 24px rgba(255,215,0,0.2);}

const rand  = (lo,hi)=>Math.floor(Math.random()*(hi-lo+1))+lo;
const pick  = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const byKey = (arr,k)=>arr.find(x=>x.key===k);
const fmt   = n=>{if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=10000)return(n/1000).toFixed(1)+'K';return''+Math.round(n);};
const rareClass = r=>({Inferior:'inferior',Common:'common',Rare:'rare',Legendary:'legendary',Mythic:'mythic'}[r]||'common');

function rollPhysique(){
  const total=PHYSIQUES.reduce((s,p)=>s+p.weight,0);let roll=Math.random()*total;
  for(const p of PHYSIQUES){roll-=p.weight;if(roll<=0)return p.key;}
  return 'mortal_frame';
}

function getSaveSlots(){
  const saves=[];
  for(let i=0;i<4;i++){try{const r=localStorage.getItem('dao2_save_'+i);saves.push(r?JSON.parse(r):null);}catch{saves.push(null);}}
  return saves;
}
function saveGame(state,slot){
  try{const snap=JSON.parse(JSON.stringify(state));snap._savedAt=Date.now();localStorage.setItem('dao2_save_'+slot,JSON.stringify(snap));return true;}catch{return false;}
}
function loadGame(slot){try{const r=localStorage.getItem('dao2_save_'+slot);return r?JSON.parse(r):null;}catch{return null;}}
function deleteSave(slot){localStorage.removeItem('dao2_save_'+slot);}

// ============================================================
// GAME LOGIC
// ============================================================
function currentRealm(s){return REALMS[Math.min(s.realmIndex,REALMS.length-1)];}
function physique(s){return byKey(PHYSIQUES,s.selectedPhysique)||PHYSIQUES[3];}
function lifespanCap(s){
  const r=currentRealm(s);
  const bonus=Math.round((s.stats.body-50)*12)+Math.round((s.stats.will-50)*8)+Math.round((s.stats.purity-50)*14);
  return Math.max(r.lifespan+bonus,Math.round(r.lifespan*0.8));
}

function writeLog(s,title,text,cat='World',tone='neutral'){
  const e={year:s.year,age:s.age,title,text,category:cat,tone};
  s.eventLog.unshift(e);if(s.eventLog.length>300)s.eventLog.length=300;
  s.latestEntry=e;
}

// Minor qi needed per level (progressively harder)
function minorQiNeeded(s){
  const r=currentRealm(s);
  const base=r.qiCap/9;
  // Each minor level harder; each higher realm exponentially more grind
  const scale=1+(s.minorLevel-1)*0.1+s.realmIndex*0.15;
  return Math.round(base*scale);
}

// Base cultivation speed per year
function cultivationSpeed(s){
  const phy=physique(s);
  let base=10;
  base+=Math.round((s.stats.comprehension-50)*0.15);
  base+=Math.round((s.stats.purity-50)*0.12);
  base+=Math.round((s.stats.will-50)*0.08);
  // Progressive scaling — higher realms naturally take longer
  const penalty=s.realmIndex*0.6+Math.max(0,s.realmIndex-4)*1.0;
  base=Math.max(2,base-penalty);
  // Physique multiplier — capped: inferior 0.72x, mythic 1.80x (not more)
  base=Math.round(base*phy.cultivMult);
  // Beast companion bonus
  if(s.beast.activeKey){const b=byKey(BEASTS,s.beast.activeKey);if(b)base+=b.cultivBonus;}
  // Manual speed bonus
  for(const mk of s.inv.manuals){const m=byKey(MANUALS,mk);if(m)base+=m.speedBonus;}
  // Artifact mild bonus
  if(s.inv.artifacts.includes('jade_ring'))base+=1;
  return Math.max(1,base);
}

function breakthroughProfile(s){
  const realm=currentRealm(s);
  let chance=realm.baseChance+physique(s).successMod;
  chance+=Math.round((s.stats.comprehension-50)*0.15);
  chance+=Math.round((s.stats.stability-50)*0.10);
  chance+=Math.round((s.stats.purity-50)*0.10);
  for(const mk of s.inv.manuals){const m=byKey(MANUALS,mk);if(m)chance+=m.successBonus;}
  chance-=Math.round(s.stats.instability*0.4);
  if(s.stats.karma<-20)chance-=Math.round(Math.abs(s.stats.karma+20)*0.2);
  if(s.family.daoComp)chance+=8;
  chance+=(s.inv.consumables.successBoost||0);
  // Artifacts
  for(const ak of s.inv.artifacts){const a=byKey(ARTIFACTS,ak);if(a&&a.bonus.success)chance+=Math.round(a.bonus.success*0.5);}
  chance=clamp(chance,5,97);
  const stab=clamp(60+Math.round((s.stats.stability-50)*0.5)-Math.round(s.stats.instability*0.3),10,95)+(s.inv.consumables.stabilityBoost||0);
  const fatal=clamp(Math.round((100-stab)*0.1)+(s.realmIndex>6?5:0),0,35);
  return{chance,stability:clamp(stab,10,95),fatality:fatal};
}

function powerRating(s){
  let p=s.realmIndex*800+s.minorLevel*80;
  p+=s.stats.body+s.stats.will+s.stats.comprehension;
  p+=s.inv.artifacts.length*150;
  p+=(s.beast.activeKey?s.beast.score*80:0);
  p+=s.territories.mortal*200+s.territories.spiritual*600+s.territories.immortal*2000;
  return Math.round(p);
}

function initRelations(s){
  s.relations=RELATIONS_POOL.map(r=>({
    ...r, bond:r.baseAffinity+rand(-8,8),
    trust:clamp(r.baseAffinity+rand(-12,12),-100,100),
    events:[], giftCooldown:0,
  }));
}

function startGame(s){
  const origin=byKey(ORIGINS,s.selectedOrigin);
  const temp=byKey(TEMPERAMENTS,s.selectedTemperament);
  const phy=physique(s);
  const sectData=s.selectedSect?byKey(SECTS,s.selectedSect):null;
  // Build stats
  const base={body:48,comprehension:50,will:48,charm:42,luck:45,purity:54,karma:0,ambition:50,stability:52,social:44,business:42,reputation:10,ruthlessness:30,instability:0};
  const combined={...base};
  const addStats=st=>{if(!st)return;Object.entries(st).forEach(([k,v])=>{if(k in combined)combined[k]=clamp(combined[k]+v,k==='karma'?-100:0,100);});};
  addStats(origin.stats);addStats(temp.stats);if(sectData)addStats(sectData.stats);
  s.stats=combined;
  s.res.silver=origin.res.silver;s.res.stones=origin.res.stones;
  s.qiCap=REALMS[0].qiCap;s.qi=0;s.currentJob=origin.startJob||'farmer';
  initRelations(s);
  if(s.selectedPath==='sect'&&s.selectedSect){
    s.sect.joined=true;s.sect.key=s.selectedSect;s.sect.rankKey='layman';
    // Grant starting manual
    const sManual=MANUALS.find(m=>m.reqRealm===0&&!s.inv.manuals.includes(m.key));
    if(sManual)s.inv.manuals.push(sManual.key);
  }
  s.screen='game';s.activeTab='chronicle';
  writeLog(s,'Journey Begins','Your path opens. The world is vast and indifferent. You will either ascend or fade.','Life','good');
}

function resolveCultivate(s){
  const gain=cultivationSpeed(s);
  s.minorQi=(s.minorQi||0)+gain;
  const needed=minorQiNeeded(s);
  let leveled=false;
  while(s.minorQi>=needed&&s.minorLevel<9){s.minorQi-=needed;s.minorLevel++;leveled=true;}
  if(s.minorLevel>=9)s.minorQi=Math.min(s.minorQi,needed);
  // Sync qi display
  const levelFrac=(s.minorLevel-1)/8;
  const intraFrac=needed>0?Math.min(s.minorQi/needed,1):0;
  s.qi=clamp(Math.round((levelFrac+(intraFrac/9))*s.qiCap),0,s.qiCap);
  s.stats.purity=clamp(s.stats.purity+1,0,100);
  s.stats.instability=clamp(s.stats.instability-1,0,100);
  const msg=leveled?`Reached Minor Level ${s.minorLevel}/9 in ${currentRealm(s).name}.`:`Gained ${gain} qi this year.`;
  writeLog(s,leveled?`Minor Level ${s.minorLevel} Achieved`:'Closed-Door Cultivation',msg,'Cultivation',leveled?'good':'neutral');
}

function resolveStudy(s){
  const gain=rand(8,18)+Math.round((s.stats.comprehension-50)*0.16);
  s.res.insight+=gain;s.stats.comprehension=clamp(s.stats.comprehension+1,0,100);
  const eligible=MANUALS.filter(m=>s.realmIndex>=m.reqRealm&&!s.inv.manuals.includes(m.key)&&m.rarity!=='Mythic');
  if(eligible.length&&Math.random()<0.15){
    const m=pick(eligible);s.inv.manuals.push(m.key);
    writeLog(s,'Manual Discovered',`Years of study resolved into ${m.name}.`,'Study','good');
  } else {
    writeLog(s,'Doctrine Study',`Deepened comprehension. Gained ${gain} insight.`,'Study','neutral');
  }
}

function resolveSectDuty(s){
  if(!s.sect.joined){writeLog(s,'No Sect Affiliation','You are a wandering cultivator.','Sect','bad');return;}
  const merit=20+rand(6,20);const favor=4+rand(1,7);
  s.res.merit+=merit;s.sect.favor=clamp(s.sect.favor+favor,0,100);
  s.sect.merit=(s.sect.merit||0)+merit;
  // Auto-promote if eligible
  autoPromote(s);
  if(Math.random()<0.22){s.stats.karma=clamp(s.stats.karma-4,-100,100);writeLog(s,'Sect Duty — Dirty Work',`Earned ${merit} merit but the duty soiled your karma.`,'Sect','bad');}
  else{writeLog(s,'Sect Duty Completed',`Earned ${merit} merit and ${favor} favor.`,'Sect','good');}
}

function autoPromote(s){
  if(!s.sect.joined)return;
  const eligible=SECT_RANKS.filter(r=>s.realmIndex>=r.minRealm&&(s.res.merit||0)>=r.minMerit);
  if(eligible.length){
    const best=eligible[eligible.length-1];
    if(best.key!==s.sect.rankKey){s.sect.rankKey=best.key;writeLog(s,'Sect Promotion',`You have been elevated to ${best.name}.`,'Sect','good');}
  }
}

function resolveExplore(s){
  const loc=byKey(LOCATIONS,s.locationKey);
  if(loc.stage>0&&s.realmIndex<loc.stage*6){writeLog(s,'Realm Locked',`This location requires a higher cultivation realm.`,'World','bad');return;}
  const haul=rand(22,70)+loc.wealth*8;
  const timedDanger=(s.effects&&s.effects.dangerReduce&&s.year<=s.effects.dangerReduce.untilYear)?(s.effects.dangerReduce.value||0):0;
  const danger=loc.danger+Math.round(s.stats.instability*0.45)-Math.round(s.stats.body*0.28)-(s.inv.consumables.dangerReduce||0)-timedDanger;
  s.res.stones+=haul;s.res.herbs+=rand(1,3);s.res.insight+=rand(5,15);
  // Chance to find beast egg
  if(Math.random()<0.04&&!s.beast.pendingEgg&&!s.beast.activeKey){s.beast.pendingEgg=true;writeLog(s,'Beast Egg Found',`A pulsing egg in the depths chose you.`,'Beast','good');}
  if(Math.random()*100<clamp(danger,5,70)){
    s.stats.body=clamp(s.stats.body-rand(1,5),0,100);s.stats.instability=clamp(s.stats.instability+rand(5,12),0,100);
    writeLog(s,'Expedition Injury',`Returned from ${loc.name} with ${haul} stones, but torn meridians.`,'World','bad');
  } else {
    if(Math.random()<0.2)s.res.relics++;
    writeLog(s,'Expedition Success',`Explored ${loc.name}. Returned richer and wiser.`,'World','good');
  }
  // Clear danger reduce consumable after use
  if(s.inv.consumables.dangerReduce)s.inv.consumables.dangerReduce=0;
}

function resolveMarket(s){
  const gain=rand(10,28)+Math.round((s.stats.business-50)*0.35);
  s.res.silver+=gain*8;s.res.stones+=Math.max(0,Math.round(gain/3));
  writeLog(s,'Market Arbitrage','Traded herbs, tips, and contacts. Liquidity improved.','Market','good');
}

function resolveJob(s){
  const job=byKey(MORTAL_JOBS,s.currentJob)||MORTAL_JOBS[0];
  if(job.incomeType==='silver')s.res.silver+=job.income+rand(-10,20);
  else if(job.incomeType==='stones')s.res.stones+=job.income+rand(-2,5);
  else if(job.incomeType==='jade')s.res.immortalJade+=job.income;
  s.stats.social=clamp(s.stats.social+1,0,100);
  writeLog(s,'Job Income',`Earned income as ${job.name}.`,'Work','neutral');
}

function resolveRomance(s){
  const candidates=s.relations.filter(r=>RELATIONS_POOL.find(p=>p.key===r.key)?.romanceable);
  const best=candidates.sort((a,b)=>(b.bond+b.trust)-(a.bond+a.trust))[0];
  if(best){best.bond=clamp(best.bond+rand(8,16),-100,100);best.trust=clamp(best.trust+rand(7,14),-100,100);}
  s.stats.charm=clamp(s.stats.charm+1,0,100);
  if(!s.family.spouse&&best&&best.bond>=60&&Math.random()<0.28){
    s.family.spouse=best.name;s.metrics.marriages++;
    if(Math.random()<0.5){s.family.greatFamilyTie=true;s.res.silver+=500;s.sect.favor=clamp(s.sect.favor+10,0,100);}
    writeLog(s,'Marriage Secured',`You and ${best.name} formalized the bond.`,'Bonds','good');
  } else if(!s.family.daoComp&&best&&best.trust>=70&&Math.random()<0.24){
    s.family.daoComp=best.name;
    writeLog(s,'Dao Companion Bound',`${best.name} accepted the cultivation bond. Breakthroughs no longer faced alone.`,'Bonds','good');
  } else if(!s.family.heirs&&s.family.spouse&&Math.random()<0.3){
    s.family.heirs++;writeLog(s,'Heir Born','A child enters your house.','Bonds','good');
  } else {
    writeLog(s,'Bond Cultivation','You invested in courtship and alliances.','Bonds','neutral');
  }
}

function resolveBeast(s){
  if(!s.beast.activeKey){writeLog(s,'No Beast Companion','Seek an egg at the market or auction.','Beast','neutral');return;}
  s.beast.loyalty=clamp(s.beast.loyalty+rand(6,14),0,100);s.beast.score++;s.stats.reputation=clamp(s.stats.reputation+2,0,100);
  const b=byKey(BEASTS,s.beast.activeKey);
  writeLog(s,'Beast Companion Grows',`Your ${b.name} matured and improved your aura.`,'Beast','good');
}

function resolveBusiness(s){
  if(s.businesses.length===0){writeLog(s,'No Enterprise','Open the Business tab to launch one.','Business','neutral');return;}
  let ts=0,tsi=0,tj=0;
  for(const biz of s.businesses){
    const def=byKey(BUSINESSES_TYPES,biz.key);if(!def)continue;
    const profit=def.yieldStones+Math.round((s.stats.business-50)*0.5)+biz.level*8;
    const silv=def.yieldSilver+Math.round((s.stats.business-50)*2)+biz.level*20;
    const jade=def.yieldJade||0;
    if(Math.random()*100<def.risk){s.res.stones=Math.max(0,s.res.stones-Math.round(profit*0.4));writeLog(s,'Business Setback',`${def.name} suffered a setback.`,'Business','bad');}
    else{ts+=profit;tsi+=silv;tj+=jade;biz.years++;biz.level=Math.min(10,1+Math.floor(biz.years/3));}
  }
  if(ts||tsi){s.res.stones+=ts;s.res.silver+=tsi;s.res.immortalJade+=tj;writeLog(s,'Enterprise Profits',`Businesses returned ${ts} stones and ${tsi} silver.`,'Business','good');}
}

function passiveEffects(s){
  // Stipend
  if(s.sect.joined){
    const rank=byKey(SECT_RANKS,s.sect.rankKey)||SECT_RANKS[0];
    s.res.stones+=rank.stipendStones;s.res.silver+=rank.stipendSilver;
  }
  // Job income (passive portion)
  const job=byKey(MORTAL_JOBS,s.currentJob);
  if(job&&s.selectedAction!=='job'){const half=Math.round(job.income*0.3);if(job.incomeType==='silver')s.res.silver+=half;}
  // Upkeep
  const upkeep=8+s.territories.mortal*2+s.territories.spiritual*5;
  s.res.silver=Math.max(0,s.res.silver-upkeep);
  // Debt payment
  if(s.res.debt>0){const pay=Math.min(s.res.silver,Math.ceil(s.res.debt*0.1));s.res.silver-=pay;s.res.debt=Math.max(0,s.res.debt-pay);}
  // Beast loyalty drift
  if(s.beast.activeKey)s.beast.loyalty=clamp(s.beast.loyalty+1,0,100);
  // Instability decay
  s.stats.instability=clamp(s.stats.instability-1,0,100);
  // Reputation from realm
  s.stats.reputation=clamp(s.stats.reputation+Math.round(s.realmIndex*0.4),0,100);
  // Dynasty revenue
  const dynTier=byKey(DYNASTY_TIERS,s.dynastyTierKey)||DYNASTY_TIERS[0];
  if(dynTier.income>0){s.res.silver+=dynTier.privy;} // privy purse
  // Dynasty tier auto-update
  updateDynastyTier(s);
}

function updateDynastyTier(s){
  const total=s.territories.mortal+s.territories.spiritual*2+s.territories.immortal*4;
  const eligible=DYNASTY_TIERS.filter(t=>t.reqTerr<=total);
  if(eligible.length){
    const best=eligible[eligible.length-1];
    if(best.key!==s.dynastyTierKey){
      const old=byKey(DYNASTY_TIERS,s.dynastyTierKey);
      s.dynastyTierKey=best.key;
      s.soldiers=best.soldiers;s.generals=best.generals;
      if(old&&old.reqTerr<best.reqTerr)writeLog(s,'Dynasty Elevated',`Your lineage is now recognized as ${best.name}.`,'Dynasty','good');
    }
  }
}

function maybeQueueEvent(s){
  if(s.overlay==='choice')return;
  const pool=YEAR_EVENTS.filter(e=>e.realm===-1||s.realmIndex>=e.realm);
  if(pool.length&&Math.random()<0.30){s.overlay='choice';s.overlayData={...pick(pool)};}
}

function updateRelations(s){
  s.relations=s.relations.map(r=>{
    const drift=(s.selectedAction==='romance'&&['comp_lian','comp_mei','comp_su'].includes(r.key))?rand(3,8):rand(-1,3);
    if(r.giftCooldown>0)r.giftCooldown--;
    return{...r,bond:clamp(r.bond+drift,-100,100),trust:clamp(r.trust+rand(-1,2),-100,100)};
  });
}

function advanceYear(s){
  if(s.screen!=='game')return;
  if(s.overlay==='choice')return;
  const handlers={cultivate:resolveCultivate,study:resolveStudy,sect_duty:resolveSectDuty,explore:resolveExplore,market:resolveMarket,romance:resolveRomance,beast:resolveBeast,business:resolveBusiness,job:resolveJob};
  handlers[s.selectedAction]?.(s);
  passiveEffects(s);updateRelations(s);maybeQueueEvent(s);
  s.year++;s.age++;
  // Auto-save
  if(s.settings.autoSave&&s.autoSaveSlot>=0)saveGame(s,s.autoSaveSlot);
  // Death check
  const cap=lifespanCap(s);
  if(s.age>=cap||s.stats.instability>=95){writeLog(s,s.stats.instability>=95?'Qi Deviation — Death':'Lifespan Exhausted','The heavens have closed their eyes. Your story ends here.','Legacy','bad');s.screen='dead';}
  // Instability warning
  if(s.stats.instability>=80&&s.stats.instability<95){s.latestEntry={year:s.year,age:s.age,title:'⚠ Qi Deviation Imminent',text:'Your instability is critical. One reckless year may destroy the path.',category:'Cultivation',tone:'bad'};}
}

function attemptBreakthrough(s){
  if(s.minorLevel<9){writeLog(s,'Breakthrough Blocked','Reach Minor Level 9 first.','Cultivation','bad');return;}
  const profile=breakthroughProfile(s);
  // Consume boosts
  s.inv.consumables.successBoost=0;s.inv.consumables.stabilityBoost=0;
  const prevLifespan=lifespanCap(s);
  if(Math.random()*100<=profile.chance){
    const nextIdx=s.realmIndex+1;
    if(nextIdx>=REALMS.length){writeLog(s,'Supreme Peak','You have reached the apex of existence.','Cultivation','good');return;}
    s.realmIndex=nextIdx;s.minorLevel=1;s.minorQi=0;
    s.qiCap=currentRealm(s).qiCap;s.qi=Math.round(s.qiCap*0.1);
    s.stats.instability=clamp(s.stats.instability-Math.round(profile.stability*0.2),0,100);
    s.stats.will=clamp(s.stats.will+2,0,100);
    s.res.insight+=25;s.res.merit+=50;s.sect.favor=clamp(s.sect.favor+12,0,100);
    s.metrics.breakthroughs++;
    const lifespanGain=Math.max(0,lifespanCap(s)-prevLifespan);
    // Apply karmaHit from demonic manuals at breakthrough
    for(const mk of s.inv.manuals){const m=byKey(MANUALS,mk);if(m&&m.karmaHit)s.stats.karma=clamp(s.stats.karma+m.karmaHit,-100,100);}
    autoPromote(s);
    // Unlock location
    if(s.realmIndex===6&&s.locationKey==='hamlet')s.locationKey='heaven_gate';
    if(s.realmIndex===10&&s.locationKey!=='celestial_city'){/* mortal location fine */}
    s.overlay='breakthrough';s.overlayData={realm:currentRealm(s).name,tier:currentRealm(s).tier,portraitStage:currentRealm(s).portraitStage,lifespanGain,realmIdx:s.realmIndex};
    writeLog(s,'Major Breakthrough!',`Entered ${currentRealm(s).name}. The heavens tremble.`,'Cultivation','good');
  } else {
    s.stats.instability=clamp(s.stats.instability+rand(8,22),0,100);
    s.stats.body=clamp(s.stats.body-rand(2,5),0,100);
    s.stats.purity=clamp(s.stats.purity-rand(2,6),0,100);
    s.qi=Math.round(s.qiCap*0.4);
    writeLog(s,'Breakthrough Recoil','The realm wall held. Qi sea shook. Begin again.','Cultivation','bad');
  }
}

function resolveYearChoice(s,optKey){
  if(!s.overlayData)return;
  const ev=s.overlayData;
  const opt=ev.opts?.find(o=>o.key===optKey);if(!opt)return;
  const eff=opt.eff||{};
  if(eff.stones)s.res.stones=Math.max(0,s.res.stones+eff.stones);
  if(eff.silver)s.res.silver=Math.max(0,s.res.silver+eff.silver);
  if(eff.debt)s.res.debt+=(eff.debt);
  if(eff.insightGain)s.res.insight+=(eff.insightGain);
  if(eff.merit)s.res.merit+=(eff.merit);
  if(eff.sectFavor)s.sect.favor=clamp(s.sect.favor+(eff.sectFavor),0,100);
  if(eff.rivalry)s.sect.rivalryPressure=clamp(s.sect.rivalryPressure+(eff.rivalry),0,100);
  if(eff.rival_bond){const r=s.relations.find(x=>x.key==='rival');if(r)r.bond=clamp(r.bond+(eff.rival_bond),-100,100);}
  if(eff.beastLoyalty)s.beast.loyalty=clamp(s.beast.loyalty+(eff.beastLoyalty),0,100);
  if(eff.karma)s.stats.karma=clamp(s.stats.karma+(eff.karma),-100,100);
  if(eff.will)s.stats.will=clamp(s.stats.will+(eff.will),0,100);
  if(eff.body)s.stats.body=clamp(s.stats.body+(eff.body),0,100);
  if(eff.luck)s.stats.luck=clamp(s.stats.luck+(eff.luck),0,100);
  if(eff.reputation)s.stats.reputation=clamp(s.stats.reputation+(eff.reputation),0,100);
  if(eff.social)s.stats.social=clamp(s.stats.social+(eff.social),0,100);
  if(eff.comprehension)s.stats.comprehension=clamp(s.stats.comprehension+(eff.comprehension),0,100);
  if(eff.stability)s.stats.stability=clamp(s.stats.stability+(eff.stability),0,100);
  if(eff.instability)s.stats.instability=clamp(s.stats.instability+(eff.instability),0,100);
  if(eff.risk&&Math.random()*100<eff.risk){s.stats.body=clamp(s.stats.body-rand(2,5),0,100);s.stats.instability=clamp(s.stats.instability+rand(3,8),0,100);}
  if(eff.daoCompBond&&s.family.daoComp){const r=s.relations.find(x=>x.name===s.family.daoComp);if(r)r.bond=clamp(r.bond+(eff.daoCompBond),-100,100);}
  const negKeys=['ignore_m','exploit','harvest','study_forbidden','raid_caravan','grave_rob','assassination'];
  writeLog(s,ev.title,opt.res,'Choice',negKeys.includes(optKey)?'bad':'good');
  s.overlay=null;s.overlayData=null;
}

function activateWindfall(s){
  if(s.windfallUsed>=2)return;
  s.pendingWindfall=pick(WINDFALL_EVENTS);
  s.adPhase='windfall';s.adTimer=5;s.adSkippable=false;s.screen='ad';
}

function claimWindfall(s){
  const wf=s.pendingWindfall;if(!wf){s.screen='game';return;}
  s.res.stones+=wf.stones;s.res.silver+=wf.silver;s.res.insight+=wf.insight;
  if(wf.special==='relic')s.res.relics++;
  if(wf.special==='manual'){const el=MANUALS.filter(m=>s.realmIndex>=m.reqRealm&&!s.inv.manuals.includes(m.key));if(el.length)s.inv.manuals.push(pick(el).key);}
  if(wf.special==='comprehension_boost')s.stats.comprehension=clamp(s.stats.comprehension+12,0,100);
  if(wf.special==='physique_bonus'){s.stats.purity=clamp(s.stats.purity+8,0,100);s.stats.stability=clamp(s.stats.stability+5,0,100);}
  if(wf.special==='beast_egg'&&!s.beast.pendingEgg&&!s.beast.activeKey)s.beast.pendingEgg=true;
  s.windfallUsed++;s.pendingWindfall=null;
  writeLog(s,'Windfall Claimed',`${wf.name}: ${wf.desc}`,'Fortune','good');
  s.screen='game';
}

function getShopItems(s){
  const tier=Math.min(4,Math.floor(s.realmIndex/2));
  const items=SHOP_ITEMS.filter(i=>i.tier===tier);
  // Add 1 from previous tier for variety
  if(tier>0){const prev=SHOP_ITEMS.filter(i=>i.tier===tier-1);if(prev.length)items.push(prev[rand(0,prev.length-1)]);}
  // Deduplicate by key
  const seen=new Set();return items.filter(i=>{if(seen.has(i.key))return false;seen.add(i.key);return true;}).slice(0,7);
}

function buyShopItem(s,key){
  const item=getShopItems(s).find(i=>i.key===key);if(!item)return;
  if(item.costStones&&s.res.stones<item.costStones){writeLog(s,'Insufficient Stones',`Need ${item.costStones} spirit stones.`,'Market','bad');return;}
  if(item.costSilver&&s.res.silver<item.costSilver){writeLog(s,'Insufficient Silver',`Need ${item.costSilver} silver.`,'Market','bad');return;}
  if(item.costStones)s.res.stones-=item.costStones;
  if(item.costSilver)s.res.silver-=item.costSilver;
  const eff=item.effect||{};
  if(eff.qiBoost)s.minorQi=(s.minorQi||0)+eff.qiBoost;
  if(eff.statBoost)Object.entries(eff.statBoost).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+v,0,100);});
  if(eff.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+eff.successBoost;
  if(eff.stabilityBoost)s.inv.consumables.stabilityBoost=(s.inv.consumables.stabilityBoost||0)+eff.stabilityBoost;
  if(eff.insightBoost)s.res.insight+=eff.insightBoost;
  if(eff.purityBoost)s.stats.purity=clamp(s.stats.purity+eff.purityBoost,0,100);
  if(eff.dangerReduce)s.inv.consumables.dangerReduce=(s.inv.consumables.dangerReduce||0)+eff.dangerReduce;
  if(eff.beastBoost)s.beast.loyalty=clamp(s.beast.loyalty+eff.beastBoost,0,100);
  if(eff.alchemyBoost)s.inv.consumables.alchemyBoost=(s.inv.consumables.alchemyBoost||0)+eff.alchemyBoost;
  if(eff.qiCapBoost){s.qiCap+=eff.qiCapBoost;}
  if(eff.immortalJade)s.res.immortalJade+=eff.immortalJade;
  writeLog(s,'Item Purchased',`${item.name} secured from the marketplace.`,'Market','good');
}

function launchBusiness(s,key){
  const def=byKey(BUSINESSES_TYPES,key);if(!def)return;
  if(s.businesses.find(b=>b.key===key)){writeLog(s,'Already Running',`${def.name} is already established.`,'Business','bad');return;}
  if(s.realmIndex<(def.realmMin||0)){writeLog(s,'Realm Too Low',`Need Realm ${def.realmMin+1}+ for ${def.name}.`,'Business','bad');return;}
  if(def.startupStones&&s.res.stones<def.startupStones){writeLog(s,'Insufficient Stones',`Need ${def.startupStones} stones for ${def.name}.`,'Business','bad');return;}
  if(def.startupSilver&&s.res.silver<def.startupSilver){writeLog(s,'Insufficient Silver',`Need ${def.startupSilver} silver for ${def.name}.`,'Business','bad');return;}
  if(def.startupStones)s.res.stones-=def.startupStones;
  if(def.startupSilver)s.res.silver-=def.startupSilver;
  s.businesses.push({key,years:0,level:1});s.metrics.businesses++;
  writeLog(s,'Enterprise Founded',`${def.name} established. Wealth will now compound.`,'Business','good');
}

function startAuction(s,lotKey){
  const lot=byKey(AUCTION_POOL,lotKey);if(!lot)return;
  if(lot.realmMin&&s.realmIndex<lot.realmMin){writeLog(s,'Realm Too Low',`Need Realm ${lot.realmMin+1}+ for this item.`,'Auction','bad');return;}
  const startPrice=lot.basePrice+rand(0,Math.round(lot.basePrice*0.2));
  const hasOpp=Math.random()<0.72;
  s.auction={lot,playerBid:startPrice,opponentBid:hasOpp?Math.round(startPrice*0.85):0,opponentMax:hasOpp?Math.round(lot.basePrice*(1.2+Math.random()*0.9)):0,opponentActive:hasOpp,resolved:false,message:''};
  s.overlay='auction';s.overlayData=null;
}

function raiseBid(s,amount){
  const a=s.auction;if(!a||a.resolved)return;
  a.playerBid+=amount;
  if(a.opponentActive&&a.opponentBid<a.opponentMax){
    const oppResp=a.playerBid+rand(5,30);
    if(oppResp<=a.opponentMax){a.opponentBid=oppResp;a.message=`Opponent raised to ${oppResp}💎.`;}
    else{a.opponentBid=a.opponentMax;a.message=`Opponent is at their limit (${a.opponentMax}💎).`;}
  } else if(a.opponentActive){a.message='Opponent dropped out.';}
}

function commitBid(s){
  const a=s.auction;if(!a||a.resolved)return;
  if(s.res.stones<a.playerBid){writeLog(s,'Bid Failed',`Need ${a.playerBid} stones.`,'Auction','bad');s.overlay=null;return;}
  const won=!a.opponentActive||a.playerBid>a.opponentBid;
  if(won){
    s.res.stones-=a.playerBid;const lot=a.lot;
    if(lot.type==='manual'&&lot.manualKey&&!s.inv.manuals.includes(lot.manualKey)){s.inv.manuals.push(lot.manualKey);}
    if(lot.type==='artifact'&&lot.artifactKey&&!s.inv.artifacts.includes(lot.artifactKey)){s.inv.artifacts.push(lot.artifactKey);}
    if(lot.type==='beast_egg'){s.beast.pendingEgg=true;}
    if(lot.type==='resources'&&lot.effect){if(lot.effect.herbs)s.res.herbs+=lot.effect.herbs;}
    if(lot.type==='territory')s.territories.mortal++;
    if(lot.type==='consumable'&&lot.effect){if(lot.effect.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+lot.effect.successBoost;}
    s.metrics.auctions++;
    writeLog(s,'Auction Victory',`${lot.name} secured for ${a.playerBid} stones.`,'Auction','good');
    // Dopamine: show beast hatch prompt if egg won
    if(lot.type==='beast_egg'){s.overlay='hatch';}else{s.overlay=null;}
  } else {
    writeLog(s,'Outbid',`Outbid on ${a.lot.name}. Opportunity lost.`,'Auction','bad');s.overlay=null;
  }
  a.resolved=true;
}

function hatchBeast(s,key){
  const b=byKey(BEASTS,key);if(!b)return;
  s.beast.activeKey=key;s.beast.loyalty=50;s.beast.score=1;s.beast.tier=b.tier;s.beast.pendingEgg=false;
  // Apply beast stat bonuses
  Object.entries(b.bonus).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+Math.round(v*0.4),0,100);});
  writeLog(s,'Beast Hatched!',`${b.name} bonded with your bloodline. A new power stirs.`,'Beast','good');
  s.overlay=null;s.subscreen=null;
}

function commitCrime(s,crimeKey){
  const crime=byKey(CRIME_EVENTS,crimeKey);if(!crime)return;
  s.metrics.crimesDone++;
  if(Math.random()*100<crime.risk){
    s.stats.instability=clamp(s.stats.instability+rand(10,20),0,100);
    s.stats.body=clamp(s.stats.body-rand(3,8),0,100);
    writeLog(s,'Crime Failed',`The ${crime.name.toLowerCase()} went wrong. You barely escaped.`,'Crime','bad');
  } else {
    if(crime.reward.silver)s.res.silver+=crime.reward.silver;
    if(crime.reward.stones)s.res.stones+=crime.reward.stones;
    if(crime.reward.herbs)s.res.herbs+=crime.reward.herbs;
    if(crime.reward.relics)s.res.relics+=crime.reward.relics;
    s.stats.karma=clamp(s.stats.karma+crime.karmaHit,-100,100);
    s.rankings.notoriety=clamp(s.rankings.notoriety+5,0,100);
    writeLog(s,'Crime Committed',`${crime.name} succeeded. The spoils are real; so is the stain.`,'Crime','bad');
  }
  s.overlay=null;
}

function renderRow({icon='⬤',title,sub,value='',action='',cls='',badge=''}){
  return`<button class="list-row ${cls}" ${action}>
    <div class="row-icon">${icon}</div>
    <div class="row-text">
      <div class="row-title">${title}${badge?` <span class="pill ${badge.cls}">${badge.text}</span>`:''}</div>
      ${sub?`<div class="row-sub">${sub}</div>`:''}
    </div>
    ${value?`<div class="row-value">${value}</div>`:`<div class="row-arr">›</div>`}
  </button>`;
}
function sectionLabel(txt){return`<div class="section-label">${txt}</div>`;}
function notice(txt,cls=''){return`<div class="notice ${cls}">${txt}</div>`;}

function renderTopStrip(s){
  const r=currentRealm(s);const phy=physique(s);const isCult=s.selectedAction==='cultivate'&&s.screen==='game';
  const orbs=isCult?[0,1,2].map((i)=>`<div class="qi-orb ${isCult?'active':''}" style="--start:${i*120}deg;--dur:${2.2+i*0.4}s;opacity:${0.6+i*0.1}"></div>`).join(''):'';
  return`<div class="top-strip">
    <div class="cultivator-avatar" data-action="open-profile">
      <div class="qi-orbs">${orbs}</div>
      <div class="avatar-inner"><div class="avatar-char ${isCult?'cultivating':''}">${phy.icon}</div></div>
      <div class="aura-ring" style="animation-name:${s.realmIndex>=10?'dao-aura-pulse':'aura-pulse'}"></div>
    </div>
    <div class="profile-info">
      <div class="profile-name">${s.name} · Age ${s.age}</div>
      <div class="profile-sub" style="color:${r.color}">${r.name} Lv.${s.minorLevel}/9</div>
    </div>
    <div class="resources-strip">
      <div class="res-item"><span>💎</span><span class="res-val">${fmt(s.res.stones)}</span><span class="res-lbl"> stones</span></div>
      <div class="res-item"><span>🪙</span><span class="res-val">${fmt(s.res.silver)}</span><span class="res-lbl"> silver</span></div>
      ${s.res.immortalJade>0?`<div class="res-item"><span>✨</span><span class="res-val">${s.res.immortalJade}</span><span class="res-lbl"> jade</span></div>`:''}
    </div>
  </div>`;
}

function renderQiBar(s){
  const r=currentRealm(s);const pct=Math.round((s.qi/s.qiCap)*100);
  const pips=Array.from({length:9},(_,i)=>{
    const filled=i<s.minorLevel-1;const current=i===s.minorLevel-1;
    return`<div class="minor-pip ${filled?'filled':current?'current':''}"></div>`;
  }).join('');
  return`<div class="qi-bar-wrap">
    <div class="qi-meta"><span style="color:${r.color}">${r.short} · Minor ${s.minorLevel}/9</span><span>Yr ${s.year} · Age ${s.age}</span></div>
    <div class="qi-track"><div class="qi-fill" style="width:${pct}%;background:linear-gradient(90deg,${r.color}88,${r.color})"></div></div>
    <div class="minor-pips">${pips}</div>
  </div>`;
}

function renderHeaderBar(title,backTarget='close-subscreen',color='var(--text2)',rightBtn=''){
  return`<div class="header-bar">
    <button class="hdr-back" data-action="${backTarget}">‹</button>
    <div class="hdr-title" style="color:${color}">${title}</div>
    <div class="hdr-right">${rightBtn}</div>
  </div>`;
}

function renderWorldTab(s){
  const loc=byKey(LOCATIONS,s.locationKey);
  let h=renderTopStrip(s)+renderQiBar(s);
  h+=`<div class="screen-scroll">`;
  h+=sectionLabel('Current Location');
  h+=`<div class="card warn">
    <div class="card-title">${loc.icon} ${loc.name}</div>
    <div class="card-sub">${loc.type} · Danger: ${loc.danger} · Wealth: ${loc.wealth} · Law: ${loc.law}<br>${loc.desc}</div>
  </div>`;
  h+=sectionLabel('Mortal World');
  const mortalLocs=LOCATIONS.filter(l=>l.stage===0);
  for(const l of mortalLocs){h+=renderRow({icon:l.icon,title:l.name,sub:`${l.type} · Wealth ${l.wealth} · Danger ${l.danger}`,cls:s.locationKey===l.key?'selected-gold':'',action:`data-travel="${l.key}"`,value:s.locationKey===l.key?'Here':'Move'});}

function renderMarketplace(s){

function renderAuction(s){

// ============================================================
// TOAST NOTIFICATION SYSTEM
// ============================================================
let _toastQueue=[];let _toastActive=false;
function showToast(msg,type='good',dur=2600){
  _toastQueue.push({msg,type,dur});
  if(!_toastActive)_drainToast();
}
function _drainToast(){
  if(!_toastQueue.length){_toastActive=false;return;}
  _toastActive=true;
  const {msg,type,dur}=_toastQueue.shift();
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);max-width:340px;width:90%;z-index:9999;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;pointer-events:none;transition:all 0.3s cubic-bezier(.2,.8,.4,1);opacity:0;color:${type==='good'?'#0a1a12':type==='bad'?'#fff0f0':'#1a1400'};background:${type==='good'?'linear-gradient(135deg,#50c89a,#70e8ba)':type==='bad'?'linear-gradient(135deg,#d04060,#f06080)':'linear-gradient(135deg,#c8a040,#f0c060)'};box-shadow:0 4px 20px rgba(0,0,0,0.5);`;
  el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.opacity='1';el.style.transform='translateX(-50%) translateY(0)';});
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';setTimeout(()=>{el.remove();_drainToast();},300);},dur);
}

function refinePill(s,key){
  const rec=ALCHEMY_RECIPES.find(r=>r.key===key);if(!rec)return;
  if(s.res.herbs<rec.herbCost||s.res.stones<rec.stoneCost){writeLog(s,'Insufficient Materials','Not enough herbs or stones.',  'Alchemy','bad');return;}
  s.res.herbs-=rec.herbCost;s.res.stones-=rec.stoneCost;
  // Alchemy success chance — improved by cauldron artifact and alchemy consumable
  const alchBonus=(s.inv.consumables.alchemyBoost||0);
  const baseChance=65+Math.round((s.stats.comprehension-50)*0.3)+alchBonus;
  const roll=Math.random()*100;
  if(roll<=Math.min(baseChance,95)){
    const eff=rec.effect||{};
    if(eff.qiBoost)s.minorQi=(s.minorQi||0)+eff.qiBoost;
    if(eff.statBoost)Object.entries(eff.statBoost).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+v,0,100);});
    if(eff.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+eff.successBoost;
    if(eff.stabilityBoost)s.inv.consumables.stabilityBoost=(s.inv.consumables.stabilityBoost||0)+eff.stabilityBoost;
    if(eff.purityBoost)s.stats.purity=clamp(s.stats.purity+eff.purityBoost,0,100);
    if(eff.insightBoost)s.res.insight+=eff.insightBoost;
    if(eff.beastBoost)s.beast.loyalty=clamp(s.beast.loyalty+eff.beastBoost,0,100);
    writeLog(s,'Pill Refined',`${rec.name} successfully refined. Effect applied.`,'Alchemy','good');
    showToast(`✅ ${rec.name} refined!`,'good');
  } else {
    writeLog(s,'Pill Failure',`The ${rec.name} refinement failed. Materials lost.`,'Alchemy','bad');
    showToast(`💨 Refinement failed — materials lost`,'bad');
  }
  if(alchBonus>0)s.inv.consumables.alchemyBoost=0;
}

function forgeItem(s,key){
  const rec=FORGE_RECIPES.find(r=>r.key===key);if(!rec)return;
  if(s.res.herbs<rec.herbCost||s.res.relics<rec.relicCost){writeLog(s,'Insufficient Materials','Need more herbs or relics.','Forge','bad');return;}
  s.res.herbs-=rec.herbCost;s.res.relics-=rec.relicCost;
  // Quality chance: more rare mats = better chance of legendary output
  const qualityRoll=Math.random();
  const isLegendary=qualityRoll>0.85&&rec.relicCost>=2;
  const eff=rec.effect||{};
  const mult=isLegendary?1.5:1;
  if(eff.statBoost)Object.entries(eff.statBoost).forEach(([k,v])=>{if(k in s.stats)s.stats[k]=clamp(s.stats[k]+Math.round(v*mult),0,100);});
  if(eff.stabilityBoost)s.inv.consumables.stabilityBoost=(s.inv.consumables.stabilityBoost||0)+Math.round((eff.stabilityBoost||0)*mult);
  if(eff.successBoost)s.inv.consumables.successBoost=(s.inv.consumables.successBoost||0)+Math.round((eff.successBoost||0)*mult);
  const qual=isLegendary?' [LEGENDARY QUALITY]':'';
  writeLog(s,'Item Forged',`${rec.name}${qual} forged. Effect applied.`,'Forge','good');
  showToast(`⚒ ${rec.name}${qual} forged!`,isLegendary?'warn':'good');
}

function triggerWandererEvent(s){
  if(s.selectedPath!=='wanderer'&&!(!s.sect.joined))return;
  if(Math.random()<0.12){
    const ev=pick(WANDERER_EVENTS);
    if(ev.stones)s.res.stones+=ev.stones;
    if(ev.karma)s.stats.karma=clamp(s.stats.karma+ev.karma,-100,100);
    if(ev.insight)s.res.insight+=ev.insight;
    if(ev.relics)s.res.relics+=ev.relics;
    if(ev.manualChance&&Math.random()<ev.manualChance){
      const el=MANUALS.filter(m=>s.realmIndex>=m.reqRealm&&!s.inv.manuals.includes(m.key));
      if(el.length){s.inv.manuals.push(pick(el).key);}
    }
    writeLog(s,ev.name,ev.desc,'Fortune','good');
    showToast(`✨ ${ev.name}`,'good',3000);
  }
}

  if(s.overlay==='hatch')fullHtml+=`<div class="overlay"><div class="overlay-panel">${renderHatchScreen(s).replace('<div class="screen-scroll">','<div class="overlay-scroll">')}</div></div>`;
  if(s.overlay==='crime')fullHtml+=`<div class="overlay"><div class="overlay-panel">${renderCrimeScreen(s).replace('<div class="screen-scroll">','<div class="overlay-scroll">')}</div></div>`;
  if(s.overlay==='rel-detail'&&s.overlayData)fullHtml+=renderRelDetailOverlay(s,s.overlayData);
  return fullHtml;
}

const _origBindEvents=bindEvents;
function bindEvents(){
  const root=document.getElementById('root');
  root.onclick=e=>{
    const t=e.target.closest('[data-action],[data-origin],[data-temperament],[data-path],[data-sect],[data-select-action],[data-open],[data-tab],[data-buy-item],[data-buy-artifact],[data-launch-biz],[data-buy-property],[data-travel],[data-contest],[data-start-auction],[data-bid-raise],[data-hatch],[data-choose],[data-gift-rel],[data-propose],[data-dao-comp],[data-challenge],[data-talk-rel],[data-toggle],[data-open-rel],[data-save-slot],[data-load-slot],[data-delete-slot],[data-join-sect],[data-set-job],[data-sect-action],[data-commit-crime],[data-refine-pill],[data-forge-item],[data-buy-beast-egg],[data-beast-action],[data-dynasty-action],[data-immortal-action],[data-seek-immortal-manual],[data-buy-nope]');
    if(!t)return;e.stopPropagation();
    const action=t.dataset.action;
    if(action){
      if(action==='advance-year'){
        if(S.settings.ageConfirm&&!confirm('Advance one year?'))return;
        // Use patched version that includes wanderer events
        const handlers={cultivate:resolveCultivate,study:resolveStudy,sect_duty:resolveSectDuty,explore:resolveExplore,market:resolveMarket,romance:resolveRomance,beast:resolveBeast,business:resolveBusiness,job:resolveJob};
        if(S.screen==='game'&&S.overlay!=='choice'){
          handlers[S.selectedAction]?.(S);
          passiveEffects(S);updateRelations(S);
          triggerWandererEvent(S);
          maybeQueueEvent(S);
          S.year++;S.age++;
          if(S.settings.autoSave&&S.autoSaveSlot>=0)saveGame(S,S.autoSaveSlot);
          const cap=lifespanCap(S);
          if(S.age>=cap||S.stats.instability>=95){
            writeLog(S,S.stats.instability>=95?'Qi Deviation — Death':'Lifespan Exhausted','The heavens have closed their eyes.','Legacy','bad');
            S.screen='dead';
            showToast('Your cultivation journey ends here.','bad',4000);
          }
          if(S.stats.instability>=80&&S.stats.instability<95)showToast(`⚠️ Instability critical: ${S.stats.instability}/100`,'bad');
          if(S.minorLevel>=9)showToast('🌟 Breakthrough ready! Minor Level 9 achieved.','warn',3500);
        }
      } else if(action==='attempt-breakthrough'){attemptBreakthrough(S);if(S.overlay==='breakthrough')showToast(`⚡ Entered ${currentRealm(S).name}!`,'good',4000);}
      else if(action==='start-new-life'){S=createState();S.adPhase='new_life';S.screen='ad';startAdCountdown();}
      else if(action==='finish-ad'){clearInterval(adInterval);S.screen='setup';S.selectedPhysique=rollPhysique();}
      else if(action==='claim-windfall'){clearInterval(adInterval);claimWindfall(S);showToast('✨ Windfall claimed!','warn',3000);}
      else if(action==='activate-windfall'){activateWindfall(S);startAdCountdown();}
      else if(action==='open-profile'){S.overlay='profile';}
      else if(action==='open-history'){S.overlay='history';}
      else if(action==='close-overlay'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-breakthrough'){S.overlay=null;S.overlayData=null;}
      else if(action==='close-subscreen'){S.subscreen=null;}
      else if(action==='close-auction'){S.overlay=null;}
      else if(action==='close-crime'){S.overlay=null;}
      else if(action==='close-hatch'){S.overlay=null;}
      else if(action==='noop')return;
      else if(action==='setup-next'){
        if(S.setupStep===0&&S.selectedOrigin)S.setupStep=1;
        else if(S.setupStep===1&&S.selectedTemperament)S.setupStep=2;
        else if(S.setupStep===2){
          if(S.selectedPath==='wanderer')startGame(S);
          else if(S.selectedPath==='sect')S.setupStep=3;
        } else if(S.setupStep===3&&S.selectedSect){startGame(S);}
      }
      else if(action==='open-save'){S.overlay='save';}
      else if(action==='open-save-title'){S.overlay='save';}
      else if(action==='commit-bid'){commitBid(S);if(S.metrics.auctions>0&&S.overlay!=='hatch')showToast('🔨 Lot secured!','good');}
      else if(action==='open-crime'){S.overlay='crime';}
      else if(action==='open-hatch'){S.overlay='hatch';}
      else if(action==='open-jobmenu'){S.overlay='jobmenu';}
    }
    // Setup
    if(t.dataset.origin){S.selectedOrigin=t.dataset.origin;}
    if(t.dataset.temperament){S.selectedTemperament=t.dataset.temperament;}
    if(t.dataset.path){S.selectedPath=t.dataset.path;}
    if(t.dataset.sect){S.selectedSect=t.dataset.sect;}
    // Navigation
    if(t.dataset.tab){S.activeTab=t.dataset.tab;S.subscreen=null;}
    if(t.dataset.open){S.subscreen=t.dataset.open;}
    if(t.dataset.selectAction){S.selectedAction=t.dataset.selectAction;showToast(`Action set: ${t.dataset.selectAction}`,'warn',1400);}
    // Purchases
    if(t.dataset.buyItem){buyShopItem(S,t.dataset.buyItem);}
    if(t.dataset.buyNope){showToast('Not enough resources','bad',1800);}
    if(t.dataset.buyArtifact){
      const[key,price]=t.dataset.buyArtifact.split('_');
      if(!S.inv.artifacts.includes(key)&&S.res.stones>=parseInt(price)){
        S.res.stones-=parseInt(price);S.inv.artifacts.push(key);
        const a=byKey(ARTIFACTS,key);
        if(a)Object.entries(a.bonus).forEach(([k,v])=>{if(k in S.stats)S.stats[k]=clamp(S.stats[k]+Math.round(v*0.4),0,100);});
        writeLog(S,'Artifact Purchased',`${a?.name||key} secured.`,'Market','good');
        showToast(`💎 ${a?.name||key} purchased!`,'good');
      } else showToast('Cannot purchase — not enough stones or already owned','bad');
    }
    if(t.dataset.launchBiz){launchBusiness(S,t.dataset.launchBiz);}
    if(t.dataset.buyProperty){
      const p=PROPERTIES.find(x=>x.key===t.dataset.buyProperty);
      if(p&&!S.inv.properties.includes(p.key)){
        const ok=(p.costJade&&S.res.immortalJade>=p.costJade)||(p.costStones&&S.res.stones>=p.costStones)||(p.costSilver&&S.res.silver>=p.costSilver);
        if(ok){
          if(p.costJade)S.res.immortalJade-=p.costJade;
          else if(p.costStones)S.res.stones-=p.costStones;
          else if(p.costSilver)S.res.silver-=p.costSilver;
          S.inv.properties.push(p.key);
          writeLog(S,'Property Acquired',`${p.name} added to your holdings.`,'Business','good');
          showToast(`🏠 ${p.name} acquired!`,'good');
        } else showToast('Insufficient funds for this property','bad');
      }
    }
    // Travel
    if(t.dataset.travel){
      const l=byKey(LOCATIONS,t.dataset.travel);
      if(l.stage>0&&S.realmIndex<l.stage*6){showToast(`Need Realm ${l.stage*6+1}+ to enter ${l.name}`,'bad');}
      else{if(S.locationKey!==t.dataset.travel){writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');showToast(`📍 Moved to ${l.name}`,'warn',2000);}S.locationKey=t.dataset.travel;}
    }
    // Territory
    if(t.dataset.contest){
      const tier=t.dataset.contest;const reqs={mortal:5,spiritual:6,immortal:10};
      if(S.realmIndex<reqs[tier]){showToast(`Need Realm ${reqs[tier]+1}+ to contest ${tier} territory`,'bad');}
      else if(Math.random()<0.55){S.territories[tier]++;S.rankings.sect+=5;updateDynastyTier(S);writeLog(S,'Territory Seized',`Expanded ${tier} holdings.`,'War','good');showToast(`⚔️ ${tier} territory claimed!`,'good');}
      else{S.sect.rivalryPressure=clamp(S.sect.rivalryPressure+10,0,100);writeLog(S,'Campaign Failed','Expansion failed.','War','bad');showToast('Campaign failed — rivals grow bolder','bad');}
    }
    // Auction
    if(t.dataset.startAuction){startAuction(S,t.dataset.startAuction);}
    if(t.dataset.bidRaise){raiseBid(S,parseInt(t.dataset.bidRaise));}
    // Beast
    if(t.dataset.hatch){hatchBeast(S,t.dataset.hatch);showToast(`🐉 ${byKey(BEASTS,t.dataset.hatch)?.name} hatched and bonded!`,'good',4000);}
    if(t.dataset.buyBeastEgg){
      const[key,price]=t.dataset.buyBeastEgg.split('_');
      if(!S.beast.activeKey&&!S.beast.pendingEgg&&S.res.stones>=parseInt(price)){
        S.res.stones-=parseInt(price);S.beast.pendingEgg=true;
        writeLog(S,'Beast Egg Purchased',`${byKey(BEASTS,key)?.name||key} egg acquired. Hatch it when ready.`,'Beast','good');
        showToast('🥚 Beast egg acquired — go hatch it!','good',3500);
        S.overlay='hatch';
      } else showToast('Cannot buy beast egg right now','bad');
    }
    if(t.dataset.beastAction){
      const ba=t.dataset.beastAction;
      if(ba==='feed'){if(S.res.stones>=60){S.res.stones-=60;S.beast.loyalty=clamp(S.beast.loyalty+20,0,100);showToast('🐾 Beast fed! Loyalty +20','good');}else showToast('Need 60💎 to feed','bad');}
      else if(ba==='upgrade-chain'){
        if(S.res.stones>=70){
          S.res.stones-=70;
          const b=byKey(BEASTS,S.beast.activeKey);
          if(b){b.cultivBonus+=3;}
          writeLog(S,'Beast Upgraded','Divine Beast Chain forged stronger bonds. Cultivation bonus increased.','Beast','good');
          showToast('⛓ Beast chain upgraded! +3 cultiv bonus','good');
        } else showToast('Need 70💎 to upgrade chain','bad');
      }

      else showToast('Bond not deep enough yet (need 40+)','bad');
    }

function calcMilitaryPower(s) {
  let p = powerRating(s);
  p += (s.soldiers || 0) * 50;
  p += (s.generals || 0) * 400;
  if (s.beast && s.beast.activeKey) {
    const b = byKey(BEASTS, s.beast.activeKey);
    if (b) p += b.cultivBonus * 180;
  }
  p += (s.disciples || 0) * 120;
  const master = s.relations ? s.relations.find(r => r.key === 'master') : null;
  if (master && master.bond > 40) p += master.bond * 25;
  return Math.round(p);
}

function getBeastStageIcon(s) {
  if (!s.beast || !s.beast.activeKey) return '❓';
  const stages = BEAST_STAGES[s.beast.activeKey] || { baby:'🐾', juvenile:'🐾', adult:'🌟🐾', full:'✨🌟🐾' };
  const score = s.beast.score || 0;
  if (score < 5)  return stages.baby;
  if (score < 15) return stages.juvenile;
  if (score < 30) return stages.adult;
  return stages.full;
}

  if (s.sect.favor < 5) { showToast('Need 5 sect favor to accept a disciple', 'bad'); return; }

  if ((s.disciples || 0) >= maxDisc) { showToast(`Max ${maxDisc} disciples at current realm`, 'bad'); return; }

  if (!s.discipleList) s.discipleList = [];

  const name = names.find(n => !taken.has(n)) || `Disciple ${s.disciples}`;
  s.discipleList.push({ name, realmIndex:0, merit:0, years:0, path:pick(['sword','pill','body']), sentOut:false });

function progressDisciples(s) {

function checkTutorial(s) {

    if (s.tutorialDone[step.key]) continue;
    if (s.realmIndex < step.minRealm) continue;
    let fire = false;
    if (step.trigger === 'year2'   && s.year === 2)         fire = true;
    if (step.trigger === 'minor9'  && s.minorLevel >= 9)    fire = true;
    if (step.trigger === 'year10'  && s.year >= 10)         fire = true;
    if (step.trigger === `realm${step.minRealm}` && s.realmIndex >= step.minRealm) fire = true;
    if (fire) {
      s.tutorialDone[step.key] = true;
      showToast(`💡 ${step.msg}`, 'warn', 5500);
