    if (t.dataset.hatchInv !== undefined) {
      const idx = parseInt(t.dataset.hatchInv);
      if (S.beastEggs && S.beastEggs[idx]) {
        const egg = S.beastEggs[idx];
        if (typeof hatchBeast === 'function') hatchBeast(S, egg.key);
        S.beastEggs.splice(idx, 1);
        showToast('🐉 Beast hatched from your inventory!', 'good', 4000);
      }
      render(); return;
    }

    if (t.dataset.goOutRel) {
      const r = S.relations.find(x => x.key === t.dataset.goOutRel);
      if (r && S.res.silver >= 30) {
        S.res.silver -= 30;
        r.bond  = Math.min(100, r.bond  + Math.floor(Math.random()*9+10));
        r.trust = Math.min(100, (r.trust||0) + Math.floor(Math.random()*7+8));
        writeLog(S,'A Day Together',`Spent quality time with ${r.name}.`,'Bonds','good');
        showToast(`🎭 Went out with ${r.name}. Bond +10~18`, 'good', 3000);
      } else if (r) showToast('Need 30🪙 for an outing', 'bad');
      render(); return;
    }

    // Sect-specific NPC handlers (must come before generic [data-sect])
    if (t.dataset.sectGift) {
      const nm = t.dataset.sectGift;
      if (S.res.stones >= 15) {
        S.res.stones -= 15;
        if (!S.sectMembers) S.sectMembers = {};
        S.sectMembers[nm] = Math.min(100, (S.sectMembers[nm]||0) + 12);
        _ensureRelation(S, nm, 12, 8, 2);
        showToast(`🎁 Gift to ${nm} — Bond +12`, 'good');
      } else showToast('Need 15💎 to gift', 'bad');
      render(); return;
    }

    if (t.dataset.sectTalk) {
      const nm = t.dataset.sectTalk;
      if (!S.sectMembers) S.sectMembers = {};
      S.sectMembers[nm] = Math.min(100, (S.sectMembers[nm]||0) + 5);
      const isNew = _ensureRelation(S, nm, 5, 3, 0);
      showToast(isNew ? `💬 First conversation with ${nm}! Now in Bonds tab.` : `💬 Talked with ${nm}. Bond +5`, 'warn', 3000);
      writeLog(S,'Conversation',`Exchanged words with ${nm}.`,'Sect','neutral');
      render(); return;
    }

    if (t.dataset.sectRomance) {
      const nm = t.dataset.sectRomance;
      const bond = (S.sectMembers||{})[nm]||0;
      if (bond >= 30 && !S.family.spouse && (S.stats.influence||0) >= 40) {
        S.family.spouse = nm;
        S.metrics.marriages = (S.metrics.marriages||0) + 1;
        writeLog(S,'Married',`${nm} accepted your proposal.`,'Bonds','good');
        showToast(`💍 Married ${nm}!`, 'good', 4000);
      } else if (bond < 30) showToast('Build more bond first (need 30+)', 'bad');
      else if (S.family.spouse) showToast('Already married', 'bad');
      else showToast('Need 40+ influence to propose to a sect member', 'bad');
      render(); return;
    }

    if (t.dataset.sectDual) {
      if (typeof startDualCultivation === 'function') startDualCultivation(S, t.dataset.sectDual);
      render(); return;
    }

    if (t.dataset.challengePosition) {
      if (typeof challengeForPosition === 'function') {
        const parts = t.dataset.challengePosition.split('|');
        challengeForPosition(S, parts[0], parts.slice(1).join('|'));
      }
      render(); return;
    }

    if (t.dataset.killNpc) {
      if (typeof killNPC === 'function') killNPC(S, t.dataset.killNpc);
      render(); return;
    }

    if (t.dataset.auctionNextTurn) {
      if (typeof auctionNextTurn === 'function') auctionNextTurn(S);
      render(); return;
    }

    if (t.dataset.gamble)     { if(typeof resolveGamble==='function')resolveGamble(S,t.dataset.gamble); render();return; }
    if (t.dataset.gambleDice) { if(typeof resolveGamblingDice==='function')resolveGamblingDice(S,t.dataset.gambleDice); render();return; }
    if (t.dataset.selfAuction){ if(typeof resolveSelfAuction==='function')resolveSelfAuction(S,t.dataset.selfAuction); render();return; }
    if (t.dataset.exchange)   { if(typeof resolveExchange==='function')resolveExchange(S,t.dataset.exchange); render();return; }
    if (t.dataset.sendDisciple!==undefined) { if(typeof sendDiscipleOut==='function')sendDiscipleOut(S,parseInt(t.dataset.sendDisciple)); render();return; }
    if (t.dataset.pickSaveSlot!==undefined) { if(typeof handlePickSaveSlot==='function')handlePickSaveSlot(S,t.dataset.pickSaveSlot); render();return; }

    if (t.dataset.schemeTarget) { if(typeof schemeAgainstLeader==='function')schemeAgainstLeader(S,t.dataset.schemeTarget); render();return; }
    if (t.dataset.setGender)    { S.gender=t.dataset.setGender; render();return; }

    if (t.dataset.npcTalk) {
      const nm = t.dataset.npcTalk;
      if (!S.npcInteractThisYear) S.npcInteractThisYear = {};
      S.npcInteractThisYear[nm] = (S.npcInteractThisYear[nm]||0) + 1;
      if (!S.sectMembers) S.sectMembers = {};
      S.sectMembers[nm] = Math.min(100, (S.sectMembers[nm]||0) + 3);
      _ensureRelation(S, nm, 5, 3, 0);
      showToast(`💬 Talked with ${nm}. Bond +3`, 'warn', 2000);
      render(); return;
    }

    if (t.dataset.npcRomance) {
      const nm = t.dataset.npcRomance;
      if (!S.npcInteractThisYear) S.npcInteractThisYear = {};
      S.npcInteractThisYear[nm] = (S.npcInteractThisYear[nm]||0) + 1;
      if (!S.sectMembers) S.sectMembers = {};
      S.sectMembers[nm] = Math.min(100, (S.sectMembers[nm]||0) + 8);
      _ensureRelation(S, nm, 8, 5, 0);
      showToast(`💕 Pursuing ${nm}…`, 'good', 2500);
      render(); return;
    }

    if (t.dataset.npcDao) {
      const nm = t.dataset.npcDao;
      const bond = (S.sectMembers||{})[nm]||0;
      if (bond >= 40 && !S.family.daoComp) {
        S.family.daoComp = nm;
        writeLog(S,'Dao Bond Forged',`${nm} accepted.`,'Bonds','good');
        showToast(`☯️ ${nm} — Dao Bond forged!`, 'good', 4000);
      } else showToast('Need bond 40+ for a Dao Bond', 'bad');
      render(); return;
    }

    if (t.dataset.npcConfront) {
      const nm = t.dataset.npcConfront;
      if (!S.npcInteractThisYear) S.npcInteractThisYear = {};
      S.npcInteractThisYear[nm] = (S.npcInteractThisYear[nm]||0) + 1;
      if (Math.random() < 0.55) {
        S.stats.social = Math.min(100, (S.stats.social||0) + 4);
        showToast(`⚔️ Stood your ground against ${nm}!`, 'good');
      } else showToast(`😬 ${nm} got the upper hand this time`, 'bad');
      render(); return;
    }

    if (t.dataset.dualCult) {
      const partner = t.dataset.dualCult;
      const bonus = 3 + Math.round(((typeof physique==='function'?physique(S).cultivMult:1)-0.8)*4);
      S.minorQi = (S.minorQi||0) + bonus;
      S.stats.purity = Math.min(100, (S.stats.purity||0) + 2);
      writeLog(S,'Dual Cultivation',`Harmonized qi with ${partner}. +${bonus} qi.`,'Cultivation','good');
      showToast(`☯️ Dual cultivation — Qi +${bonus}`, 'good', 3000);
      render(); return;
    }

    if (t.dataset.educate) {
      const edu = typeof EDUCATION_PLACES !== 'undefined' ? EDUCATION_PLACES.find(e2=>e2.key===t.dataset.educate) : null;
      if (edu) {
        const res = edu.costType==='silver'?S.res.silver:edu.costType==='stones'?S.res.stones:S.res.immortalJade;
        if (res >= edu.cost) {
          if (edu.costType==='silver') S.res.silver -= edu.cost;
          else if (edu.costType==='stones') S.res.stones -= edu.cost;
          else S.res.immortalJade -= edu.cost;
          S.learned = (S.learned||0) + edu.learned;
          S.stats.comprehension = Math.min(100, (S.stats.comprehension||0) + 3);
          writeLog(S,'Education Complete',`Studied at ${edu.name}. Learned +${edu.learned}.`,'Study','good');
          showToast(`📚 Learned +${edu.learned}! Comprehension +3`, 'good', 3000);
        } else showToast('Insufficient funds', 'bad');
      }
      render(); return;
    }

    if (t.dataset.contestEnemy) {
      const en = typeof TERRITORY_ENEMIES !== 'undefined' ? TERRITORY_ENEMIES.find(e2=>e2.key===t.dataset.contestEnemy) : null;
      if (en) contestTerritoryV7(S, en.tier);
      render(); return;
    }

    if (t.dataset.resolveUnique !== undefined || t.dataset.uniqueChoice !== undefined) {
      const idx = parseInt(t.dataset.resolveUnique ?? t.dataset.uniqueChoice);
      if (typeof resolveUniqueEvent === 'function') resolveUniqueEvent(S, idx);
      render(); return;
    }

    // ── Military buy ──
    if (t.dataset.militaryBuy) {
      const m = t.dataset.militaryBuy;
      if (m === 'soldiers') {
        if (S.res.stones >= 100) { S.res.stones -= 100; if(!S.soldierTiers)S.soldierTiers={}; S.soldierTiers.militia=(S.soldierTiers.militia||0)+50; showToast('⚔️ +50 militia soldiers','good'); }
        else showToast('Need 100💎','bad');
      } else if (m === 'general') {
        if (S.res.stones >= 300) { S.res.stones -= 300; S.generals=(S.generals||0)+1; showToast('🌟 General hired!','good'); }
        else showToast('Need 300💎','bad');
      } else if (m === 'alliance') {
        if (S.res.silver >= 200) { S.res.silver -= 200; if(!S.soldierTiers)S.soldierTiers={}; S.soldierTiers.militia=(S.soldierTiers.militia||0)+100; showToast('🤝 +100 allied militia','good'); }
        else showToast('Need 200🪙','bad');
      }
      render(); return;
    }

    // ── action ──
    const action = t.dataset.action;
    if (action) {
      if (action === 'advance-year') {
        if (S.settings.ageConfirm && !confirm('Advance one year?')) return;
        const handlers = { cultivate:resolveCultivate, study:resolveStudy, sect_duty:resolveSectDuty, explore:resolveExplore, market:resolveMarket, romance:resolveRomance, beast:resolveBeast, business:resolveBusiness, job:resolveJob };
        if (S.screen === 'game' && S.overlay !== 'choice') {
          handlers[S.selectedAction]?.(S);
          passiveEffects(S); updateRelations(S);
          if (typeof triggerWandererEvent === 'function') triggerWandererEvent(S);
          if (typeof maybeQueueEvent === 'function') maybeQueueEvent(S);
          S.year++; S.age++;
          S.npcInteractThisYear = {};
          // Elder master teachings every 5 years
          if (S.elderMaster && S.year % 5 === 0) {
            const b = S.elderMaster.bonus;
            if (b.will)          S.stats.will          = Math.min(100, (S.stats.will||0) + 1);
            if (b.comprehension) S.stats.comprehension = Math.min(100, (S.stats.comprehension||0) + 1);
            if (b.body)          S.stats.body          = Math.min(100, (S.stats.body||0) + 1);
            writeLog(S,'Master's Teachings',`${S.elderMaster.name}'s guidance deepens. Stats improved.`,'Sect','good');
          }
          // Update influence
          const rankIdx = typeof SECT_RANKS !== 'undefined' ? SECT_RANKS.findIndex(r=>r.key===S.sect.rankKey) : 0;
          S.stats.influence = Math.min(100, (S.stats.influence||30) + (rankIdx>=0?rankIdx:0) + Math.floor(((S.territories.mortal||0)+(S.territories.spiritual||0)*2)/5));
          if (S.settings.autoSave && S.autoSaveSlot >= 0) saveGame(S, S.autoSaveSlot);
          const cap = typeof lifespanCap === 'function' ? lifespanCap(S) : 120;
          if (S.age >= cap || S.stats.instability >= 95) {
            writeLog(S, S.stats.instability>=95?'Qi Deviation':'Lifespan Exhausted', 'Your story ends here.', 'Legacy', 'bad');
            S.screen = 'dead';
            showToast('Your cultivation journey ends here.', 'bad', 4000);
          }
          if (S.stats.instability >= 80 && S.screen === 'game') showToast(`⚠️ Instability: ${S.stats.instability}/100`, 'bad');
          if (S.minorLevel >= 9 && S.screen === 'game') showToast('🌟 Minor Level 9! Breakthrough ready.', 'warn', 3000);
        }
      }
      else if (action==='attempt-breakthrough')  { attemptBreakthrough(S); }
      else if (action==='start-new-life')        { S=createState(); S.adPhase='new_life'; S.screen='ad'; startAdCountdown(); }
      else if (action==='start-random-life')     { S=createState(); if(typeof rollRandomLife==='function')rollRandomLife(S); S.adPhase='new_life'; S.screen='ad'; startAdCountdown(); }
      else if (action==='finish-ad')             { clearInterval(adInterval); S.screen='setup'; if(!S._randomLife&&typeof rollPhysique==='function')S.selectedPhysique=rollPhysique(); }
      else if (action==='claim-windfall')        { clearInterval(adInterval); if(typeof claimWindfall==='function')claimWindfall(S); showToast('✨ Windfall claimed!','warn',3000); }
      else if (action==='activate-windfall')     { if(typeof activateWindfall==='function')activateWindfall(S); startAdCountdown(); }
      else if (action==='open-profile')          { S.overlay='profile'; }
      else if (action==='open-history')          { S.overlay='history'; }
      else if (action==='close-overlay')         { S.overlay=null; S.overlayData=null; }
      else if (action==='close-breakthrough')    { S.overlay=null; S.overlayData=null; }
      else if (action==='close-subscreen')       { S.subscreen=null; }
      else if (action==='close-auction')         { S.overlay=null; }
      else if (action==='noop')                  { return; }
      else if (action==='setup-gender-next')     { S.setupStep=0; }
      else if (action==='setup-next') {
        if (S.setupStep===0 && S.selectedOrigin)          S.setupStep=1;
        else if (S.setupStep===1 && S.selectedTemperament) S.setupStep=2;
        else if (S.setupStep===2) {
          if (S.selectedPath==='wanderer') { if(typeof startGame==='function')startGame(S); }
          else if (S.selectedPath==='sect') S.setupStep=3;
        }
        else if (S.setupStep===3 && S.selectedSect) { if(typeof startGame==='function')startGame(S); }
      }
      else if (action==='open-save' || action==='open-save-title' || action==='open-continue-life') { S.overlay='save'; if(action==='open-continue-life')S.overlay='continue'; }
      else if (action==='commit-bid')            { if(typeof commitBid==='function')commitBid(S); }
      else if (action==='open-crime')            { S.overlay='crime'; }
      else if (action==='open-hatch')            { S.overlay='hatch'; }
      else if (action==='open-jobmenu')          { S.overlay='jobmenu'; }
      else if (action==='leave-sect')            { if(typeof leaveSect==='function')leaveSect(S); }
      else if (action==='take-disciple')         { if(typeof addDisciple==='function')addDisciple(S); }
      else if (action==='break-up')              { if(typeof breakUpWithSpouse==='function')breakUpWithSpouse(S); }
      else if (action==='family-time') {
        if (S.family.spouse) {
          if (Math.random() < 0.38) {
            S.family.heirs = (S.family.heirs||0) + 1;
            writeLog(S,'Heir Born','A child was born into your household.','Bonds','good');
            showToast('👶 An heir was born!', 'good', 4000);
          } else {
            S.stats.stability = Math.min(100, (S.stats.stability||0) + 2);
            showToast('🏡 Peaceful family time. Bonds grew stronger.', 'warn', 2000);
          }
        }
      }
      else if (action==='seek-second-wife') {
        if ((S.stats.influence||0) >= 60 && (S.inv.properties||[]).length >= 2 && S.family.spouse) {
          const pool = typeof RELATIONS_POOL !== 'undefined' ? RELATIONS_POOL.filter(r=>r.romanceable) : [];
          const cand = pool[Math.floor(Math.random()*pool.length)];
          const name = cand?.name || 'Cultivator Lu';
          if (!S.family.wives) S.family.wives = [];
          S.family.wives.push({name, type:'Second Wife', bond:30});
          S.res.silver = Math.max(0, S.res.silver - 500);
          writeLog(S,'Second Marriage',`${name} joined your household.`,'Bonds','good');
          showToast(`💑 ${name} accepted as second wife!`, 'good', 4000);
        } else showToast('Need 60+ influence, 2 properties, and a primary spouse', 'bad');
      }
    }

    // ── Navigation ──
    if (t.dataset.origin)      { S.selectedOrigin=t.dataset.origin; }
    if (t.dataset.temperament) { S.selectedTemperament=t.dataset.temperament; }
    if (t.dataset.path)        { S.selectedPath=t.dataset.path; }
    if (t.dataset.tab)         { S.activeTab=t.dataset.tab; S.subscreen=null; }
    if (t.dataset.open)        { S.subscreen=t.dataset.open; }
    if (t.dataset.selectAction){ S.selectedAction=t.dataset.selectAction; }

    // ── Purchases ──
    if (t.dataset.buyItem)     { buyShopItem(S, t.dataset.buyItem); }
    if (t.dataset.buyNope)     { showToast('Not enough resources', 'bad', 1800); }

    if (t.dataset.buyArtifact) {
      const [key, price] = t.dataset.buyArtifact.split('_');
      if (!S.inv.artifacts.includes(key) && S.res.stones >= parseInt(price)) {
        S.res.stones -= parseInt(price);
        S.inv.artifacts.push(key);
        const a = byKey(ARTIFACTS, key);
        if (a) Object.entries(a.bonus).forEach(([k,v]) => { if (k in S.stats) S.stats[k] = Math.min(100, S.stats[k] + Math.round(v*0.4)); });
        showToast(`💎 ${a?.name||key} acquired!`, 'good');
      } else showToast('Cannot purchase', 'bad');
    }

    if (t.dataset.buyLux) {
      if (typeof resolveLuxuryPurchase === 'function') resolveLuxuryPurchase(S, t.dataset.buyLux);
    }

    if (t.dataset.launchBiz) { if(typeof launchBusiness==='function')launchBusiness(S, t.dataset.launchBiz); }

    if (t.dataset.buyProperty) {
      const p = typeof PROPERTIES !== 'undefined' ? PROPERTIES.find(x=>x.key===t.dataset.buyProperty) : null;
      if (p && !(S.inv.properties||[]).includes(p.key)) {
        const okJ = p.costJade && S.res.immortalJade >= p.costJade;
        const okSt = p.costStones && S.res.stones >= p.costStones;
        const okSi = p.costSilver && S.res.silver >= p.costSilver;
        if (okJ)  { S.res.immortalJade -= p.costJade;  if(!S.inv.properties)S.inv.properties=[]; S.inv.properties.push(p.key); showToast(`🏠 ${p.name}!`,'good'); }
        else if (okSt) { S.res.stones -= p.costStones; if(!S.inv.properties)S.inv.properties=[]; S.inv.properties.push(p.key); showToast(`🏠 ${p.name}!`,'good'); }
        else if (okSi) { S.res.silver -= p.costSilver; if(!S.inv.properties)S.inv.properties=[]; S.inv.properties.push(p.key); showToast(`🏠 ${p.name}!`,'good'); }
        else showToast('Insufficient funds','bad');
      }
    }

    if (t.dataset.travel) {
      const l = typeof LOCATIONS !== 'undefined' ? byKey(LOCATIONS, t.dataset.travel) : null;
      if (l && l.stage > 0 && S.realmIndex < l.stage*6) showToast(`Need Realm ${l.stage*6+1}+ for ${l.name}`,'bad');
      else if (l) {
        if (S.locationKey !== t.dataset.travel) {
          writeLog(S,'Relocation',`Moved to ${l.name}.`,'World','neutral');
          showToast(`📍 ${l.name}`,'warn',2000);
        }
        S.locationKey = t.dataset.travel;
      }
    }

    if (t.dataset.startAuction) { if(typeof startAuction==='function')startAuction(S, t.dataset.startAuction); }
    if (t.dataset.bidRaise)     { if(typeof raiseBid==='function'){raiseBid(S,parseInt(t.dataset.bidRaise));if(S.auctionBidHistory)S.auctionBidHistory.push({who:'you',text:`You bid ${S.auction?.playerBid}💎`});} }

    if (t.dataset.hatch) {
      if (typeof hatchBeast === 'function') hatchBeast(S, t.dataset.hatch);
      const b = byKey(BEASTS, t.dataset.hatch);
      showToast(`🐉 ${b?.name||'Beast'} bonded!`, 'good', 4000);
      S.overlay = null;
    }

    if (t.dataset.choose) { if(typeof resolveYearChoice==='function')resolveYearChoice(S,t.dataset.choose); }

    if (t.dataset.giftRel) {
      if (S.res.stones >= 10) {
        S.res.stones -= 10;
        const r = S.relations.find(x => x.key === t.dataset.giftRel);
        if (r) { r.bond = Math.min(100, r.bond+8); r.trust = Math.min(100,(r.trust||0)+5); r.giftCooldown=2; showToast('🎁 Gift — Bond +8','good'); }
      } else showToast('Need 10💎','bad');
    }

    if (t.dataset.propose) {
      const r = S.relations.find(x => x.key === t.dataset.propose);
      if (r && r.bond >= 40 && !S.family.spouse) {
        S.family.spouse = r.name;
        S.metrics.marriages = (S.metrics.marriages||0) + 1;
        writeLog(S,'Proposal Accepted',`${r.name} accepted.`,'Bonds','good');
        showToast(`💍 ${r.name} accepted your proposal!`,'good',4000);
        S.overlay = null;
      } else showToast('Bond not deep enough (need 40+)','bad');
    }

    if (t.dataset.daoComp) {
      const r = S.relations.find(x => x.key === t.dataset.daoComp);
      if (r && (r.trust||0) >= 50 && !S.family.daoComp) {
        S.family.daoComp = r.name;
        writeLog(S,'Dao Bond',`${r.name} bonded.`,'Bonds','good');
        showToast(`☯️ ${r.name} — Dao Bond!`,'good',4000);
        S.overlay = null;
      } else showToast('Need trust 50+','bad');
    }

    if (t.dataset.challenge) {
      const r = S.relations.find(x => x.key === t.dataset.challenge);
      if (r) {
        if (Math.random() < 0.5 + (S.stats.will||0)*0.003) {
          r.bond = Math.max(-100, r.bond-12); S.stats.reputation = Math.min(100,(S.stats.reputation||0)+9);
          showToast('⚔️ Won the duel!','good');
        } else {
          S.stats.body = Math.max(0, S.stats.body-5); S.stats.instability = Math.min(100, S.stats.instability+8);
          showToast('💔 Lost the duel','bad');
        }
        S.overlay = null;
      }
    }

    if (t.dataset.talkRel) {
      const r = S.relations.find(x => x.key === t.dataset.talkRel);
      if (r) { r.bond = Math.min(100, r.bond+3); r.trust = Math.min(100,(r.trust||0)+2); showToast(`💬 Bond +3`,'warn',2000); }
      S.overlay = null;
    }

    if (t.dataset.toggle)    { S.settings[t.dataset.toggle]=!S.settings[t.dataset.toggle]; if(t.dataset.toggle==='autoSave')S.autoSaveSlot=S.settings.autoSave?0:-1; showToast(`${t.dataset.toggle}: ${S.settings[t.dataset.toggle]?'ON':'OFF'}`,'warn',1600); }
    if (t.dataset.openRel)   { S.overlay='rel-detail'; S.overlayData=t.dataset.openRel; }
    if (t.dataset.saveSlot !== undefined) { if(saveGame(S,parseInt(t.dataset.saveSlot)))showToast(`💾 Saved to Slot ${parseInt(t.dataset.saveSlot)+1}`,'good'); S.overlay=null; }
    if (t.dataset.loadSlot !== undefined) { const ld=loadGame(parseInt(t.dataset.loadSlot)); if(ld){S=ld;S.overlay=null;showToast('📂 Life loaded!','good');}else showToast('Failed to load','bad'); }
    if (t.dataset.deleteSlot !== undefined) { deleteSave(parseInt(t.dataset.deleteSlot)); showToast('🗑 Deleted','bad',1600); }

    // ── Sect join ──
    if (t.dataset.joinSect) {
      const sec = byKey(SECTS, t.dataset.joinSect);
      if (sec && !S.sect.joined && S.realmIndex >= (sec.allowRealm||0)) {
        S.sect.joined = true; S.sect.key = t.dataset.joinSect; S.sect.rankKey = 'layman';
        if (sec.stats) Object.entries(sec.stats).forEach(([k,v]) => { if(k in S.stats) S.stats[k] = Math.min(100, S.stats[k] + Math.round(v*0.5)); });
        const sm = typeof MANUALS !== 'undefined' ? MANUALS.find(m => m.reqRealm===0 && !S.inv.manuals.includes(m.key)) : null;
        if (sm) S.inv.manuals.push(sm.key);
        const members = typeof getSectMembers === 'function' ? getSectMembers(S) : [];
        for (const m of members.slice(0,2)) {
          if (!S.relations.find(r => r.name === m.name))
            S.relations.push({...m, key:'sect_'+m.name.replace(/\s/g,'_'), bond:10, trust:10, events:[], giftCooldown:0});
        }
        writeLog(S,'Sect Joined',`Now a Layman Disciple of ${sec.name}.`,'Sect','good');
        showToast(`⛩ Joined ${sec.name}!`,'good',3500);
        v7GrantSectBonus(S);
      }
    }

    if (t.dataset.setJob) { S.currentJob = t.dataset.setJob; S.overlay = null; const j = typeof MORTAL_JOBS !== 'undefined' ? byKey(MORTAL_JOBS, t.dataset.setJob) : null; showToast(`💼 ${j?.name||t.dataset.setJob}`,'warn',2000); }

    if (t.dataset.sectAction) {
      const sa = t.dataset.sectAction;
      if (sa==='assign'||sa==='assign-junior') { S.sect.favor=Math.min(100,(S.sect.favor||0)+8); S.res.merit=(S.res.merit||0)+15; showToast('⛩ Merit +15, Favor +8','good'); }
      else if (sa==='donate') { if(S.res.stones>=100){S.res.stones-=100;S.res.merit=(S.res.merit||0)+15;S.sect.favor=Math.min(100,(S.sect.favor||0)+8);showToast('💎 Donated — Merit +15','good');}else showToast('Need 100💎','bad'); }
      else if (sa==='scheme') { if(Math.random()<0.55){S.res.merit=(S.res.merit||0)+25;showToast('😈 Scheme — Merit +25','good');}else{S.sect.rivalryPressure=Math.min(100,(S.sect.rivalryPressure||0)+15);showToast('⚠️ Scheme backfired!','bad');} }
      else if (sa==='request-manual') {
        const cost = 200 + S.realmIndex*50;
        if ((S.res.merit||0) >= cost) {
          const el = typeof MANUALS !== 'undefined' ? MANUALS.filter(m=>m.reqRealm<=S.realmIndex&&!S.inv.manuals.includes(m.key)) : [];
          if (el.length) { S.inv.manuals.push(el[Math.floor(Math.random()*el.length)].key); S.res.merit-=cost; showToast('📖 Manual acquired!','good',3500); }
          else showToast('No eligible manuals','bad');
        } else showToast(`Need ${cost} merit`,'bad');
      }
      else if (sa==='faction') { if(Math.random()<0.6){S.sect.favor=Math.min(100,(S.sect.favor||0)+20);showToast('🤝 Favor +20','good');}else{S.sect.rivalryPressure=Math.min(100,(S.sect.rivalryPressure||0)+20);showToast('😬 Wrong faction!','bad');} }
    }

    if (t.dataset.commitCrime) { if(typeof commitCrime==='function')commitCrime(S,t.dataset.commitCrime); }
    if (t.dataset.refinePill)  { if(typeof refinePill==='function')refinePill(S,t.dataset.refinePill); }
    if (t.dataset.forgeItem)   { if(typeof forgeItem==='function')forgeItem(S,t.dataset.forgeItem); }

    if (t.dataset.dynastyAction) {
      const da = t.dataset.dynastyAction;
      if (da==='campaign') contestTerritoryV7(S,'mortal');
      else if (da==='alliance') { if(S.res.silver>=200){S.res.silver-=200;S.territories.mortal=(S.territories.mortal||0)+1;if(typeof updateDynastyTier==='function')updateDynastyTier(S);showToast('🤝 Territory +1','good');}else showToast('Need 200🪙','bad'); }
      else if (da==='edict') { if((S.res.merit||0)>=50){S.res.merit-=50;S.sect.favor=Math.min(100,(S.sect.favor||0)+10);showToast('📜 Edict — Favor +10','good');}else showToast('Need 50 merit','bad'); }
    }

    if (t.dataset.immortalAction) {
      if (S.realmIndex>=12 && Math.random()<0.45) { S.stats.reputation=Math.min(100,(S.stats.reputation||0)+15); S.res.immortalJade+=3; showToast('👑 Heavenly position gained!','good',4000); }
      else { S.stats.instability=Math.min(100,S.stats.instability+15); showToast('Contest failed','bad'); }
    }

    if (t.dataset.seekImmortalManual) {
      if (S.realmIndex>=9) {
        const el = typeof MANUALS !== 'undefined' ? MANUALS.filter(m=>m.rarity==='Mythic'&&m.reqRealm<=S.realmIndex&&!S.inv.manuals.includes(m.key)) : [];
        if (el.length && S.res.immortalJade>=5) { S.res.immortalJade-=5; S.inv.manuals.push(el[Math.floor(Math.random()*el.length)].key); showToast('🌌 Mythic manual!','good',4000); }
        else if (!el.length) showToast('No mythic manuals available','bad');
        else showToast('Need 5 Immortal Jade','bad');
      } else showToast('Requires Realm 10+','bad');
    }

    if (t.dataset.buyBeastEgg) {
      const [key, price] = t.dataset.buyBeastEgg.split('_');
      if (!S.beast.activeKey && !S.beast.pendingEgg && S.res.stones >= parseInt(price)) {
        S.res.stones -= parseInt(price);
        S.beast.pendingEgg = true;
        const others = BEASTS.filter(b=>b.reqRealm<=S.realmIndex&&b.key!==key).sort(()=>Math.random()-0.5).slice(0,2).map(b=>b.key);
        S.beast.joinEggChoices = [key, ...others];
        writeLog(S,'Beast Egg Acquired','A beast egg ready to hatch.','Beast','good');
        showToast('🥚 Beast egg acquired — go hatch it!','good',3500);
        S.overlay = 'hatch';
      } else showToast('Cannot buy beast egg now','bad');
    }

    if (t.dataset.beastAction) {
      const ba = t.dataset.beastAction;
      if (ba==='feed') { if(S.res.stones>=60){S.res.stones-=60;S.beast.loyalty=Math.min(100,S.beast.loyalty+20);showToast('🐾 Fed — Loyalty +20','good');}else showToast('Need 60💎','bad'); }
      else if (ba==='upgrade-chain') { if(S.res.stones>=70){S.res.stones-=70;const b=byKey(BEASTS,S.beast.activeKey);if(b)b.cultivBonus+=3;showToast('⛓️ Upgraded — +3 cultiv bonus','good');}else showToast('Need 70💎','bad'); }
      else if (ba==='release') {
        if (S.beast.activeKey) {
          const b = byKey(BEASTS, S.beast.activeKey);
          writeLog(S,'Beast Released',`${b?.name||'Your beast'} was set free. A bittersweet farewell.`,'Beast','neutral');
          S.beast.activeKey = null; S.beast.loyalty = 0; S.beast.score = 0;
          showToast('🔓 Beast released into the wild','warn',3000);
        }
      }
      else if (ba==='sacrifice') {
        if (S.beast.activeKey) {
          const b = byKey(BEASTS, S.beast.activeKey);
          S.minorQi = (S.minorQi||0) + 50;
          S.stats.comprehension = Math.min(100, (S.stats.comprehension||0) + 5);
          S.stats.karma = Math.max(-100, (S.stats.karma||0) - 5);
          writeLog(S,'Beast Sacrificed',`${b?.name||'Beast'} sacrificed. Its core merged with your qi.`,'Beast','bad');
          S.beast.activeKey = null; S.beast.loyalty = 0; S.beast.score = 0;
          showToast('☠️ Beast sacrificed — Qi +50, Comprehension +5','warn',4000);
        }
      }
    }

    // ── Sect key (generic) — LAST so specific ones match first ──
    if (t.dataset.sect) { S.selectedSect = t.dataset.sect; }

    render();
  };

  // Swipe back
  let _swX = 0;
  if (!document.getElementById('swipe-catcher')) {
    const sw = document.createElement('div');
    sw.id = 'swipe-catcher';
    sw.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0';
    document.body.appendChild(sw);
  }
  const swipe = document.getElementById('swipe-catcher');
  if (swipe) {
    swipe.addEventListener('touchstart', e => { _swX = e.touches[0].clientX; }, {passive:true});
    swipe.addEventListener('touchend', e => {
      if (e.changedTouches[0].clientX - _swX > 50) {
        if (S.subscreen) { S.subscreen=null; render(); }
        else if (S.overlay) { S.overlay=null; S.overlayData=null; render(); }
      }
    }, {passive:true});
  }
};

// ─── HELPER: ensure NPC in relations tab ─────────────────────
function _ensureRelation(s, name, bond, trust, giftCooldown) {
  if (s.relations.find(r => r.name === name)) return false; // already exists
  const m = (typeof getSectMembers === 'function' ? getSectMembers(s) : []).find(mm => mm.name === name)
         || {icon:'🧑', role:'Sect Member', desire:'Grow stronger.'};
  s.relations.push({
    key: 'sect_' + name.replace(/\s/g,'_'),
    name, icon:m.icon||'🧑', bond, trust,
    role: m.role||'Sect Member', desire: m.desire||'',
    giftCooldown, realmIdx: m.realmIdx||0
  });
  return true; // was new
}

// ─── PATCH: territory war button in world tab ─────────────────
const _origRWT = renderWorldTab;
renderWorldTab = function(s) {
  let h = _origRWT(s);
  // Inject territory war button that uses v7 subscreen
  h = h.replace(/data-open="territory-wars?"/g, 'data-open="territory-war"');
  return h;
};

})(); // end patchV7Final

</script>
</body>
